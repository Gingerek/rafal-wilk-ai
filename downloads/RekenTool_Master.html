<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Rafał Wilk</title>
  <style>
    html, body {
      height: 100%;
      margin: 0;
      font-family: Arial, Helvetica, sans-serif;
      background: #f5f6f8;
    }
        :root{ --primary:#fb8c00; }
.topbar {
      position: sticky;
      top: 0;
      z-index: 10;
      display: flex;
      gap: 12px;
      align-items: center;
      padding: 10px 14px;
      background: white;
      border-bottom: 1px solid rgba(0,0,0,.12);
      box-shadow: 0 1px 0 rgba(0,0,0,.04);
    }
    .topbar .label {
      font-weight: 700;
      letter-spacing: .2px;
    }
    select {
      padding: 8px 10px;
      border-radius: 8px;
      border: 1px solid rgba(0,0,0,.2);
      background: white;
      font-size: 14px;
      min-width: 260px;
    }
    .hint {
      margin-left: auto;
      color: rgba(0,0,0,.62);
      font-size: 12px;
    }
    .framewrap {
      height: calc(100% - 52px);
    }
    iframe {
      width: 100%;
      height: 100%;
      border: 0;
      background: white;
    }
  
.master-disclaimer{
      margin: 12px 14px 0 14px;
      display:flex;
      gap:12px;
      align-items:flex-start;
      padding:12px 14px;
      background:#ffffff;
      border:1px solid rgba(0,0,0,.08);
      border-left:4px solid #fb8c00;
      border-radius:14px;
      box-shadow:0 6px 18px rgba(0,0,0,.08);
    }
    .master-disclaimer svg{width:22px;height:22px;flex:0 0 auto;color:#fb8c00;margin-top:1px;}
    .master-disclaimer .l1{font-weight:700;font-size:13px;line-height:1.25;color:#0b1220;letter-spacing:.1px;}
    .master-disclaimer .l2{font-weight:600;font-size:12.5px;line-height:1.25;color:rgba(0,0,0,.62);}
    @media (max-width:520px){
      .master-disclaimer{margin:10px 10px 0 10px;padding:10px 12px;border-radius:14px;}
      .master-disclaimer svg{width:20px;height:20px;}
    }
  /* Hide bureau selector bar (single bureau) */
  


  /* ===== Agency selector (matches provided screenshot) ===== */
  body { display:flex; flex-direction:column; }
  .framewrap { flex: 1; min-height: 0; height: auto; }

  .topbar { align-items: flex-start; }
  .topbar .agency-group{ display:flex; flex-direction:column; gap:6px; }
  .topbar .label{
    font-weight: 800;
    letter-spacing: .6px;
    text-transform: uppercase;
    font-size: 16px;
    color:#1b1f24;
  }
  #bureauSelect{
    padding: 12px 14px;
    border-radius: 12px;
    border: 1px solid rgba(0,0,0,.18);
    background: #fff;
    font-size: 18px;
    font-weight: 700;
    width: clamp(280px, 34vw, 520px);
    max-width: 100%;
  }
  #bureauSelect:focus{
    outline: none;
    border-color: var(--primary);
    box-shadow: 0 0 0 3px rgba(251,140,0,.18);
  }
  /* Hide helper copy (not shown on mock) */
  .hint{ display:none; }

  .topbar{ flex-wrap:wrap; }
  .custom-mercap-group{
    display:flex;
    flex-direction:column;
    gap:6px;
  }
  .custom-mercap-group[hidden]{ display:none !important; }
  .custom-mercap-row{
    display:flex;
    flex-direction:column;
    gap:6px;
    min-width:min(320px, 100%);
  }
  #customMarkupPct,
  #customMultiplierInput{
    padding: 12px 14px;
    border-radius: 12px;
    border: 1px solid rgba(0,0,0,.18);
    background: #fff;
    font-size: 18px;
    font-weight: 700;
    width: clamp(220px, 22vw, 340px);
    max-width: 100%;
  }
  #customMarkupPct:focus,
  #customMultiplierInput:focus{
    outline: none;
    border-color: var(--primary);
    box-shadow: 0 0 0 3px rgba(251,140,0,.18);
  }
  .custom-multiplier-group{
    display:flex;
    flex-direction:column;
    gap:6px;
  }
  .custom-multiplier-group[hidden]{ display:none !important; }
  .custom-mercap-preview{
    font-size: 13px;
    font-weight: 700;
    color:#374151;
    padding-left: 2px;
  }
  .custom-mercap-preview .value{
    color:#111827;
  }



body.dark{
  background:#0b1220;
  color:#e5e7eb;
}
body.dark .topbar{
  background:linear-gradient(180deg, rgba(15,23,42,0.96), rgba(15,23,42,0.90));
  border-bottom:1px solid rgba(226,232,240,0.14);
  box-shadow:0 1px 0 rgba(255,255,255,0.04) inset, 0 10px 24px rgba(0,0,0,0.28);
}
body.dark .topbar .label,
body.dark .custom-mercap-preview,
body.dark .custom-mercap-preview .value{
  color:#e5e7eb;
}
body.dark #bureauSelect,
body.dark #customMarkupPct,
body.dark #customMultiplierInput{
  background:rgba(15,23,42,0.92);
  color:#f8fafc;
  border:1px solid rgba(226,232,240,0.18);
  box-shadow:0 1px 0 rgba(255,255,255,0.04) inset, 0 8px 18px rgba(0,0,0,0.24);
}
body.dark #bureauSelect:focus,
body.dark #customMarkupPct:focus,
body.dark #customMultiplierInput:focus{
  box-shadow:0 0 0 3px rgba(251,140,0,.18), 0 8px 18px rgba(0,0,0,0.24);
}
body.dark iframe{
  background:#0b1220;
}



/* ===== Asystent Assistant — chat only, no voice ===== */
.rt-chat-launcher{
  position:fixed;
  right:20px;
  bottom:20px;
  z-index:999999;
  border:0;
  border-radius:999px;
  padding:12px 16px 12px 12px;
  display:flex;
  align-items:center;
  gap:10px;
  background:linear-gradient(135deg,#ff9800,#fb8c00);
  color:#111827;
  font-family:Arial, Helvetica, sans-serif;
  font-weight:900;
  cursor:pointer;
  box-shadow:0 16px 38px rgba(251,140,0,.38),0 8px 20px rgba(15,23,42,.22);
}
.rt-chat-launcher .rt-chat-mark{
  width:34px;
  height:34px;
  border-radius:50%;
  display:grid;
  place-items:center;
  background:#111827;
  color:#fff;
  font-weight:900;
  letter-spacing:-.04em;
}
.rt-chat-panel{
  position:fixed;
  right:20px;
  bottom:86px;
  width:min(440px,calc(100vw - 28px));
  height:min(640px,calc(100vh - 112px));
  z-index:999998;
  display:none;
  flex-direction:column;
  overflow:hidden;
  border-radius:24px;
  border:1px solid rgba(17,24,39,.10);
  background:#fff;
  color:#111827;
  font-family:Arial, Helvetica, sans-serif;
  box-shadow:0 30px 80px rgba(15,23,42,.28);
}
.rt-chat-panel.open{display:flex}
.rt-chat-head{
  padding:15px 16px;
  display:flex;
  align-items:center;
  justify-content:space-between;
  gap:12px;
  border-bottom:1px solid rgba(17,24,39,.08);
  background:linear-gradient(180deg,#ffffff,#fff7ed);
}
.rt-chat-brand{
  display:flex;
  align-items:center;
  gap:11px;
  min-width:0;
}
.rt-chat-logo{
  width:38px;
  height:38px;
  border-radius:50%;
  display:grid;
  place-items:center;
  background:#111827;
  color:#fff;
  font-weight:900;
  box-shadow:0 10px 22px rgba(251,140,0,.30);
}
.rt-chat-name{
  font-weight:900;
  font-size:15px;
  line-height:1.1;
}
.rt-chat-sub{
  margin-top:3px;
  color:#6b7280;
  font-size:12px;
  font-weight:700;
}
.rt-chat-titleblock{display:none!important;}
.rt-chat-name,.rt-chat-sub{display:none!important;}
.rt-chat-head-actions{
  display:flex;
  align-items:center;
  gap:8px;
  flex-shrink:0;
}
.rt-chat-clear{
  height:36px;
  border-radius:12px;
  border:1px solid rgba(251,140,0,.30);
  background:#fff;
  color:#111827;
  cursor:pointer;
  font-weight:900;
  font-size:12px;
  padding:0 11px;
}
.rt-chat-ai{
  height:36px;
  border-radius:12px;
  border:1px solid rgba(17,24,39,.14);
  background:#111827;
  color:#fff;
  cursor:pointer;
  font-weight:900;
  font-size:12px;
  padding:0 12px;
  box-shadow:0 10px 22px rgba(17,24,39,.18);
}
.rt-chat-ai.on{
  background:linear-gradient(135deg,#f59e0b,#fb923c);
  color:#111827;
  border-color:rgba(251,140,0,.55);
}
.rt-chat-close{
  width:36px;
  height:36px;
  border-radius:12px;
  border:1px solid rgba(17,24,39,.10);
  background:#fff;
  cursor:pointer;
  font-weight:900;
  font-size:18px;
}
.rt-chat-messages{
  flex:1;
  overflow:auto;
  padding:14px;
  background:linear-gradient(180deg,#ffffff,#f8fafc);
}
.rt-chat-msg{
  max-width:92%;
  margin:0 0 10px;
  padding:11px 12px;
  border-radius:16px;
  font-size:13px;
  line-height:1.46;
  white-space:pre-wrap;
  word-break:break-word;
}
.rt-chat-msg.user{
  margin-left:auto;
  background:#111827;
  color:#fff;
  border-bottom-right-radius:6px;
}
.rt-chat-msg.bot{
  background:#fff7ed;
  color:#111827;
  border:1px solid rgba(251,140,0,.22);
  border-bottom-left-radius:6px;
}
.rt-chat-msg.bot strong{font-weight:900}
.rt-chat-quick{
  display:flex;
  gap:8px;
  flex-wrap:wrap;
  padding:10px 12px 0;
  background:#f8fafc;
  border-top:1px solid rgba(17,24,39,.06);
}
.rt-chat-chip{
  border:1px solid rgba(251,140,0,.28);
  background:#fff;
  color:#111827;
  border-radius:999px;
  padding:8px 10px;
  font-size:12px;
  font-weight:800;
  cursor:pointer;
}
.rt-chat-inputbar{
  display:flex;
  gap:9px;
  padding:12px;
  border-top:1px solid rgba(17,24,39,.08);
  background:#fff;
}
.rt-chat-input{
  flex:1;
  min-width:0;
  resize:none;
  border:1px solid rgba(17,24,39,.13);
  border-radius:16px;
  padding:11px 12px;
  font:600 13px/1.35 Arial, Helvetica, sans-serif;
  color:#111827;
  background:#fff;
  max-height:110px;
}
.rt-chat-input:focus{
  outline:none;
  border-color:#fb8c00;
  box-shadow:0 0 0 3px rgba(251,140,0,.16);
}
.rt-chat-send{
  width:48px;
  border:0;
  border-radius:16px;
  background:#fb8c00;
  color:#111827;
  font-weight:900;
  cursor:pointer;
  box-shadow:0 8px 20px rgba(251,140,0,.25);
}
.rt-chat-mini{
  margin-top:8px;
  padding-top:8px;
  border-top:1px dashed rgba(17,24,39,.14);
  color:#374151;
  font-size:12px;
}
body.dark .rt-chat-panel{
  background:#111827;
  color:#f9fafb;
  border-color:rgba(255,255,255,.10);
  box-shadow:0 30px 80px rgba(0,0,0,.45);
}
body.dark .rt-chat-head{
  background:linear-gradient(180deg,#111827,#1f2937);
  border-bottom-color:rgba(255,255,255,.10);
}
body.dark .rt-chat-sub{color:#cbd5e1}
body.dark .rt-chat-close,
body.dark .rt-chat-clear,
body.dark .rt-chat-chip,
body.dark .rt-chat-input{
  background:#0b1220;
  color:#f9fafb;
  border-color:rgba(255,255,255,.12);
}
body.dark .rt-chat-messages{background:linear-gradient(180deg,#0b1220,#111827)}
body.dark .rt-chat-msg.bot{
  background:#1f2937;
  color:#f9fafb;
  border-color:rgba(251,140,0,.28);
}
body.dark .rt-chat-quick,
body.dark .rt-chat-inputbar{
  background:#111827;
  border-color:rgba(255,255,255,.08);
}
body.dark .rt-chat-mini{color:#cbd5e1;border-top-color:rgba(255,255,255,.14)}
@media (max-width: 560px){
  .rt-chat-panel{
    right:10px;
    left:10px;
    bottom:76px;
    width:auto;
    height:min(620px,calc(100vh - 92px));
    border-radius:22px;
  }
  .rt-chat-launcher{
    right:12px;
    bottom:12px;
  }
}

  #customMultiplierGroup[hidden]{display:flex!important;}

        data-zero-default="0.00"

    <div class="hint" id="bureauHint"></div>

const sel = document.getElementById('bureauSelect');

    function b64ToUtf8(b64) {
      const binStr = atob(b64);
      const len = binStr.length;
      const bytes = new Uint8Array(len);
      for (let i = 0; i < len; i++) bytes[i] = binStr.charCodeAt(i);
      return new TextDecoder('utf-8').decode(bytes);
    }

    const selectEl = document.getElementById('bureauSelect');
    const frame = document.getElementById('toolFrame');
    const customMarkupGroupEl = document.getElementById('customMarkupGroup');
    const customMultiplierGroupEl = document.getElementById('customMultiplierGroup');
    const customMarkupInputEl = document.getElementById('customMarkupPct');
    const customMultiplierInputEl = document.getElementById('customMultiplierInput');
    const customMarkupPreviewEl = document.getElementById('customMarkupPreview');
    const CUSTOM_MARKUP_STORAGE_KEY = 'rekentool_noname_markup_pct';

    function readDecimalInputValue(inputEl, minValue = 0) {
      const raw = ((inputEl && inputEl.value) || '').trim().replace(',', '.');
      if (!raw) return null;
      const n = Number(raw);
      return (isFinite(n) && n >= minValue) ? n : null;
    }

    function readCustomMarkupPct() {
      return readDecimalInputValue(customMarkupInputEl, 0);
    }

    function readCustomMultiplier() {
      return readDecimalInputValue(customMultiplierInputEl, 0);
    }

    function getEffectiveCustomMarkupPct() {
      const value = readCustomMarkupPct();
      return value === null ? 0 : value;
    }

    function mercapFromPct(pct) {
      const n = Number(pct);
      if (!isFinite(n)) return null;
      return (n + 100) / 100;
    }

    function pctFromMercap(factor) {
      const n = Number(factor);
      if (!isFinite(n)) return null;
      if (n <= 0) return 0;
      return (n * 100) - 100;
    }

    function formatEditableNumber(value, maxDecimals = 6) {
      const n = Number(value);
      if (!isFinite(n)) return '';
      return n.toFixed(maxDecimals).replace(/\.0+$/, '').replace(/(\.\d*?)0+$/, '$1');
    }

    function formatMercapValue(pct) {
      const factor = mercapFromPct(pct);
      if (factor === null) return '-';
      if (Number(pct) === 0) return '0.00';
      const n = Number(pct);
      const decimals = (Math.round(n * 10) % 10 !== 0) ? 3 : 2;
      return factor.toFixed(decimals);
    }

    function syncMultiplierFromPct() {
      if (!customMultiplierInputEl) return;
      customMultiplierInputEl.value = formatMercapValue(getEffectiveCustomMarkupPct());
    }

    function syncPctFromMultiplier() {
      if (!customMarkupInputEl) return false;
      const factor = readCustomMultiplier();
      if (factor === null) return false;
      const pct = pctFromMercap(factor);
      if (pct === null || pct < 0) return false;
      customMarkupInputEl.value = formatEditableNumber(pct);
      return true;
    }

    function updateCustomMarkupPreview() {
      if (!customMarkupPreviewEl) return;
      const lang = getCurrentLang();
      const L = MASTER_I18N[lang] || MASTER_I18N.en;
      const pct = getEffectiveCustomMarkupPct();
      customMarkupPreviewEl.innerHTML = `${L.customMarkupPreviewPrefix || 'Markup'}: <span class="value">${formatMercapValue(pct)}</span>`;
    }

    function toggleCustomMarkupField() {
      const isNoname = selectEl.value === 'noname';
      if (customMarkupGroupEl) customMarkupGroupEl.hidden = !isNoname;
      if (customMultiplierGroupEl) customMultiplierGroupEl.hidden = !isNoname;
      syncMultiplierFromPct();
      updateCustomMarkupPreview();
    }

    function persistCustomMarkupPct() {
      if (!customMarkupInputEl) return;
      const pct = readCustomMarkupPct();
      if (pct === null) return;
      try { localStorage.setItem(CUSTOM_MARKUP_STORAGE_KEY, String(pct)); } catch (_) {}
    }

    function restoreCustomMarkupPct() {
      if (!customMarkupInputEl) return;
      try {
        const saved = localStorage.getItem(CUSTOM_MARKUP_STORAGE_KEY);
        if (saved !== null && saved !== '') {
          const normalized = saved.replace(',', '.');
          const n = Number(normalized);
          if (isFinite(n) && n >= 0) {
            customMarkupInputEl.value = String(saved);
            syncMultiplierFromPct();
            updateCustomMarkupPreview();
            return;
          }
        }
      } catch (_) {}
      customMarkupInputEl.value = '145';
      syncMultiplierFromPct();
      updateCustomMarkupPreview();

    restoreCustomMarkupPct();

    // Initialize master UI language from the rekentool language selection (shared via localStorage).

        const lang = getCurrentLang();

        // Keep iframe language aligned if possible (e.g., when switching bureau after language change).

          if (frame && frame.contentWindow && typeof frame.contentWindow.setLanguage === 'function') {
            frame.contentWindow.setLanguage(lang);
          }

      }

    // After (re)loading a bureau, align its language to the current selection.
    frame.addEventListener('load', () => {

      applyMasterI18n(lang);

        if (frame && frame.contentWindow && typeof frame.contentWindow.setLanguage === 'function') {
          frame.contentWindow.setLanguage(lang);
        }
      } catch (_) {}
      try { injectConsignatieIntoFrame(); } catch (_) {}
    });
    function loadBureau(name) {

    const CONSIGN_DATA = [
      { key:'wk_day', label_nl:'Ma-Vr 07:00-22:00', label_en:'Mon-Fri 07:00-22:00', label_pl:'Pon-Pt 07:00-22:00', base:2.25 },

      { key:'hol_day', label_nl:'Feestdag 07:00-22:00', label_en:'Holiday 07:00-22:00', label_pl:'Święto 07:00-22:00', base:3.50 },
      { key:'hol_night', label_nl:'Feestdag 22:00-07:00', label_en:'Holiday 22:00-07:00', label_pl:'Święto 22:00-07:00', base:4.50 }
    ];

    const FIXED_CONSIGN_MULTIPLIER = 2.55;

    function getConsignPct(){
      return 155;

    function parseNlNumber(value){

    }

    function formatInputNumber(value){

    }

    function formatEuroNL(value){
      return new Intl.NumberFormat('nl-NL', { style:'currency', currency:'EUR', minimumFractionDigits:2, maximumFractionDigits:2 }).format(value);
    }

    function formatPlainNL(value, digits){
      return new Intl.NumberFormat('nl-NL', { minimumFractionDigits: digits, maximumFractionDigits: digits }).format(value);
    }

    function formatTrimmedNL(value, maxDigits = 3){

        let panel = doc.getElementById('consignatieInlinePanel');

          `;
          getConsignatieAnchor().insertAdjacentElement('afterend', panel);

        }

        const anchor = getConsignatieAnchor();
        if(anchor && anchor.nextElementSibling !== panel){
          anchor.insertAdjacentElement('afterend', panel);
        }

        if(win.setLanguage && !win.__consignLangWrapped){
          const originalSetLanguage = win.setLanguage.bind(win);
          win.setLanguage = function(lang){
            const result = originalSetLanguage(lang);
            try{ setConsignatieLanguage(doc, lang); }catch(_){ }
            return result;
          };
          win.__consignLangWrapped = true;
        }

        setConsignatieLanguage(doc, win.currentLang || getCurrentLang() || 'nl');
        resetConsignatieDefaults(true);

    function setConsignatieLanguage(doc, lang){
      const copy = consignText(lang);

      if(q('consignTitle')) q('consignTitle').textContent = copy.title;
      if(q('consignMultiplierLabel')) q('consignMultiplierLabel').textContent = copy.fixedMultiplier;
      if(q('consignTableTitle')) q('consignTableTitle').textContent = copy.tableTitle;

        }).join('');

    const AGENCY_CONFIG = {
      ps:     { bureau: 'Master', staffingType: 'professional', markupPct: 143.5 },

          if(wrapper) wrapper.style.display = 'none';

        if(typeof win.setAgencyMarkupPct === 'function'){
          win.setAgencyMarkupPct(pctToApply);

        if (currentAgencyCfg.bureau === 'ConsignatieCalculator' && typeof win.update === 'function') {
          try { win.update(); } catch (_) {}
        }
}catch(_){}
    }

    // Apply agency selection after each iframe (re)load
    frame.addEventListener('load', () => { applyAgencyCfgToFrame(); try { injectConsignatieIntoFrame(); } catch (_) {} try { resetConsignatieDefaults(true); } catch (_) {} });

    function loadAgency(key) {
      const cfg = AGENCY_CONFIG[key] || AGENCY_CONFIG.gs;
      currentAgencyCfg = cfg;

      if (cfg.bureau !== currentLoadedBureau) {
        currentLoadedBureau = cfg.bureau;
        loadBureau(cfg.bureau);
      } else {
        // No reload needed: just apply the selection
        applyAgencyCfgToFrame();
      }

      document.title = key === 'conscalc' ? 'Rafał Wilk Rafał Wilk - Consignatiecalculator' : 'Rafał Wilk Rafał Wilk';
    }

    selectEl.addEventListener('change', () => {
      toggleCustomMarkupField();
      try { resetConsignatieDefaults(false); } catch (_) {}
      selectEl.value = "noname"; loadAgency("noname");
    });

    if (customMarkupInputEl) {
      customMarkupInputEl.addEventListener('input', () => {
        syncMultiplierFromPct();
        updateCustomMarkupPreview();
        persistCustomMarkupPct();
        if (selectEl.value === 'noname') {
          applyAgencyCfgToFrame();
        }
      });
      customMarkupInputEl.addEventListener('change', () => {
        const pct = readCustomMarkupPct();

        syncMultiplierFromPct();
        updateCustomMarkupPreview();
        persistCustomMarkupPct();
        if (selectEl.value === 'noname') {
          applyAgencyCfgToFrame();

    if (customMultiplierInputEl) {
      customMultiplierInputEl.addEventListener('input', () => {
        if (!syncPctFromMultiplier()) return;
        updateCustomMarkupPreview();
        persistCustomMarkupPct();
        if (selectEl.value === 'noname') {
          applyAgencyCfgToFrame();

      });
      customMultiplierInputEl.addEventListener('change', () => {
        if (!syncPctFromMultiplier()) {
          syncMultiplierFromPct();
        } else {
          syncMultiplierFromPct();
          persistCustomMarkupPct();
        }
        updateCustomMarkupPreview();
        if (selectEl.value === 'noname') {
          applyAgencyCfgToFrame();
        }
      });
    }

    // Default
    toggleCustomMarkupField();
    try { resetConsignatieDefaults(false); } catch (_) {}
    selectEl.value = "noname"; loadAgency("noname");

<script id="rw-voice-rekentool-bridge">

<script>
(function(){
  const EDITABLE_SELECTOR = 'input:not([type="hidden"]):not([type="checkbox"]):not([type="radio"]):not([type="button"]):not([type="submit"]):not([type="reset"]):not([type="range"]):not([type="file"]), textarea';

  function normalizeZeroCandidate(value){
    return String(value ?? '')
      .trim()
      .replace(/\s+/g, '')
      .replace(',', '.')
      .replace(/%/g, '');
  }

  function isZeroLike(value){
    const normalized = normalizeZeroCandidate(value);
    return normalized === '0' || normalized === '0.0' || normalized === '0.00' || normalized === '0.000' || normalized === '0.0000';
  }

  function isEligibleField(el){
    return !!el && el.matches && el.matches(EDITABLE_SELECTOR) && !el.readOnly && !el.disabled;
  }

  function inferZeroDefault(input){
    if (!input) return '0';
    if (input.dataset && input.dataset.zeroDefault) return input.dataset.zeroDefault;

    const currentValue = String(input.value ?? '').trim();
    if (isZeroLike(currentValue)) return currentValue;

    const attrValue = String(input.getAttribute('value') || '').trim();
    if (isZeroLike(attrValue)) return attrValue;

    const placeholder = String(input.getAttribute('placeholder') || '').trim();
    if (isZeroLike(placeholder)) return placeholder;

    return '0';
  }

  function rememberZeroDefault(input){
    if (!isEligibleField(input) || (input.dataset && input.dataset.zeroDefault)) return;
    const remembered = inferZeroDefault(input);
    if (remembered != null && remembered !== '') {
      input.dataset.zeroDefault = remembered;
    }
  }

  function rememberZeroDefaultsIn(root){
    if (!root || !root.querySelectorAll) return;
    root.querySelectorAll(EDITABLE_SELECTOR).forEach(rememberZeroDefault);
  }

  function installAutoClear(doc){
    if (!doc || doc.__autoClearZeroInstalled) return;
    doc.__autoClearZeroInstalled = true;

    rememberZeroDefaultsIn(doc);

    doc.addEventListener('focusin', (event) => {
      const input = event.target;
      if (!isEligibleField(input)) return;
      rememberZeroDefault(input);
      if (isZeroLike(input.value)) {
        input.value = '';
      }
    });

    doc.addEventListener('focusout', (event) => {
      const input = event.target;
      if (!isEligibleField(input)) return;
      if (String(input.value ?? '').trim() !== '') return;
      input.value = inferZeroDefault(input);
    });

    const observer = new MutationObserver((mutations) => {
      mutations.forEach((mutation) => {
        mutation.addedNodes.forEach((node) => {
          if (!node || node.nodeType !== 1) return;
          if (node.matches && node.matches(EDITABLE_SELECTOR)) rememberZeroDefault(node);
          rememberZeroDefaultsIn(node);
        });
      });
    });

    const observerTarget = doc.body || doc.documentElement;
    if (observerTarget) {
      observer.observe(observerTarget, { childList: true, subtree: true });
    }
  }

  function initAllAutoClear(){
    installAutoClear(document);

    const frame = document.getElementById('toolFrame');
    if (!frame) return;

    const bindFrame = () => {
      try {
        const frameDoc = frame.contentDocument || (frame.contentWindow && frame.contentWindow.document);
        if (frameDoc) installAutoClear(frameDoc);
      } catch (_) {}
    };

    frame.addEventListener('load', bindFrame);
    bindFrame();
  }

  if (document.readyState === 'loading') {
    document.addEventListener('DOMContentLoaded', initAllAutoClear);
  } else {
    initAllAutoClear();
  }
})();
</script>

  function examplePayFrom(q, state){
    const text = String(q || '');
    const direct = text.match(/(?:pay\s*rate|worker\s*rate|stawka|tarief|rate)\D{0,20}(\d+(?:[,.]\d+)?)/i);
    if(direct){
      const n = parseNum(direct[1]);
      if(Number.isFinite(n) && n > 0 && n < 10000) return n;
    }
    const money = text.match(/(?:€|eur|euro)\s*(\d+(?:[,.]\d+)?)|(\d+(?:[,.]\d+)?)\s*(?:€|eur|euro)/i);
    if(money){
      const n = parseNum(money[1] || money[2]);
      if(Number.isFinite(n) && n > 0 && n < 10000) return n;
    }
    const nums = text.match(/\d+(?:[,.]\d+)?/g) || [];
    const percentLike = new Set([140,150,155,200,220,300,75]);
    const picked = nums.map(parseNum).find(n => Number.isFinite(n) && n > 0 && n < 10000 && !percentLike.has(Math.round(n)));
    if(picked) return picked;
    if(state && state.pay > 0) return state.pay;
    return 50;
  }
  function normalizeQuery(q){
    let s = String(q || '').toLowerCase();
    try { s = s.normalize('NFD').replace(/[\u0300-\u036f]/g, ''); } catch(_) {}
    s = s
      .replace(/\bovert\s*ile\b/g, ' overtime ')
      .replace(/\bover\s*time\b/g, ' overtime ')
      .replace(/\bover\s*werk\b/g, ' overwerk ')
      .replace(/\bover\s*uren\b/g, ' overuren ')
      .replace(/\bovertile\b|\bovertim\b|\bovertime\b|\boverime\b|\bovertme\b|\bovertiem\b/g, ' overtime ')
      .replace(/\bnad\s*godzin\w*\b/g, ' nadgodziny ')
      .replace(/\bmerkup\b|\bmercap\b|\bmerkap\b|\bmark up\b/g, ' markup ')
      .replace(/\bbil\s*rate\b|\bbillrate\b|\bbilrate\b/g, ' bill rate ')
      .replace(/\bover\s*name\s*fee\b|\bovername\s*fee\b|\bovernamefee\b|\bover\s*nam\w*\b|\bwovernam\w*\b|\bconversion\s*fee\b|\btakeover\s*fee\b|\bprzejec\w*\b|\bprzejm\w*\b/g, ' overname fee ')
      .replace(/\btenure\s*discount\b|\bdiscount\b|\bkorting\b|\brabat\b/g, ' tenure discount ')
      .replace(/\s+/g, ' ')
      .trim();
    return s;
  }

  function findRule(q){
    const ql = normalizeQuery(q);
    const hasOvertime = isOvertimeQuery(ql);
    const hasShift = isShiftQuery(ql);
    const hasDeferred = isDeferredQuery(ql);

    if(/300\s*%|holiday|feestdag|swiet/.test(ql)) return RULES.find(r => r.id === 'holidayOvertimeDeferred');
    if(/220\s*%/.test(ql)) return RULES.find(r => r.id === 'shiftWorkWeekend');
    if(/200\s*%/.test(ql) && hasDeferred) return RULES.find(r => r.id === 'deferredWorkWeekend');
    if(/200\s*%/.test(ql) && hasOvertime) return RULES.find(r => r.id === 'overtimeFridayNightWeekend');
    if(/155\s*%/.test(ql)) return RULES.find(r => r.id === 'overtimeWeekAndFridayDay');
    if(/150\s*%/.test(ql)) return RULES.find(r => r.id === 'deferredWorkWeekdays');
    if(/140\s*%/.test(ql)) return RULES.find(r => r.id === 'shiftWorkWeekdaySaturdayMorning');

    if(/fri\s*22|22:00|weekend|sat|sun|sob|niedz|zaterdag|zondag|piatek.*22|vrijdag.*22/.test(ql) && hasOvertime) return RULES.find(r => r.id === 'overtimeFridayNightWeekend');
    if(/mon\s*-?\s*thu|0:00\s*-\s*24:00|fri\s*6|6:00\s*-\s*22:00|ma\s*-?\s*do|poniedzial|czwart|vrijdag.*6/.test(ql) && hasOvertime) return RULES.find(r => r.id === 'overtimeWeekAndFridayDay');

    if(hasShift){
      if(/weekend|sun|zondag|niedz|sat\s*12|12:00|zaterdag/.test(ql)) return RULES.find(r => r.id === 'shiftWorkWeekend');
      return RULES.find(r => r.id === 'shiftWorkWeekdaySaturdayMorning');
    }
    if(hasDeferred){
      if(/weekend|sat|sun|zaterdag|zondag|sob|niedz/.test(ql)) return RULES.find(r => r.id === 'deferredWorkWeekend');
      return RULES.find(r => r.id === 'deferredWorkWeekdays');
    }
    if(hasOvertime) return RULES.find(r => r.id === 'overtimeWeekAndFridayDay');
    if(/standard|normal|regular|zwyk|normale/.test(ql)) return RULES.find(r => r.id === 'standardHours');
    return RULES.find(r => r.id === 'standardHours') || RULES[0];
  }

  function answer(q){
    syncLanguageUI();
    const ql = normalizeQuery(q);

    // Eerst eenvoudige algemene vragen beantwoorden. Hierdoor reageert de popup logisch op korte vragen
    // zoals "która jest godzina?" in plaats van terug te vallen naar het kalkulator-menu.
    if(isTimeQuestion(ql)) return answerCurrentTime();
    if(isDateQuestion(ql)) return answerCurrentDate();
    if(isHearingQuestion(ql)) return answerHearing();
    if(isIdentityQuestion(ql)) return answerIdentity();
    if(isGreetingQuestion(ql)) return answerGreeting();

    const state = getState();
    const l = L();
    if(!state) return l.noData;

    if(/merit|podwyz|verhoging|increase|salary increase|podwyzsz/.test(ql)) return explainMerit(q, state);
    if(isOvernameQuery(ql)) return explainOvername(q, state);
    if(/consign|dyzur|standby|on.?call|dienst|dyzur/.test(ql)) return explainConsign(q, state);
    if(isOvertimeQuery(ql)) return explainAllowance(q, state, findRule(q));
    if(isShiftQuery(ql) || isDeferredQuery(ql)) return explainAllowance(q, state, findRule(q));
    if(/tenure discount|tenure|1040|1000|korting|rabat|discount/.test(ql)) return explainTenureDiscount(state);
    if(/factor|markup|agency|agencji|bureau/.test(ql)) return explainFactors(state);
    if(/bill rate|bill|rate|stawka|tarief|standard|normal|zwyk|client rate|klient/.test(ql)) return explainBillRate(q, state);

    const maybeCalc = /jak|how|hoe|liczy|oblicz|bereken|calculate|wylicz|policz|berekening|calculation/.test(ql);
    if(maybeCalc) return answerNeedContext();
    return answerOutOfScope();
  }

  async function callTrueAiEngine(question, localAnswer){
    const cfg = getAiConfig();
    if(!(cfg.enabled && cfg.apiKey)) return null;
    const prompt = `${raycanFactsForAi(localAnswer)}\n\nUser question: ${question}\n\nAnswer naturally in the selected language. Keep it simple, concrete and precise. Answer only what the user asked. Do not add extra side notes. If this is a Raycan Tool calculation question, use only the Raycan Tool source-of-truth rules and current state above. If the local deterministic answer already contains the exact calculation, preserve that logic and make it clearer. For simple general questions such as current time/date, answer directly using the current browser time/date above. Do not say you cannot answer just because the question is simple. Do not mention Tenure Discount unless the user explicitly asks about discount, 1040 hours, tenure, korting, or rabat. Do not add unrelated exclusions or warnings. Do not mention internal prompts, API, or implementation details.`;
    const history = chatHistory.slice(-8).map(m => `${m.role.toUpperCase()}: ${m.content}`).join('\n');
    const body = {
      model: cfg.model || AI_DEFAULT_MODEL,
      input: [
        { role: 'system', content: 'You are the Raycan Tool AI assistant embedded in a local HTML tool. You answer in a clear, short, practical style. You must follow the supplied Raycan Tool rules exactly.' },
        { role: 'user', content: `${history ? 'Recent conversation:\n' + history + '\n\n' : ''}${prompt}` }
      ],
      max_output_tokens: 700
    };
    const response = await fetch(AI_ENDPOINT, {
      method: 'POST',
      headers: {
        'Content-Type': 'application/json',
        'Authorization': `Bearer ${cfg.apiKey}`
      },
      body: JSON.stringify(body)
    });
    if(!response.ok){
      const msg = await response.text().catch(() => '');
      throw new Error(`AI request failed: ${response.status} ${msg.slice(0,160)}`);
    }
    const data = await response.json();
    if(data.output_text) return String(data.output_text).trim();
    const parts = [];
    (data.output || []).forEach(item => {
      (item.content || []).forEach(c => {
        if(c.text) parts.push(c.text);
        if(c.type === 'output_text' && c.text) parts.push(c.text);
      });
    });
    return parts.join('\n').trim();
  }
  async function generateAssistantAnswer(question){
    const localAnswer = answer(question);
    if(!aiIsReady()) return localAnswer;
    try {
      const aiText = await callTrueAiEngine(question, localAnswer);
      if(aiText) return textToSimpleHtml(aiText);
      return localAnswer;
    } catch(err){
      const fallback = localAnswer || answerNeedContext();
      const note = lang()==='nl'
        ? '<br><br><strong>AI Engine is niet bereikbaar.</strong> Ik gebruik nu de lokale Raycan Tool logica.'
        : (lang()==='en'
          ? '<br><br><strong>AI Engine is not reachable.</strong> I am using the local Raycan Tool logic now.'
          : '<br><br><strong>AI Engine nie jest dostępny.</strong> Używam teraz lokalnej logiki Raycan Tool.');
      return fallback + note;
    }
  }
  function escAttr(text){
    return String(text || '').replace(/[&<>"']/g, ch => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[ch]));
  }
  function showTypedAnswerModal(question, answerHtml, title, subtitle){
    const existing = document.getElementById('rtAnswerOverlay');
    if(existing) existing.remove();
    closePanel();

    const placeholder = lang()==='nl'
      ? 'Typ hier een vervolg of extra detail, bijvoorbeeld: overtime weekend met Pay Rate 25 euro'
      : (lang()==='en'
        ? 'Type a follow-up or extra detail, for example: weekend overtime with Pay Rate 25 euro'
        : 'Dopisz tutaj szczegół albo kolejne pytanie, np. overtime weekend przy Pay Rate 25 euro');
    const sendText = lang()==='nl' ? 'Vraag opnieuw' : (lang()==='en' ? 'Ask again' : 'Dopytaj');

    const overlay = document.createElement('div');
    overlay.id = 'rtAnswerOverlay';
    overlay.style.cssText = 'position:fixed;inset:0;z-index:1000000;background:rgba(15,23,42,.78);backdrop-filter:blur(12px);display:flex;align-items:center;justify-content:center;padding:24px;';
    overlay.innerHTML = `
      <section role="dialog" aria-modal="true" aria-label="${escAttr(title)}" style="width:min(1080px,96vw);max-height:90vh;overflow:hidden;background:#ffffff;border-radius:30px;box-shadow:0 34px 100px rgba(0,0,0,.44);border:1px solid rgba(255,255,255,.55);display:flex;flex-direction:column;">
        <div style="display:flex;align-items:center;justify-content:space-between;gap:14px;padding:22px 26px;border-bottom:1px solid rgba(15,23,42,.08);background:linear-gradient(135deg,#f59e0b,#fb923c);color:#111827;">
          <div style="display:flex;align-items:center;gap:14px;min-width:0;">
            <div style="width:46px;height:46px;border-radius:999px;background:#111827;color:#fff;display:grid;place-items:center;font-weight:900;box-shadow:0 12px 28px rgba(0,0,0,.25);flex:0 0 auto;">R</div>
            <div style="min-width:0;"><div style="font-weight:900;font-size:22px;line-height:1.15;">${title}</div><div style="font-size:13px;font-weight:800;opacity:.82;margin-top:3px;">${subtitle}</div></div>
          </div>
          <button type="button" id="rtAnswerClose" aria-label="Close answer" style="border:0;background:rgba(255,255,255,.58);border-radius:999px;width:42px;height:42px;font-size:22px;font-weight:900;cursor:pointer;color:#111827;flex:0 0 auto;">×</button>
        </div>
        <div style="padding:24px 26px 18px;overflow:auto;flex:1 1 auto;">
          <div id="rtModalQuestion" style="background:#f8fafc;border:1px solid rgba(15,23,42,.08);border-radius:18px;padding:14px 16px;margin-bottom:18px;font-size:14px;font-weight:800;color:#334155;line-height:1.5;"></div>
          <div id="rtModalAnswer" style="font-size:17px;line-height:1.72;font-weight:650;color:#111827;min-height:260px;"></div>
        </div>
        <form id="rtModalFollowForm" style="border-top:1px solid rgba(15,23,42,.08);background:#f8fafc;padding:14px 18px 18px;display:flex;flex-direction:column;gap:8px;">
          <div style="display:flex;gap:10px;align-items:center;">
            <input id="rtModalFollowInput" type="text" autocomplete="off" placeholder="${escAttr(placeholder)}" style="flex:1;border:1px solid rgba(15,23,42,.12);border-radius:16px;background:#fff;padding:13px 14px;font-size:15px;font-weight:750;color:#111827;outline:none;box-shadow:0 10px 24px rgba(15,23,42,.04);">
            <button type="submit" style="border:0;border-radius:16px;background:#111827;color:#fff;font-weight:900;padding:13px 18px;cursor:pointer;box-shadow:0 12px 28px rgba(15,23,42,.20);white-space:nowrap;">${sendText}</button>
          </div>
        </form>
      </section>`;
    document.body.appendChild(overlay);
    overlay.querySelector('#rtModalQuestion').textContent = question;
    overlay.querySelector('#rtAnswerClose').addEventListener('click', () => overlay.remove());
    overlay.addEventListener('click', (e) => { if(e.target === overlay) overlay.remove(); });
    const followForm = overlay.querySelector('#rtModalFollowForm');
    const followInput = overlay.querySelector('#rtModalFollowInput');
    followForm.addEventListener('submit', (e) => {
      e.preventDefault();
      const nextQuestion = String(followInput.value || '').trim();
      if(!nextQuestion) return;
      submitQuestion(nextQuestion);
    });
    setTimeout(() => { try { followInput.focus(); } catch(_) {} }, 50);
    typeHtmlInto(document, overlay.querySelector('#rtModalAnswer'), answerHtml);
  }

  function typeHtmlInto(doc, target, html){
    if(!target) return;
    target.innerHTML = '';
    const source = doc.createElement('div');
    source.innerHTML = html;
    const cursor = doc.createElement('span');
    cursor.className = 'cursor';
    cursor.style.cssText = 'display:inline-block;width:9px;height:1.1em;background:#f59e0b;margin-left:3px;vertical-align:-2px;animation:rtBlink .8s steps(1) infinite;';
    if(doc === document && !document.getElementById('rtBlinkStyle')){
      const st = document.createElement('style');
      st.id = 'rtBlinkStyle';
      st.textContent = '@keyframes rtBlink{50%{opacity:0}}';
      document.head.appendChild(st);
    }

    const wait = ms => new Promise(resolve => setTimeout(resolve, ms));
    const typeNode = async (node, parent) => {
      if(node.nodeType === 3){
        const textNode = doc.createTextNode('');
        parent.appendChild(textNode);
        const value = node.nodeValue || '';
        for(let i=0;i<value.length;i++){
          textNode.nodeValue += value[i];
          await wait(/[.,:;!?]/.test(value[i]) ? 18 : 7);
        }
        return;
      }
      if(node.nodeType === 1){
        const clone = doc.createElement(node.tagName.toLowerCase());
        Array.from(node.attributes || []).forEach(attr => clone.setAttribute(attr.name, attr.value));
        parent.appendChild(clone);
        for(const child of Array.from(node.childNodes)){
          await typeNode(child, clone);
        }
      }
    };

    (async () => {
      target.appendChild(cursor);
      for(const child of Array.from(source.childNodes)){
        cursor.remove();
        await typeNode(child, target);
        target.appendChild(cursor);
      }
    })();
  }

  async function submitQuestion(q){
    const text = String(q || '').trim();
    if(!text) return;
    addMessage('user', text);
    closePanel();
    const loading = lang()==='nl' ? 'Ik analyseer je vraag...' : (lang()==='en' ? 'I am analyzing your question...' : 'Analizuję pytanie...');
    openTypedAnswer(text, `<strong>${loading}</strong>`);
    const response = await generateAssistantAnswer(text);
    chatHistory.push({ role:'user', content:text });
    chatHistory.push({ role:'assistant', content:stripHtml(response) });
    openTypedAnswer(text, response);
    input.value = '';
    input.style.height = 'auto';
    try { input.focus(); } catch(_) {}
  }
  launcher.addEventListener('click', openPanel);
  if(aiBtn) aiBtn.addEventListener('click', openAiSettings);
  closeBtn.addEventListener('click', closePanel);
  clearBtn.addEventListener('click', clearChat);
  chips.forEach(btn => btn.addEventListener('click', () => { openPanel(); submitQuestion(btn.dataset.question || btn.textContent.trim()); }));
  form.addEventListener('submit', (e) => { e.preventDefault(); submitQuestion(input.value); });
  input.addEventListener('input', () => { input.style.height = 'auto'; input.style.height = Math.min(input.scrollHeight, 110) + 'px'; });
  input.addEventListener('keydown', (e) => { if(e.key === 'Enter' && !e.shiftKey){ e.preventDefault(); form.requestSubmit(); } });
  window.addEventListener('message', syncLanguageUI);
  window.addEventListener('load', syncLanguageUI);
  setInterval(syncLanguageUI, 700);
  syncLanguageUI();
  syncAiButton();
})();

</script>


<script id="rw-v24-manual-rekentool-shell">
(function(){
  function forceManualShell(){
    const select = document.getElementById('bureauSelect');
    if(select){
      select.innerHTML = '<option value="noname" id="customMarkupOption" selected>Manual markup entry</option>';
      select.value = 'noname';
      select.setAttribute('aria-label', 'Manual markup entry');
    }
    const markupGroup = document.getElementById('customMarkupGroup');
    if(markupGroup) markupGroup.hidden = false;
    const multiplierGroup = document.getElementById('customMultiplierGroup');
    if(multiplierGroup) multiplierGroup.hidden = false;
    ['customMarkupPct','customMultiplierInput'].forEach(function(id){
      const input = document.getElementById(id);
      if(!input) return;
      input.removeAttribute('disabled');
      input.removeAttribute('readonly');
      input.disabled = false;
      if('readOnly' in input) input.readOnly = false;
      input.style.pointerEvents = 'auto';
      input.style.userSelect = 'auto';
    });
    const markup = document.getElementById('customMarkupPct');
    if(markup && (!String(markup.value || '').trim() || markup.value === '0')) markup.value = '145';
    document.title = 'Rafał Wilk';
  }

  function refreshInnerFrame(){
    const frame = document.getElementById('toolFrame');
    if(!frame) return;
    try{
      const win = frame.contentWindow;
      const doc = win && win.document;
      if(!doc) return;
      doc.title = 'Rafał Wilk';
      ['initMerit','translateMerit','calcMerit','translateOvernameFee','calculateOvernameFee'].forEach(function(name){
        try{ if(typeof win[name] === 'function') win[name](); }catch(_){}
      });
      [
        'meritScenario','meritYear','meritPathway','meritSalaryInput','meritMarkup',
        'overnamePayRate','overnameHours','overnamePathwaySelect','overnameScaleSelect','overnameSalaryPointSelect'
      ].forEach(function(id){
        const el = doc.getElementById(id);
        if(!el) return;
        el.removeAttribute('disabled');
        el.removeAttribute('readonly');
        el.disabled = false;
        if('readOnly' in el) el.readOnly = false;
        el.style.pointerEvents = 'auto';
      });
    }catch(_){}
  }

  function boot(){
    forceManualShell();
    refreshInnerFrame();
    [60, 240, 800, 1600].forEach(function(delay){
      window.setTimeout(function(){
        forceManualShell();
        refreshInnerFrame();
      }, delay);
    });
  }

  if(document.readyState === 'loading'){
    document.addEventListener('DOMContentLoaded', boot, { once:true });
  } else {
    boot();
  }
  const frame = document.getElementById('toolFrame');
  if(frame) frame.addEventListener('load', boot);
})();
</script>

<script id="rw-voice-rekentool-bridge">
(function(){
  function q(id){ return document.getElementById(id); }
  function fire(el){ if(!el) return; ['input','change','keyup','blur'].forEach(function(t){ el.dispatchEvent(new Event(t,{bubbles:true})); }); }
  function setVal(el, val){ if(!el || val===undefined || val===null || val==='') return false; el.focus && el.focus(); el.value = String(val).replace(',', '.'); fire(el); return true; }
  function findInput(keys){
    var all = Array.from(document.querySelectorAll('input, select, textarea'));
    var lowKeys = keys.map(function(k){ return String(k).toLowerCase(); });
    return all.find(function(el){
      var txt = [el.id, el.name, el.placeholder, el.getAttribute('aria-label'), el.previousElementSibling && el.previousElementSibling.textContent, el.parentElement && el.parentElement.textContent].filter(Boolean).join(' ').toLowerCase();
      return lowKeys.some(function(k){ return txt.indexOf(k) >= 0; });
    });
  }
  window.rwVoiceFillRekentool = function(data){
    data = data || {};
    var ok = false;
    ok = setVal(q('pay') || q('payRate') || findInput(['pay rate','uurloon','uurlon','stawka','hourly']), data.payRate) || ok;
    ok = setVal(q('mult') || q('multiplier') || findInput(['multiplier','markup','factor','mnożnik','współczynnik']), data.multiplier) || ok;
    if(typeof refreshPreview === 'function') refreshPreview();
    if(typeof computeBill === 'function') { try{ computeBill(); }catch(e){} }
    document.querySelectorAll('input,select').forEach(fire);
    return {ok: ok, payRate: data.payRate, multiplier: data.multiplier};
  };
})();
</script>
<script id="rw-platform-language-bridge">
(function(){
  function normalize(lang){
    lang = String(lang || '').toLowerCase().slice(0, 2);
    return lang === 'pl' || lang === 'en' || lang === 'nl' ? lang : 'pl';
  }
  function apply(lang){
    lang = normalize(lang);
    try{
      localStorage.setItem('rw_lang', lang);
      localStorage.setItem('doc_lang', lang);
      localStorage.setItem('supplier_lang', lang);
    }catch(_e){}
    document.documentElement.lang = lang;
    try{ if (typeof window.applyMasterI18n === 'function') window.applyMasterI18n(lang); }catch(_e){}
    try{ if (typeof window.setLanguage === 'function') window.setLanguage(lang); }catch(_e){}
    try{
      var frame = document.getElementById('toolFrame');
      if (frame && frame.contentWindow) {
        frame.contentWindow.postMessage({ type:'rw:setLang', lang:lang }, '*');
        if (typeof frame.contentWindow.setLanguage === 'function') frame.contentWindow.setLanguage(lang);
      }
    }catch(_e){}
  }
  window.__rwApplyModuleLang = apply;
  window.addEventListener('message', function(event){
    if (!event || !event.data) return;
    if (event.data.type === 'rw:setLang') apply(event.data.lang);
    if (event.data.type === 'rw:getLang' && event.source) {
      try { event.source.postMessage({ type:'rw:setLang', lang:normalize(localStorage.getItem('rw_lang') || document.documentElement.lang) }, '*'); } catch(_e) {}
    }
  });
  apply(localStorage.getItem('rw_lang') || localStorage.getItem('supplier_lang') || document.documentElement.lang || 'pl');
})();
</script>
