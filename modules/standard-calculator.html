<!DOCTYPE html>
<html lang="pl">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Kalkulator</title>
<style>
:root{
  color-scheme:dark;
  --page:#040914;
  --surface:#091522;
  --surface-deep:#07101c;
  --display:#071321;
  --key:#112237;
  --key-hover:#17304a;
  --operator:#0b2a43;
  --accent:#24e0d0;
  --accent-2:#3aa8ff;
  --text:#f3f8ff;
  --muted:#89a4ba;
  --line:rgba(133,220,255,.18);
  --shadow:0 28px 80px rgba(0,0,0,.48),0 0 36px rgba(36,224,208,.08);
}
*{box-sizing:border-box}
html,body{min-height:100%}
body{
  margin:0;
  display:grid;
  place-items:center;
  padding:18px;
  background:
    radial-gradient(circle at 18% 0%,rgba(36,224,208,.14),transparent 34%),
    radial-gradient(circle at 100% 24%,rgba(58,168,255,.14),transparent 38%),
    linear-gradient(145deg,#030711 0,#081321 52%,#040914 100%);
  color:var(--text);
  font-family:"Segoe UI Variable","Segoe UI",Arial,sans-serif;
}
body::before{
  content:"";
  position:fixed;
  inset:0;
  pointer-events:none;
  opacity:.22;
  background-image:
    linear-gradient(rgba(107,210,232,.09) 1px,transparent 1px),
    linear-gradient(90deg,rgba(107,210,232,.09) 1px,transparent 1px);
  background-size:34px 34px;
  mask-image:linear-gradient(to bottom,rgba(0,0,0,.75),transparent 82%);
}
button{font:inherit}
.calculator{
  position:relative;
  width:min(100%,390px);
  min-height:min(760px,calc(100vh - 36px));
  display:flex;
  flex-direction:column;
  overflow:hidden;
  border:1px solid rgba(135,221,255,.23);
  border-radius:24px;
  background:
    linear-gradient(155deg,rgba(17,37,57,.96),rgba(5,14,25,.98) 58%),
    var(--surface);
  box-shadow:var(--shadow);
}
.calculator::before{
  content:"";
  position:absolute;
  z-index:2;
  top:0;
  left:12%;
  width:76%;
  height:2px;
  background:linear-gradient(90deg,transparent,var(--accent),var(--accent-2),transparent);
  box-shadow:0 0 18px rgba(36,224,208,.72);
}
.titlebar{
  display:flex;
  align-items:center;
  justify-content:space-between;
  min-height:66px;
  padding:10px 18px;
}
.title-identity{
  display:flex;
  align-items:center;
  gap:11px;
}
.calculator-logo{
  width:34px;
  height:34px;
  padding:7px;
  border:1px solid rgba(74,215,231,.34);
  border-radius:10px;
  background:linear-gradient(145deg,rgba(36,224,208,.14),rgba(58,168,255,.08));
  color:var(--accent);
  filter:drop-shadow(0 0 8px rgba(36,224,208,.22));
}
.calculator-logo rect,
.calculator-logo path{
  fill:none;
  stroke:currentColor;
  stroke-width:1.55;
  stroke-linecap:round;
  stroke-linejoin:round;
}
.title-copy{
  display:grid;
  gap:1px;
}
.mode-label{
  color:#70cbd6;
  font-size:9px;
  font-weight:800;
  letter-spacing:1.65px;
  line-height:1.2;
  text-transform:uppercase;
}
.titlebar h1{
  margin:0;
  font-size:17px;
  font-weight:680;
  letter-spacing:.15px;
}
.title-status{
  display:flex;
  align-items:center;
  gap:9px;
}
.system-status{
  display:inline-flex;
  align-items:center;
  gap:6px;
  color:#7d98ad;
  font-size:9px;
  font-weight:800;
  letter-spacing:1px;
}
.system-status::before{
  content:"";
  width:6px;
  height:6px;
  border-radius:50%;
  background:var(--accent);
  box-shadow:0 0 10px rgba(36,224,208,.95);
}
.memory-indicator{
  min-width:23px;
  min-height:23px;
  display:grid;
  place-items:center;
  border:1px solid transparent;
  border-radius:7px;
  color:var(--accent);
  font-size:10px;
  font-weight:850;
}
.memory-indicator:not(:empty){
  border-color:rgba(36,224,208,.35);
  background:rgba(36,224,208,.08);
  box-shadow:inset 0 0 12px rgba(36,224,208,.07);
}
.display{
  position:relative;
  min-height:132px;
  margin:0 14px 12px;
  padding:20px 17px 15px;
  overflow:hidden;
  border:1px solid rgba(113,204,232,.2);
  border-radius:16px;
  background:
    linear-gradient(rgba(86,194,224,.035) 1px,transparent 1px),
    linear-gradient(90deg,rgba(86,194,224,.035) 1px,transparent 1px),
    linear-gradient(145deg,rgba(5,18,31,.96),rgba(8,27,43,.94));
  background-size:18px 18px,18px 18px,auto;
  box-shadow:inset 0 0 30px rgba(0,0,0,.3),0 10px 30px rgba(0,0,0,.16);
  text-align:right;
}
.display::after{
  content:"";
  position:absolute;
  right:-25%;
  bottom:-52px;
  width:78%;
  height:72px;
  background:radial-gradient(ellipse,rgba(36,224,208,.13),transparent 68%);
  pointer-events:none;
}
.history{
  position:relative;
  z-index:1;
  display:block;
  min-height:24px;
  overflow:hidden;
  color:#7fa8bb;
  font-size:14px;
  line-height:24px;
  letter-spacing:.2px;
  text-overflow:ellipsis;
  white-space:nowrap;
}
.current{
  position:relative;
  z-index:1;
  display:block;
  min-height:58px;
  overflow:hidden;
  color:#f6fbff;
  font-size:45px;
  font-weight:660;
  line-height:58px;
  letter-spacing:-1.5px;
  text-shadow:0 0 22px rgba(94,215,235,.14);
  text-overflow:ellipsis;
  white-space:nowrap;
}
.current.medium{font-size:36px}
.current.small{font-size:27px;letter-spacing:-.5px}
.memory-row{
  display:grid;
  grid-template-columns:repeat(5,1fr);
  gap:6px;
  padding:0 14px 10px;
}
.memory-row button{
  min-height:34px;
  border:1px solid rgba(121,202,226,.12);
  border-radius:9px;
  background:rgba(8,27,43,.48);
  color:#91b6c8;
  cursor:pointer;
  font-size:11px;
  font-weight:760;
  letter-spacing:.3px;
  transition:border-color .16s ease,background .16s ease,color .16s ease,transform .08s ease;
}
.memory-row button:hover{
  border-color:rgba(36,224,208,.38);
  background:rgba(22,66,85,.58);
  color:#d8fbff;
}
.memory-row button:active{transform:translateY(1px)}
.memory-row button:disabled{
  border-color:rgba(121,202,226,.05);
  color:#465d6d;
  cursor:default;
  background:rgba(8,20,33,.24);
}
.keys{
  min-height:0;
  flex:1;
  display:grid;
  grid-template-columns:repeat(4,1fr);
  grid-template-rows:repeat(6,minmax(50px,1fr));
  gap:7px;
  padding:0 14px 14px;
}
.key{
  min-height:54px;
  border:1px solid rgba(132,211,237,.12);
  border-radius:12px;
  background:linear-gradient(145deg,rgba(22,43,66,.98),rgba(13,30,49,.98));
  color:var(--text);
  cursor:pointer;
  font-size:19px;
  font-weight:520;
  box-shadow:inset 0 1px 0 rgba(255,255,255,.035),0 5px 14px rgba(0,0,0,.14);
  transition:border-color .16s ease,background .16s ease,color .16s ease,box-shadow .16s ease,transform .08s ease;
}
.key:hover{
  border-color:rgba(94,215,235,.42);
  background:linear-gradient(145deg,#19344f,#112a41);
  box-shadow:inset 0 1px 0 rgba(255,255,255,.06),0 7px 18px rgba(0,0,0,.2),0 0 15px rgba(36,224,208,.05);
  transform:translateY(-1px);
}
.key:active{
  background:#0c1d2e;
  transform:translateY(1px) scale(.99);
}
.key.function,
.key.operator{
  background:linear-gradient(145deg,rgba(14,46,70,.98),rgba(9,32,52,.98));
  color:#9bd5e3;
  font-size:17px;
}
.key.function:hover,
.key.operator:hover{
  background:linear-gradient(145deg,#15415f,#0d334f);
  color:#d5f8ff;
}
.key.operator{
  color:#51d7ee;
  font-size:22px;
}
.key.digit{font-weight:660}
.key.equals{
  border-color:rgba(119,246,236,.42);
  background:linear-gradient(135deg,var(--accent),var(--accent-2));
  color:#04121c;
  font-size:24px;
  font-weight:800;
  box-shadow:inset 0 1px 0 rgba(255,255,255,.35),0 6px 22px rgba(36,224,208,.24);
}
.key.equals:hover{
  border-color:#b9fff8;
  background:linear-gradient(135deg,#4aedde,#61b9ff);
  box-shadow:inset 0 1px 0 rgba(255,255,255,.42),0 8px 28px rgba(36,224,208,.34);
}
.key.equals:active{background:linear-gradient(135deg,#1bcabb,#2894e7)}
.key:focus-visible,
.memory-row button:focus-visible{
  outline:2px solid var(--accent);
  outline-offset:2px;
}
.key svg{
  width:21px;
  height:21px;
  vertical-align:middle;
  fill:none;
  stroke:currentColor;
  stroke-width:1.8;
  stroke-linecap:round;
  stroke-linejoin:round;
}
@media(max-width:460px){
  body{display:block;padding:12px}
  .calculator{
    width:100%;
    min-height:calc(100vh - 24px);
    border-radius:20px;
  }
  .display{min-height:128px}
}
@media(max-height:700px){
  body{padding:8px}
  .calculator{min-height:calc(100vh - 16px)}
  .titlebar{min-height:54px;padding-top:7px;padding-bottom:7px}
  .calculator-logo{width:30px;height:30px}
  .display{min-height:94px;padding-top:7px;padding-bottom:8px}
  .history{min-height:20px;line-height:20px}
  .current{min-height:54px;line-height:54px}
  .memory-row button{min-height:30px}
  .keys{grid-template-rows:repeat(6,minmax(44px,1fr));gap:5px}
  .key{min-height:44px}
}
@media(prefers-reduced-motion:reduce){
  .key,.memory-row button{transition:none}
}
</style>
</head>
<body>
<main class="calculator" aria-label="Kalkulator standardowy">
  <header class="titlebar">
    <div class="title-identity">
      <svg class="calculator-logo" viewBox="0 0 24 24" aria-hidden="true">
        <rect x="4" y="3" width="16" height="18" rx="3"></rect>
        <path d="M8 7h8M8 12h1M12 12h1M16 12h1M8 16h1M12 16h1M16 16h1"></path>
      </svg>
      <div class="title-copy">
        <span class="mode-label">Standard mode</span>
        <h1>Kalkulator</h1>
      </div>
    </div>
    <div class="title-status">
      <span class="system-status">Ready</span>
      <span class="memory-indicator" id="memoryIndicator" aria-label="Pamięć kalkulatora"></span>
    </div>
  </header>

  <section class="display" aria-live="polite" aria-atomic="true">
    <output class="history" id="history"></output>
    <output class="current" id="display">0</output>
  </section>

  <div class="memory-row" aria-label="Pamięć">
    <button type="button" data-action="memory-clear" id="memoryClear" disabled>MC</button>
    <button type="button" data-action="memory-recall" id="memoryRecall" disabled>MR</button>
    <button type="button" data-action="memory-add">M+</button>
    <button type="button" data-action="memory-subtract">M−</button>
    <button type="button" data-action="memory-store">MS</button>
  </div>

  <div class="keys">
    <button class="key function" type="button" data-action="percent" aria-label="Procent">%</button>
    <button class="key function" type="button" data-action="clear-entry">CE</button>
    <button class="key function" type="button" data-action="clear-all">C</button>
    <button class="key function" type="button" data-action="backspace" aria-label="Usuń ostatnią cyfrę">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M9 5h10v14H9l-6-7 6-7Z"></path><path d="m12 9 4 6m0-6-4 6"></path></svg>
    </button>

    <button class="key function" type="button" data-action="reciprocal">¹⁄ₓ</button>
    <button class="key function" type="button" data-action="square">x²</button>
    <button class="key function" type="button" data-action="sqrt">√x</button>
    <button class="key operator" type="button" data-action="operator" data-value="/" aria-label="Dzielenie">÷</button>

    <button class="key digit" type="button" data-action="digit" data-value="7">7</button>
    <button class="key digit" type="button" data-action="digit" data-value="8">8</button>
    <button class="key digit" type="button" data-action="digit" data-value="9">9</button>
    <button class="key operator" type="button" data-action="operator" data-value="*" aria-label="Mnożenie">×</button>

    <button class="key digit" type="button" data-action="digit" data-value="4">4</button>
    <button class="key digit" type="button" data-action="digit" data-value="5">5</button>
    <button class="key digit" type="button" data-action="digit" data-value="6">6</button>
    <button class="key operator" type="button" data-action="operator" data-value="-" aria-label="Odejmowanie">−</button>

    <button class="key digit" type="button" data-action="digit" data-value="1">1</button>
    <button class="key digit" type="button" data-action="digit" data-value="2">2</button>
    <button class="key digit" type="button" data-action="digit" data-value="3">3</button>
    <button class="key operator" type="button" data-action="operator" data-value="+" aria-label="Dodawanie">+</button>

    <button class="key function" type="button" data-action="sign" aria-label="Zmień znak">⁺⁄₋</button>
    <button class="key digit" type="button" data-action="digit" data-value="0">0</button>
    <button class="key" type="button" data-action="decimal" aria-label="Przecinek dziesiętny">,</button>
    <button class="key equals" type="button" data-action="equals" aria-label="Równa się">=</button>
  </div>
</main>

<script>
const MAX_DIGITS = 16;
const MEMORY_KEY = "msd_standard_calculator_memory";
const symbols = {"+":"+","-":"−","*":"×","/":"÷"};

const state = {
  current:"0",
  stored:null,
  pending:null,
  awaitingOperand:false,
  overwrite:false,
  lastOperator:null,
  lastOperand:null,
  history:"",
  error:"",
  memory:0,
  hasMemory:false
};

const display = document.getElementById("display");
const historyOut = document.getElementById("history");
const memoryIndicator = document.getElementById("memoryIndicator");
const memoryClear = document.getElementById("memoryClear");
const memoryRecall = document.getElementById("memoryRecall");

function loadMemory(){
  try{
    const saved = localStorage.getItem(MEMORY_KEY);
    if(saved !== null && Number.isFinite(Number(saved))){
      state.memory = Number(saved);
      state.hasMemory = true;
    }
  }catch(_error){}
}

function saveMemory(){
  try{
    if(state.hasMemory) localStorage.setItem(MEMORY_KEY, String(state.memory));
    else localStorage.removeItem(MEMORY_KEY);
  }catch(_error){}
}

function grouped(raw){
  if(/[eE]/.test(raw)) return raw.replace(".", ",");
  const negative = raw.startsWith("-");
  const unsigned = negative ? raw.slice(1) : raw;
  const parts = unsigned.split(".");
  const integer = (parts[0] || "0").replace(/\B(?=(\d{3})+(?!\d))/g, "\u00a0");
  const fraction = parts.length > 1 ? "," + parts[1] : "";
  return (negative ? "−" : "") + integer + fraction;
}

function render(){
  const text = state.error || grouped(state.current);
  display.textContent = text;
  display.classList.toggle("medium", text.length > 13 && text.length <= 18);
  display.classList.toggle("small", text.length > 18);
  historyOut.textContent = state.history;
  memoryIndicator.textContent = state.hasMemory ? "M" : "";
  memoryClear.disabled = !state.hasMemory;
  memoryRecall.disabled = !state.hasMemory;
}

function resetForFreshInput(){
  if(state.error) clearAll();
  if(state.overwrite){
    if(state.pending === null){
      state.history = "";
      state.lastOperator = null;
      state.lastOperand = null;
    }
    state.current = "0";
    state.overwrite = false;
  }
}

function inputDigit(digit){
  resetForFreshInput();
  if(state.current.replace(/\D/g, "").length >= MAX_DIGITS) return;
  if(state.current === "0") state.current = digit;
  else if(state.current === "-0") state.current = "-" + digit;
  else state.current += digit;
  state.awaitingOperand = false;
  render();
}

function inputDecimal(){
  resetForFreshInput();
  if(!state.current.includes(".")) state.current += ".";
  state.awaitingOperand = false;
  render();
}

function setError(message){
  state.error = message;
  state.current = "0";
  state.stored = null;
  state.pending = null;
  state.awaitingOperand = false;
  state.overwrite = true;
  state.lastOperator = null;
  state.lastOperand = null;
  state.history = "";
  render();
}

function rounded(value){
  if(!Number.isFinite(value)) return null;
  if(Math.abs(value) < 1e-14) return 0;
  return Number(value.toPrecision(15));
}

function compute(left, right, operator){
  if(operator === "+") return rounded(left + right);
  if(operator === "-") return rounded(left - right);
  if(operator === "*") return rounded(left * right);
  if(operator === "/"){
    if(right === 0){
      setError("Nie można dzielić przez zero");
      return null;
    }
    return rounded(left / right);
  }
  return right;
}

function setCurrentNumber(value){
  const clean = rounded(value);
  if(clean === null){
    setError("Wynik jest nieprawidłowy");
    return false;
  }
  state.current = String(clean);
  state.error = "";
  return true;
}

function chooseOperator(operator){
  if(state.error) return;
  if(state.pending && state.awaitingOperand){
    state.pending = operator;
    state.history = grouped(String(state.stored)) + " " + symbols[operator];
    render();
    return;
  }

  const current = Number(state.current);
  if(state.pending && state.stored !== null){
    const result = compute(state.stored, current, state.pending);
    if(result === null || !setCurrentNumber(result)) return;
    state.stored = result;
  }else{
    state.stored = current;
  }

  state.pending = operator;
  state.awaitingOperand = true;
  state.lastOperator = null;
  state.lastOperand = null;
  state.history = grouped(String(state.stored)) + " " + symbols[operator];
  state.overwrite = true;
  render();
}

function equals(){
  if(state.error) return;
  let operator = state.pending;
  let left;
  let right;

  if(operator){
    left = state.stored;
    right = state.awaitingOperand ? state.stored : Number(state.current);
    state.lastOperator = operator;
    state.lastOperand = right;
  }else if(state.lastOperator !== null && state.lastOperand !== null){
    operator = state.lastOperator;
    left = Number(state.current);
    right = state.lastOperand;
  }else{
    return;
  }

  const result = compute(left, right, operator);
  if(result === null) return;
  state.history = grouped(String(left)) + " " + symbols[operator] + " " + grouped(String(right)) + " =";
  if(!setCurrentNumber(result)) return;
  state.stored = null;
  state.pending = null;
  state.awaitingOperand = false;
  state.overwrite = true;
  render();
}

function clearEntry(){
  if(state.error){
    clearAll();
    return;
  }
  state.current = "0";
  state.awaitingOperand = false;
  state.overwrite = false;
  render();
}

function clearAll(){
  state.current = "0";
  state.stored = null;
  state.pending = null;
  state.awaitingOperand = false;
  state.overwrite = false;
  state.lastOperator = null;
  state.lastOperand = null;
  state.history = "";
  state.error = "";
  render();
}

function backspace(){
  if(state.error){
    clearAll();
    return;
  }
  if(state.overwrite) return;
  if(state.current.length <= 1 || (state.current.startsWith("-") && state.current.length === 2)){
    state.current = "0";
  }else{
    state.current = state.current.slice(0, -1);
  }
  render();
}

function toggleSign(){
  if(state.error) return;
  resetForFreshInput();
  state.current = state.current.startsWith("-") ? state.current.slice(1) : "-" + state.current;
  state.awaitingOperand = false;
  render();
}

function applyUnary(kind){
  if(state.error) return;
  const value = Number(state.current);
  const shown = grouped(String(value));
  let result;
  let expression;

  if(kind === "reciprocal"){
    if(value === 0){
      setError("Nie można dzielić przez zero");
      return;
    }
    result = 1 / value;
    expression = "1/(" + shown + ")";
  }else if(kind === "square"){
    result = value * value;
    expression = "sqr(" + shown + ")";
  }else{
    if(value < 0){
      setError("Nieprawidłowe dane wejściowe");
      return;
    }
    result = Math.sqrt(value);
    expression = "√(" + shown + ")";
  }

  if(!setCurrentNumber(result)) return;
  state.awaitingOperand = false;
  state.history = state.pending && state.stored !== null
    ? grouped(String(state.stored)) + " " + symbols[state.pending] + " " + expression
    : expression;
  state.overwrite = true;
  render();
}

function percent(){
  if(state.error) return;
  const value = Number(state.current);
  let result = value / 100;
  if(state.pending && state.stored !== null && (state.pending === "+" || state.pending === "-")){
    result = state.stored * value / 100;
  }
  state.history = state.pending && state.stored !== null
    ? grouped(String(state.stored)) + " " + symbols[state.pending] + " " + grouped(String(value)) + "%"
    : grouped(String(value)) + "%";
  if(!setCurrentNumber(result)) return;
  state.awaitingOperand = false;
  state.overwrite = true;
  render();
}

function memoryAction(action){
  if(state.error && action !== "memory-clear") return;
  const current = Number(state.current);
  if(action === "memory-clear"){
    state.memory = 0;
    state.hasMemory = false;
  }else if(action === "memory-recall"){
    if(!state.hasMemory) return;
    setCurrentNumber(state.memory);
    state.awaitingOperand = false;
    state.overwrite = true;
  }else if(action === "memory-store"){
    state.memory = current;
    state.hasMemory = true;
  }else if(action === "memory-add"){
    state.memory = (state.hasMemory ? state.memory : 0) + current;
    state.hasMemory = true;
  }else if(action === "memory-subtract"){
    state.memory = (state.hasMemory ? state.memory : 0) - current;
    state.hasMemory = true;
  }
  saveMemory();
  render();
}

function runAction(action, value){
  if(action === "digit") inputDigit(value);
  else if(action === "decimal") inputDecimal();
  else if(action === "operator") chooseOperator(value);
  else if(action === "equals") equals();
  else if(action === "clear-entry") clearEntry();
  else if(action === "clear-all") clearAll();
  else if(action === "backspace") backspace();
  else if(action === "sign") toggleSign();
  else if(action === "percent") percent();
  else if(action === "reciprocal" || action === "square" || action === "sqrt") applyUnary(action);
  else if(action.startsWith("memory-")) memoryAction(action);
}

document.querySelector(".calculator").addEventListener("click", event => {
  const button = event.target.closest("button[data-action]");
  if(!button || button.disabled) return;
  runAction(button.dataset.action, button.dataset.value);
});

function handleKeyboardKey(key){
  let handled = true;
  if(/^\d$/.test(key)) inputDigit(key);
  else if(key === "." || key === ",") inputDecimal();
  else if(key === "+" || key === "-" || key === "*" || key === "/") chooseOperator(key);
  else if(key === "Enter" || key === "=") equals();
  else if(key === "Escape") clearAll();
  else if(key === "Delete") clearEntry();
  else if(key === "Backspace") backspace();
  else if(key === "%") percent();
  else handled = false;
  return handled;
}

document.addEventListener("keydown", event => {
  const isToggleShortcut = event.key.toLowerCase() === "k" && !event.ctrlKey && !event.metaKey && !event.altKey && !event.shiftKey && !event.repeat;
  if(isToggleShortcut && window.parent !== window){
    window.parent.postMessage({type:"msd:toggleCalculator"}, "*");
    event.preventDefault();
    return;
  }
  if(handleKeyboardKey(event.key)) event.preventDefault();
});

window.addEventListener("message", event => {
  if(window.parent === window || event.source !== window.parent) return;
  if(!event.data || event.data.type !== "msd-calculator-key") return;
  handleKeyboardKey(String(event.data.key || ""));
});

loadMemory();
render();
</script>
</body>
</html>
