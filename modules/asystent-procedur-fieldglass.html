y, łączny czas pracy, hiring managera i załączniki.","where":"Summary / Details","check":"Sprawdź źródłowy opis stanowiska i dane z intake call.","role":"PMO","source":"J","risk":"","tentative":false},{"title":"Użyj Edit do audytu","action":"Wejdź w Edit. Skontroluj powtórzony Company Code, Plant / Ship-to, purchasing organization, właściwy Cost Object 100% i Division.","where":"Actions → Edit","check":"Nie poprawiaj „na oko” danych budżetowych; potwierdź je z HM.","role":"PMO","source":"J","risk":"","tentative":false},{"title":"Ustaw odpowiedzialnego CSP","action":"Zmień AgileOne Coordinator z konta domyślnego na właściwego opiekuna.","where":"Coordinator / Distribution","check":"Prawidłowy CSP otrzyma zadania i będzie monitorował JP.","role":"PMO","source":"J","risk":"","tentative":false},{"title":"Zweryfikuj godziny i Rate Schedule","action":"Porównaj Hours per Day/Week; sprawdź Rate Schedule i przykładowe min/max rates. Nie zmieniaj szablonu bez rzeczywistej potrzeby i uzgodnienia z HM.","where":"Rates / Time Settings","check":"Zwróć uwagę, że stawki JP mogą być placeholderem do chwili wyboru Worker Pay Type przez supplier.","role":"PMO","source":"J","risk":"","tentative":false},{"title":"Dodaj informacje dla dostawców","action":"W Comments to Supplier wpisz informacje potrzebne do sourcingu, np. shift, język, warunki, bez poufnych danych. Nie używaj globalnego Buyer Reference do informacji osobowych.","where":"Comments to Supplier / Buyer Reference","check":"Komentarz widoczny właściwym supplierom.","role":"PMO","source":"J","risk":"Buyer Reference może być wyszukiwany szerzej w tenant.","tentative":false},{"title":"Sprawdź limity i reguły","action":"Wybierz Max Submissions per Supplier świadomie. W szkoleniu domyślnie były 3; wyjątki uzgadniaj. Reguła przekroczenia requested rate: No w pokazanej konfiguracji.","where":"Distribution Settings / Rules","check":"Nie wprowadzaj krótkiego respond-by dla trudno obsadzalnych ról bez decyzji.","role":"PMO","source":"J" ować do roli i źródła zatrudnienia.","role":"PMO","source":"N1","risk":"","tentative":false},{"title":"Obejrzyj CV w podglądzie","action":"W miarę możliwości korzystaj z podglądu zamiast zapisywać CV na lokalny dysk.","where":"Job Seeker → Resume / CV","check":"Zachowaj zasadę minimalizacji danych osobowych.","role":"PMO","source":"N1","risk":"","tentative":false},{"title":"Zweryfikuj Rate Change Matrix","action":"Sprawdź, czy potencjalny tenure discount jest właściwie zastosowany.","where":"Rates → Rate Change Matrix","check":"Rabat stażowy to nie standardowa metoda negocjacji wynagrodzenia.","role":"PMO","source":"N1","risk":"","tentative":false},{"title":"Wybierz decyzję","action":"Jeżeli zgłoszenie kwalifikuje się do dalszego procesu, użyj Shortlist; w przeciwnym razie Reject z odpowiednim uzasadnieniem.","where":"Job Seeker → Actions","check":"Po Shortlist kandydat trafia do HM.","role":"PMO","source":"N1","risk":"","tentative":false},{"title":"Sprawdź status i dalszy etap","action":"Monitoruj skierowanie do managera, a w razie potrzeby przejdź do Schedule Interview.","where":"Job Seekers / Related","check":"Nie pomyl Shortlist z Hire.","role":"PMO","source":"N1","risk":"","tentative":false}],"source":"N1","risk":"","depends":["interview","preid-hire"],"tags":[],"open_issues":[],"original_title":"Przejrzyj kandydata i wykonaj Shortlist / Reject"},{"id":"interview","title":"Jak umówić rozmowę z kandydatem","summary":"Od Shortlist przez propozycję terminów do potwierdzenia rozmowy z kandydatem.","category":"Kandydaci","roles":["HM","PMO","SUP"],"aliases":["schedule interview","interview confirmation","rozmowa","termin rozmowy","interview invite"],"steps":[{"title":"Wybierz Shortlisted Candidate","action":"Otwórz kandydata na To-do List HM lub w Job Posting.","where":"Job Seeker → Actions","check":"Kandydat musi być skierowany do HM.","role":"HM","source":"N1","risk":"","tentative":false},{"title":"Uruchom Schedule Interview","action":"Wybierz Schedule Interview; 'wo-supplier':['jak zaakceptowac work order','vat dla work order','dostawca akceptacja'],
'onboarding':['jak dodac exhibit b','dokumenty onboardingowe','activity items'],
'activate':['jak aktywowac workera','uruchomienie pracownika'],
'worker-register':['jak pracownik tworzy konto','rejestracja worker'],
'sow-create':['jak zrobic sow','jak utworzyc sow','jak zrobic sob','jak zrobic freelancera','nowy freelancer','statement of work','sow freelancer'],
'sow-approve':['jak zatwierdzic sow','sow approval','akceptacja sow'],
'sow-add-worker':['jak dodac freelancera do sow','worker role'],
'sow-onboard':['dokumenty sow','sow compliance'],
'sow-timesheet':['godziny freelancera','sow hours'],
'sow-change':['jak przedluzyc sow','jak zmienic sow','rewizja sow'],
 'timesheet-submit':['jak wpisac godziny','jak rozliczyc czas','karta czasu','timesheet pracownika'],
 'timesheet-approve':['jak zaakceptowac godziny','zatwierdzenie godzin'],
 'timesheet-revise':['jak zrobic rewizje timesheet','jak poprawic godziny po fakturze','korekta rozliczenia'],
 'absence':['jak zglosic nieobecnosc','urlop','choroba'],
 'expense-create':['jak dodac koszt','jak wprowadzic expense','kilometrowka','zwrot kosztow'],
 'expense-approve':['jak zatwierdzic koszt','approve expense'],
 'mi-create':['jak dodac bonus','jak zrobic misc invoice','premia i wyplata'],
 'mi-approve':['jak zatwierdzic misc invoice','akceptacja faktury dodatkowej'],
 'mi-correct':['jak poprawic misc invoice','korekta dodatkowej faktury'],
 'wo-revision':['jak zrobic rewizje','jak przedluzyc kontrakt','jak zmienic stawke','rewizja work order','extension','work order revision'],
 'tenure-discount':['rabat po 1040 godzinach','tenure discount','matryca zmiany stawki'],
 'find-record':['jak znalezc joba','nie widze work order','znajdz rekord'],
 'daily-control':['co mam dzis zrobic','zadania dzienne'],
 'wo-replace':['błędny cost center','zly cost center','zmienic kod kosztow'],
 'close-worker':['jak zamknac work order','jak zakonczyc umowe','jak zamknac kontrakt','offboarding','zakoncz pracownika']
};
const COMMON=new Set(['jak','zrobic','zrob','mam','moge','chce','to','jest','czy','w','we','na','do','po','dla','ten','tego','z','ze','sie','i','oraz','aby','krok','kroki','kroku','krokow','prosze','jaki','jakie','polecenie','instrukcja','pokaz','pokazac','fieldglass','systemie','system','proces','procedura']);
const INDEX=procedures.map(p=>{let alias=[...(p.aliases||[]),...(extra[p.id]||[])].map(norm);return {p,title:norm(p.title+' '+(p.original_title||'')),aliases:alias,summary:norm(p.summary),category:norm(p.category),tags:norm((p.tags||[]).join(' ')),steps:norm(p.steps.map(s=>s.title+' '+s.action+' '+s.where).join(' '))}});
const has=(s,reg)=>reg.test(s);
function directIntent(q){
const job=/\b(job|joba|jobu|jobs|jobposting|wakat|wakatu|rekwizycj\w*|zapotrzebowani\w*|posting|pozycj\w*)\b/;
const wo=/\b(work order|wo|kontrakt\w*|umow\w*|zleceni\w*)\b/;
const sow=/\b(sow|statement of work|freelancer\w*|freelanc\w*)\b/;
const close=/\b(zamkn\w*|zakoncz\w*|anul\w*|wstrzym\w*|halt\w*|close\w*|cancel\w*|offboard\w*)\b/;
const revision=/\b(rewiz\w*|revision\w*|przedluz\w*|extension\w*|wydluz\w*|zmien\w*|zmian\w* stawk\w*|podwyz\w* stawk\w*|korekt\w*|skoryg\w*|popraw\w*)\b/;
const create=/\b(nowy\w*|now\w*|utworz\w*|stworz\w*|zrob\w*|zaloz\w*|otworz\w*|create\w*|dodaj\w*)\b/;
if(/\b(cost center|cost object|company code|kod\w* koszt\w*|centrum koszt\w*)\b/.test(q)&&/\b(blad\w*|bled\w*|zly\w*|zla\w*|zmien\w*|popraw\w*|korekt\w*|skoryg\w*)\b/.test(q))return 'wo-replace';
if(has(q,close)&&has(q,wo)&&!has(q,job))return 'close-worker';
if(has(q,close)&&has(q,job))return 'jp-close';
if(has(q,close)&&has(q,sow))return 'sow-change';
if(has(q,revision)&&has(q,sow))return 'sow-change';
if(has(q,revision)&&/\b(timesheet\w*|godzin\w*|karta czasu|expense\w*|rozliczen\w*|rozlicz\w*|faktur\w*)\b/.test(q))return 'timesheet-revise';
if(has(q,revision))return 'wo-revision';
if(has(q,sow)){
 if(/\b(akcept\w*|zatwierdz\w*|approval|approve)\b/.test(q))return 'sow-approve';
 if(/\b(dod\w*|przypisz\w*|add)\b/.test(q)&&/\b(pracownik\w*|worker\w*|osob\w*)\b/.test(q))return 'sow-add-worker';
 if(/\b(godzin\w*|timesheet\w*|rozlicz\w*)\b/.test(q))return 'sow-timesheet';
 if(/\b(onboard\w*|dokument\w*|compliance|aktyw\w*)\b/.test(q))return 'sow-onboard';
 return 'sow-create';
}
if(has(q,job)){
 if(/\b(zatwierdz\w*|approve|approval|akcept\w*)\b/.test(q))return 'jp-review';
 if(/\b(wysl\w*|rozesl\w*|distribut\w*|dystrybu\w*|dostawc\w*|agencj\w*)\b/.test(q))return 'jp-distribute';
 if(has(q,create))return 'jp-create';
}
if(/\b(odrzuc\w*|shortlist\w*|ocen\w*|zweryfik\w*)\b/.test(q)&&/\b(kandydat\w*|cv|job seeker)\b/.test(q))return 'candidate-review';
if(/\b(umow\w*|zapros\w*|rozmow\w*|interview\w*)\b/.test(q))return 'interview';
if(/\b(przedluz\w*|kontrakt\w*)\b/.test(q)&&/\b(umow\w*|work order|wo)\b/.test(q))return 'wo-revision';
if(/\b(timesheet\w*|godzin\w*|karta czasu)\b/.test(q)){
 if(/\b(zatwierdz\w*|approve|akcept\w*)\b/.test(q))return 'timesheet-approve';
 return 'timesheet-submit';
}
if(/\b(koszt\w*|expense\w*|kilometrow\w*)\b/.test(q))return /\b(zatwierdz\w*|approve|akcept\w*)\b/.test(q)?'expense-approve':'expense-create';
if(/\b(nieobecn\w*|absence|urlop\w*|chorob\w*)\b/.test(q))return 'absence';
if(/\b(work order|wo)\b/.test(q)&&has(q,create))return 'hire-wo';
if(/\b(po|ariba|purchase order|purchase requisition)\b/.test(q))return 'wo-po';
if(/\b(aktyw\w*|activate)\b/.test(q)&&/\b(pracownik\w*|worker\w*)\b/.test(q))return 'activate';
if(/\b(misc\w*|bonus\w*|premi\w*|invoice\w*)\b/.test(q))return /\b(zatwierdz\w*|approve|akcept\w*)\b/.test(q)?'mi-approve':'mi-create';
return null;
}
function rank(raw){let q=norm(raw);if(!q)return [];let intent=directIntent(q);let queryTokens=q.split(' ').filter(w=>w.length>=2&&!COMMON.has(w));const scored=INDEX.map(v=>{let score=0;if(intent===v.p.id)score+=250;if(v.title===q)score+=100;for(const a of v.aliases){if(a===q)score=Math.max(score,105);else if(a.length>=5&&q.includes(a))score=Math.max(score,70+Math.min(16,a.length/3));else if(q.length>=5&&a.includes(q))score+=Math.min(24,q.length)}
const pools=[[v.title,11],[v.aliases.join(' '),7],[v.tags,4],[v.summary,3],[v.category,2],[v.steps,0.6]];
for(const token of queryTokens){let best=0;for(const [field,weight] of pools){if(!field)continue;let t=field.split(' ');if(t.includes(token))best=Math.max(best,weight);else if(field.includes(token))best=Math.max(best,weight*.65);else if(weight>1)for(const candidate of t){const m=similar(token,candidate);if(m)best=Math.max(best,weight*m)}}score+=best}
if(queryTokens.length&&queryTokens.every(t=>v.title.split(' ').some(c=>similar(t,c)>.8)))score+=12;
return {...v,score};}).filter(r=>r.score>2).sort((a,b)=>b.score-a.score);
return scored;
}
function toast(msg){const el=document.getElementById('toast');el.textContent=msg;el.hidden=false;clearTimeout(toast.timer);toast.timer=setTimeout(()=>el.hidden=true,2100)}
function theme(){let dark=document.body.classList.contains('dark');document.getElementById('theme').innerHTML=dark?icons.sun:icons.moon;document.getElementById('theme').setAttribute('aria-label',dark?'Włącz jasny motyw':'Włącz ciemny motyw')}
try{if(localStorage.getItem('fg-theme')==='dark')document.body.classList.add('dark')}catch(_){}theme();
document.getElementById('theme').addEventListener('click',()=>{document.body.classList.toggle('dark');try{localStorage.setItem('fg-theme',document.body.classList.contains('dark')?'dark':'light')}catch(_){}theme()});
function hideSuggestions(){suggestions.hidden=true;search.setAttribute('aria-expanded','false');state.activeSuggestion=-1}
function showSuggestions(){const q=search.value.trim();if(norm(q).length<2){hideSuggestions();return}let matches=rank(q).slice(0,5);state.suggestions=matches;state.activeSuggestion=-1;if(!matches.length){hideSuggestions();return}suggestions.innerHTML=matches.map((v,i)=>`<button type="button" class="suggestion" role="option" aria-selected="false" data-select="${esc(v.p.id)}"><span class="sug-icon">↗</span><span class="sug-name">${esc(v.p.title)}</span><span class="sug-steps">${v.p.steps.length} kroków</span></button>`).join('');suggestions.hidden=false;search.setAttribute('aria-expanded','true')}
function buildStep(step,i,mode){let completed=state.checked.has(i),risk=String(step.risk||'').trim(),tentative=step.tentative===true||step.tentative==='True';let where=String(step.where||'').trim(),check=String(step.check||'').trim();return `<article class="step ${completed?'done':''}" data-step="${i}"><button type="button" class="step-number" data-mark="${i}" aria-label="${completed?'Odznacz':'Oznacz jako wykonany'} krok ${i+1}" title="${completed?'Odznacz krok':'Oznacz krok jako wykonany'}">${completed?'<span class="step-checkmark">✓</span>':String(i+1).padStart(2,'0')}</button><div class="step-main"><h3>${esc(step.title)}</h3><p>${esc(step.action)}</p><div class="step-details">${where?`<div class="step-meta"><span class="dot" aria-hidden="true"></span><span><strong>Gdzie:</strong> <code>${esc(where)}</code></span></div>`:''}${check?`<div class="step-meta verify"><span class="dot" aria-hidden="true"></span><span><strong>Sprawdź:</strong> ${esc(check)}</span></div>`:''}${risk?`<div class="step-meta warning"><strong>Uwaga:</strong> ${esc(risk)}</div>`:''}${tentative?`<div class="step-meta issue"><strong>Do potwierdzenia:</strong> Ten szczegół nie został jednoznacznie ustalony na szkoleniu.</div>`:''}</div><div class="step-role">${esc(rolePL[step.role]||step.role)}</div></div></article>`}
function progress(){return state.selected?Math.round(100*state.checked.size/state.selected.steps.length):0}
function textExport(p){let out=[p.title,'',...p.steps.map((s,i)=>{return `${i+1}. ${s.title}\n${s.action}${s.where?'\nGdzie: '+s.where:''}${s.check?'\nSprawdź: '+s.check:''}${s.risk?'\nUwaga: '+s.risk:''}`})];return out.join('\n\n')}
function renderAnswer(){let p=state.selected;if(!p)return;const mode=state.mode,n=p.steps.length;const issueCount=p.steps.filter(s=>s.tentative===true||s.tentative==='True').length;
const body=mode==='all'?`<div class="steps">${p.steps.map((s,i)=>buildStep(s,i,'all')).join('')}</div>`:`<div class="wizard-indicator">Krok ${state.step+1} z ${n}</div><div class="steps">${buildStep(p.steps[state.step],state.step,'wizard')}</div><div class="wizard-nav"><button class="nav-btn" data-prev ${state.step===0?'disabled':''}>← Poprzedni</button><button class="nav-btn primary" data-next>${state.step===n-1?'Zakończ ✓':'Gotowe, dalej →'}</button></div>`;
const relatedIds=(p.depends||[]).filter(x=>x!==p.id&&byId[x]).slice(0,3);
answer.innerHTML=`<div class="answer-header"><div><div class="answer-kicker"><i></i>Instrukcja krok po kroku</div><h2>${esc(p.title)}</h2></div><div class="answer-tools"><button class="mini-icon" data-copy title="Kopiuj kroki" aria-label="Kopiuj kroki">${icons.copy}</button><button class="mini-icon" data-print title="Drukuj kroki" aria-label="Drukuj kroki">${icons.print}</button></div></div><div class="answer-toolbar"><div class="progress-label"><span>${n} kroków</span><span class="progress-track" aria-hidden="true"><span class="progress-fill" style="display:block;width:${progress()}%"></span></span><span>${state.checked.size}/${n} wykonano</span></div><button type="button" class="switch-view" data-view-switch>${mode==='all'?'Pokaż po jednym kroku':'Pokaż wszystkie kroki'} <span aria-hidden="true">›</span></button></div>${body}${relatedIds.length?`<div class="related"><span class="related-title">Dalsze czynności:</span>${relatedIds.map(id=>`<button data-related="${id}">${esc(byId[id].title)}</button>`).join('')}</div>`:''}<details class="source-disclosure"><summary>Źródła i uwagi</summary><div class="source-body"><p>Opracowano na podstawie przesłanych notatek i transkrypcji szkoleniowych. Jest to pomoc robocza, nie zatwierdzona procedura.</p><p><strong>Źródło:</strong> ${esc(DB.sources[p.source]?.label||'Materiały szkoleniowe')}</p>${p.open_issues?.length?`<p><strong>Do potwierdzenia:</strong> ${esc(p.open_issues.join(' '))}</p>`:''}<p>Oryginalne nazwy przycisków Fieldglass pozostawiono po angielsku, aby łatwo je znaleźć na ekranie.</p></div></details>`;
answer.hidden=false;app.classList.add('has-answer');document.title=p.title+' | Fieldglass';
}
function doSearch(raw,forced){const q=raw.trim();hideSuggestions();if(!q){search.focus();return}search.value=q;let matched=forced?byId[forced]:rank(q)[0]?.p;state.selected=matched||null;state.step=0;state.mode='all';state.checked=new Set();if(!matched){answer.hidden=false;app.classList.add('has-answer');answer.innerHTML=`<div class="notfound"><h2>Nie znalazłem tej procedury.</h2><p>Spróbuj krótszego pytania lub innego określenia czynności.</p></div>`;document.title='Brak procedury | Fieldglass';return}renderAnswer();const url='#'+encodeURIComponent(matched.id);if(location.hash!==url)history.replaceState({},'',url);}
function reset(){state.selected=null;state.checked.clear();state.step=0;answer.hidden=true;app.classList.remove('has-answer');search.value='';hideSuggestions();document.title='Fieldglass | Asystent Procedur';history.replaceState({},'',location.pathname+location.search);search.focus()}
document.getElementById('searchForm').addEventListener('submit',e=>{e.preventDefault();if(state.activeSuggestion>=0&&state.suggestions[state.activeSuggestion])doSearch(state.suggestions[state.activeSuggestion].p.title,state.suggestions[state.activeSuggestion].p.id);else doSearch(search.value)});
search.addEventListener('input',showSuggestions);
search.addEventListener('keydown',e=>{if(suggestions.hidden)return;let opts=[...suggestions.querySelectorAll('[data-select]')];if(e.key==='ArrowDown'){e.preventDefault();state.activeSuggestion=(state.activeSuggestion+1)%opts.length}else if(e.key==='ArrowUp'){e.preventDefault();state.activeSuggestion=(state.activeSuggestion-1+opts.length)%opts.length}else if(e.key==='Escape'){e.preventDefault();hideSuggestions();return}else return;opts.forEach((o,i)=>o.setAttribute('aria-selected',i===state.activeSuggestion?'true':'false'))});
suggestions.addEventListener('click',e=>{const b=e.target.closest('[data-select]');if(b)doSearch(byId[b.dataset.select].title,b.dataset.select)});
document.addEventListener('click',e=>{if(!e.target.closest('.search-area'))hideSuggestions();const mark=e.target.closest('[data-mark]');if(mark&&state.selected){let n=Number(mark.dataset.mark);state.checked.has(n)?state.checked.delete(n):state.checked.add(n);renderAnswer();return}if(e.target.closest('[data-view-switch]')&&state.selected){state.mode=state.mode==='all'?'wizard':'all';state.step=0;renderAnswer();return}if(e.target.closest('[data-next]')&&state.selected){state.checked.add(state.step);if(state.step<state.selected.steps.length-1)state.step++;else{state.mode='all';toast('Oznaczono wszystkie kroki')}renderAnswer();return}if(e.target.closest('[data-prev]')&&state.selected){state.step=Math.max(0,state.step-1);renderAnswer();return}const related=e.target.closest('[data-related]');if(related){doSearch(byId[related.dataset.related].title,related.dataset.related);answer.scrollIntoView({block:'start',behavior:'smooth'});return}if(e.target.closest('[data-print]')&&state.selected){if(state.mode==='wizard'){state.mode='all';renderAnswer()}window.print();return}if(e.target.closest('[data-copy]')&&state.selected){const t=textExport(state.selected);if(navigator.clipboard?.writeText){navigator.clipboard.writeText(t).then(()=>toast('Instrukcja skopiowana')).catch(()=>fallbackCopy(t))}else fallbackCopy(t);return}});
function fallbackCopy(t){const a=document.createElement('textarea');a.value=t;document.body.appendChild(a);a.select();try{document.execCommand('copy');toast('Instrukcja skopiowana')}catch(_){toast('Kopiowanie niedostępne')}a.remove()}
document.getElementById('homeLink').addEventListener('click',e=>{e.preventDefault();reset()});
document.addEventListener('keydown',e=>{if(e.key==='/'&&!['INPUT','TEXTAREA'].includes(document.activeElement?.tagName)){e.preventDefault();search.focus()}});
const id=decodeURIComponent(location.hash.slice(1));if(byId[id])doSearch(byId[id].title,id);
})();
</script>
