  <style>
    :root {
      --bg:#171a20;
      --panel:#272c34;
      --panel-soft:#272c34;
      --line:#444c58;
      --text:#f1f3f6;
      --muted:#c1c8d2;
      --accent:var(--work-accent);
      --accent-strong:var(--work-accent);
      --accent-dark:var(--work-accent);
      --ok:var(--work-accent);
      --info:var(--work-accent);
      --warn: #ffd58a;
      --danger: #ff9c9c;
      --radius-xl: 26px;
      --radius-lg: 20px;
      --radius-md: 14px;
      --shadow: 0 20px 50px rgba(0,0,0,.35);
      --max: 1380px;
    }

    * { box-sizing: border-box; }
    html, body { margin: 0; padding: 0; }
    body {
      font-family: Inter, Arial, sans-serif;
      color:#f1f3f6;
      background:
        radial-gradient(circle at top right, rgba(214,179,124,.18), transparent 22%),
        radial-gradient(circle at bottom left, rgba(159,203,255,.10), transparent 25%),
        linear-gradient(180deg, #0a0f17, #0d1420 42%, #0b1018 100%);
      min-height: 100vh;
    }

    .shell {
      width: min(var(--max), calc(100% - 28px));
      margin: 18px auto 34px;
    }

    .topbar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 16px;
      flex-wrap: wrap;
      margin-bottom: 18px;
    }

    .brand {
      display: flex;
      align-items: center;
      gap: 14px;
    }

    .logo {
      width: 52px;
      height: 52px;
      border-radius: 50%;
      border:1.8px solid var(--work-line);
      display: grid;
      place-items: center;
      color:#f1f3f6;
      background:#282d35;
      font-size: 24px;
      font-weight: 800;
      box-shadow: inset 0 0 0 5px rgba(214,179,124,.05);
    }

    .brand h1 {
      margin: 0;
      font-size: clamp(24px, 4vw, 36px);
      line-height: 1.02;
      letter-spacing: -0.02em;
    }

    .brand p {
      margin: 5px 0 0;
      color:#f1f3f6;
      font-size: 14px;
    }

    .top-actions {
      display: flex;
      align-items: center;
      gap: 10px;
      flex-wrap: wrap;
    }

    .lang-switch {
      display: inline-flex;
      gap: 6px;
      padding: 6px;
      background:#282d35;
      border:1px solid var(--line);
      border-radius: 999px;
      box-shadow:0 6px 22px rgba(0,0,0,.19);
    }

    .lang-btn,
    .btn,
    .icon-btn,
    select,
    input,
    textarea {
      font: inherit;
    }

    .lang-btn {
      border:0;
      background: transparent;
      color:#f1f3f6;
      padding: 10px 14px;
      border-radius: 999px;
      cursor: pointer;
      font-weight: 700;
      min-width: 58px;
    }

    .lang-btn.active {
      background:var(--work-selected));
      color:var(--work-accent);
    }

    .btn {
      border:1px solid var(--line);
      background:#282d35;
      color:#f1f3f6;
      padding: 12px 16px;
      border-radius: 14px;
      cursor: pointer;
      font-weight: 700;
      transition: .18s ease;
    }

    .btn:hover,
    .icon-btn:hover,
    .lang-btn:hover { transform: translateY(-1px); }

    .btn.primary {
      background:var(--work-selected));
      color:#f1f3f6;
      border-color:transparent;
      box-shadow:0 6px 22px rgba(0,0,0,.19);
    }

    .btn.soft {
      box-shadow:0 6px 22px rgba(0,0,0,.19);
    }

    .hero {
      display: grid;
      grid-template-columns: 1.1fr .9fr;
      gap: 16px;
      margin-bottom: 18px;
    }

    .panel {
      background:#282d35;
      border:1px solid var(--line);
      border-radius: var(--radius-xl);
      box-shadow:0 6px 22px rgba(0,0,0,.19);
      backdrop-filter: blur(10px);
    }

    .hero-main {
      padding: 22px 24px;
      display: flex;
      flex-direction: column;
      justify-content: center;
      min-height: 140px;
    }

    .hero-main h2 {
      margin: 0;
      font-size: clamp(24px, 3vw, 34px);
      line-height: 1.04;
      letter-spacing: -0.02em;
    }

    .hero-main p {
      margin: 10px 0 0;
      font-size: 15px;
      color:#f1f3f6;
      max-width: 720px;
      line-height: 1.55;
    }

    .hero-stats {
      padding: 16px;
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 12px;
      align-items: stretch;
    }

    .mini-stat {
      border-radius: 18px;
      padding: 16px;
      background:#282d35;
      border:1px solid var(--work-line);
      display: flex;
      flex-direction: column;
      justify-content: center;
      min-height: 108px;
    }

    .mini-stat .number {
      font-size: clamp(24px, 4vw, 38px);
      font-weight: 800;
      line-height: 1;
      margin-top: 8px;
    }

    .mini-stat .label {
      color:#c1c8d2;
      font-size: 13px;
      line-height: 1.35;
    }

    .layout {
      display: grid;
      grid-template-columns: 430px 1fr;
      gap: 18px;
      align-items: start;
    }

    .panel-inner {
      padding: 18px;
    }

    .section-head {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 12px;
      margin-bottom: 14px;
      flex-wrap: wrap;
    }

    .section-head h3 {
      margin: 0;
      font-size: 22px;
      letter-spacing: -0.02em;
    }

    .section-note {
      margin: 2px 0 0;
      font-size: 13px;
      color:#f1f3f6;
    }

    .field-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 12px;
    }

    .field {
      margin-bottom: 12px;
    }

    label {
      display: block;
      font-size: 13px;
      color:#c1c8d2;
      margin-bottom: 8px;
      font-weight: 700;
    }

    input, select, textarea {
      width: 100%;
      border:1px solid var(--work-line);
      background:#191d24;
      color:#f1f3f6;
      padding: 13px 14px;
      border-radius: 14px;
      outline: none;
      transition: .18s ease;
    }

    textarea {
      resize: vertical;
      min-height: 92px;
      line-height: 1.45;
    }

    input:focus,
    select:focus,
    textarea:focus {
      border-color:var(--work-line);
      box-shadow:0 6px 22px rgba(0,0,0,.19);
    }

    .form-actions {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 10px;
      margin-top: 8px;
    }

    .filters {
      display: grid;
      grid-template-columns: 1.2fr .7fr auto;
      gap: 10px;
      margin-bottom: 14px;
    }

    .meeting-list {
      display: grid;
      gap: 12px;
    }

    .meeting-card {
      border-radius: 22px;
      padding: 16px;
      background:#282d35;
      border:1px solid var(--work-line);
      transition: .18s ease;
    }

    .meeting-card:hover {
      transform: translateY(-1px);
      border-color:var(--work-line);
    }

    .meeting-top {
      display: flex;
      justify-content: space-between;
      align-items: flex-start;
      gap: 12px;
      margin-bottom: 12px;
      flex-wrap: wrap;
    }

    .meeting-title {
      display: flex;
      flex-direction: column;
      gap: 5px;
    }

    .meeting-title strong {
      font-size: 18px;
      letter-spacing: -0.02em;
    }

    .meeting-meta {
      color:#c1c8d2;
      font-size: 13px;
    }

    .badge-row {
      display: flex;
      gap: 8px;
      flex-wrap: wrap;
    }

    .badge {
      padding: 8px 11px;
      border-radius: 999px;
      font-size: 12px;
      font-weight: 800;
      white-space: nowrap;
    }

    .status-planned { background:#282d35; color:#f1f3f6; }
    .status-done { background:#234237; color:#f1f3f6; }
    .status-followup { background:#282d35; color:#f1f3f6; }

    .meeting-grid {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 10px;
      margin-bottom: 12px;
    }

    .info-box {
      background:#282d35;
      border:1px solid var(--work-line);
      border-radius: 16px;
      padding: 12px;
      min-height: 112px;
    }

    .info-box .k {
      color:#f1f3f6;
      font-size: 12px;
      margin-bottom: 8px;
      font-weight: 700;
    }

    .info-box .v {
      font-size: 14px;
      line-height: 1.5;
      white-space: pre-wrap;
      word-break: break-word;
    }

    .meeting-footer {
      display: flex;
      justify-content: space-between;
      gap: 12px;
      align-items: center;
      flex-wrap: wrap;
    }

    .next-date {
      color:#f1f3f6;
      font-size: 13px;
    }

    .meeting-actions {
      display: flex;
      gap: 8px;
    }

    .icon-btn {
      border:1px solid var(--work-line);
      background:#282d35;
      color:#f1f3f6;
      padding: 10px 12px;
      border-radius: 12px;
      cursor: pointer;
      font-weight: 700;
    }

    .empty {
      border:1px dashed var(--work-line);
      border-radius: 24px;
      padding: 34px 18px;
      text-align: center;
      color:#f1f3f6;
      background:#282d35;
    }

    .footer {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 10px;
      flex-wrap: wrap;
      margin-top: 14px;
      color:#f1f3f6;
      font-size: 12px;
    }

    @media (max-width: 1180px) {
      .hero,
      .layout,
      .meeting-grid {
        grid-template-columns: 1fr;
      }
      .hero-stats {
        grid-template-columns: repeat(3, 1fr);
      }
    }

    @media (max-width: 880px) {
      .field-grid,
      .form-actions,
      .filters,
      .hero-stats {
        grid-template-columns: 1fr;
      }
      .meeting-footer,
      .meeting-top {
        align-items: stretch;
      }
      .meeting-actions {
        width: 100%;
      }
      .icon-btn,
      .btn,
      .lang-btn {
        width: 100%;
      }
      .lang-switch,
      .top-actions {
        width: 100%;
      }
    }


    /* v11: status/action/complete and unique-manager summary removed from manager meeting register */
    .hero-stats .mini-stat:nth-child(n+2){display:none!important;}
    .hero-stats{grid-template-columns:1fr!important;}
    .badge-row{display:none!important;}

</style><script>(()=>{
  const targets='button,a[download],h2,.section-title,.search-icon,.compositionMetricIcon,.calendar-glyph,.notice-icon,.heading-icon,.sow-elapsed-icon,.disclaimer-icon,.incIcon';
  const rules=[
    ['copy',/copy|kopiuj|kopieer|clipboard/],['print',/print|druk|afdruk/],
    ['download',/download|pobierz|export|eksport|pdf|xlsx|excelbestand/],
    ['save',/save|zapisz|opslaan/],['remove',/delete|remove|verwijder|usuń|usun/],
    ['reset',/reset|clear|wyczyść|wis alles|opnieuw/],['search',/search|zoek|szukaj|wyszuk|find procedure/],
    ['calendar',/calendar|kalendar|datum|dates|days|dagen|dni kalendarz/],
    ['edit',/edit|bewerk|edyt/],['add',/^(add|dodaj|nieuw|toevoegen)|addrow|newproject/],
    ['settings',/setting|ustawien|instelling/],['info',/help|info|pomoc|disclaimer/],
    ['calculator',/calcul|bereken|oblicz|budget|budżet|rate|stawka|tarief|result|wynik/],
    ['check',/confirm|submit|akcept|potwierd|bevestig/],['folder',/project|projekt|dossier/]
  ];
  const named={ 'calendar-glyph':'calendar','sow-elapsed-icon':'calendar','search-icon':'search',
    'notice-icon':'info','disclaimer-icon':'info','incIcon':'calculator','heading-icon':'calculator' };
  const glyphs={'↺':'reset','⎙':'print','▣':'copy','📅':'calendar','✓':'check','✔':'check','→':'forward','➜':'forward','➕':'add','⚠️':'info'};
  function decorate(el){
    if(!el.matches(targets)||el.closest('[contenteditable=true]'))return;
    const text=el.textContent.trim(), key=[el.id,el.title,el.getAttribute('aria-label'),text].filter(Boolean).join(' ').toLowerCase();
    const name=Object.keys(named).find(k=>el.classList.contains(k));
    let icon=name?named[name]:null;
    if(el.matches('button[onclick^=setYear]'))icon='calendar';
    if(el.matches('.search-button'))icon='search';
    if(!icon && el.matches('h2,.section-title'))icon=rules.find(([,r])=>r.test(key))?.[0]||'folder';
    if(!icon && el.matches('button,a[download]'))icon=glyphs[text]||(el.hasAttribute('download')?'download':rules.find(([,r])=>r.test(key))?.[0]);
    if(!icon)return;
    if(!name && (el.querySelector(Object.keys(named).map(k=>'.'+k).join(','))||el.querySelector('.work-art')))return;
    if(name||glyphs[text]||(!text&&el.querySelector('svg')))el.setAttribute('data-rw-symbol-only','');
    el.setAttribute('data-rw-symbol',icon);
  }
  function scan(root){if(root.nodeType!==1)return;decorate(root);root.querySelectorAll(targets).forEach(decorate)}
  function start(){
    scan(document.body);
    new MutationObserver(records=>{
      for(const record of records){
        if(record.target.nodeType===1 && record.target.matches(targets))decorate(record.target);
        for(const node of record.addedNodes)scan(node);
      }
    }).observe(document.body,{childList:true,subtree:true});
  }
  if(document.readyState==='loading')document.addEventListener('DOMContentLoaded',start,{once:true});else start();
})();
</script></head>
<body>
  <div class="shell">
    <div class="topbar">
      <div class="brand">
        <div class="logo">R</div>
        <div>
          <h1 id="appTitle">Rejestr spotkań z managerami</h1>
          <p id="appSubtitle">Wszystkie najważniejsze ustalenia w jednym miejscu</p>
        </div>
      </div>

      <div class="top-actions">
        <div class="lang-switch">
          <button class="lang-btn active" data-lang="pl">PL</button>
          <button class="lang-btn" data-lang="nl">NL</button>
          <button class="lang-btn" data-lang="en">EN</button>
        </div>
        <button class="btn primary" id="exportBtn"></button>
      </div>
    </div>

    <section class="hero">
      <div class="panel hero-main"><span class="work-art" aria-hidden="true"></span>
        <h2 id="heroTitle"></h2>
        <p id="heroText"></p>
      </div>

      <div class="panel hero-stats">
        <div class="mini-stat">
          <div class="label" id="statAllLabel"></div>
          <div class="number" id="statAll">0</div>
        </div>
      </div>
    </section>

    <section class="layout">
      <div class="panel panel-inner">
        <div class="section-head">
          <div>
            <h3 id="formTitle"></h3>
            <div class="section-note" id="formNote"></div>
          </div>
        </div>

        <form id="meetingForm">
          <input type="hidden" id="meetingId" />

          <div class="field-grid">
            <div class="field">
              <label id="labelDate" for="meetingDate"></label>
              <input type="date" id="meetingDate" required />
            </div>
          </div>

          <div class="field">
            <label id="labelManager" for="managerName"></label>
            <input type="text" id="managerName" required />
          </div>

          <div class="field">
            <label id="labelSubject" for="meetingSubject"></label>
            <input type="text" id="meetingSubject" required />
          </div>

          <div class="field">
            <label id="labelDiscussed" for="meetingDiscussed"></label>
            <textarea id="meetingDiscussed" required></textarea>
          </div>

          <div class="field">
            <label id="labelAgreed" for="meetingAgreed"></label>
            <textarea id="meetingAgreed"></textarea>
          </div>

          <div class="field">
            <label id="labelNextSteps" for="meetingNextSteps"></label>
            <textarea id="meetingNextSteps"></textarea>
          </div>

          <div class="field">
            <label id="labelNextMeeting" for="meetingNextDate"></label>
            <input type="date" id="meetingNextDate" />
          </div>

          <div class="form-actions">
            <button type="submit" class="btn primary" id="saveBtn"></button>
            <button type="button" class="btn soft" id="clearBtn"></button>
          </div>
        </form>
      </div>

      <div class="panel panel-inner">
        <div class="section-head">
          <div>
            <h3 id="listTitle"></h3>
            <div class="section-note" id="listNote"></div>
          </div>
        </div>

        <div class="filters">
          <input type="text" id="searchInput" />
          <button class="btn soft" id="resetFiltersBtn" type="button"></button>
        </div>

        <div class="meeting-list" id="meetingList"></div>

        <div class="footer">
          <span id="footerText"></span>
          <span>© Rafal Wilk</span>
        </div>
      </div>
    </section>
  </div>

    function todayLocalIso() {
      const now = new Date();
      const year = now.getFullYear();
      const month = String(now.getMonth() + 1).padStart(2, '0');
      const day = String(now.getDate()).padStart(2, '0');
      return `${year}-${month}-${day}`;
    }

    function setDefaultDate(forceTodayForNewMeeting = false) {
      if (forceTodayForNewMeeting && !els.id.value) {
        els.date.value = todayLocalIso();
        persistDraft();
        return;
      }
      if (!els.date.value) {
        els.date.value = todayLocalIso();
      }
    }

    function bindEvents() {
      document.querySelectorAll('.lang-btn').forEach(btn => {
        btn.addEventListener('click', () => {
          applyPlatformLanguage(btn.dataset.lang);
          notifyParentLanguage(currentLang);
        });
      });

      els.form.addEventListener('submit', handleSubmit);
      document.getElementById('clearBtn').addEventListener('click', resetForm);
      document.getElementById('exportBtn').addEventListener('click', () => exportExcel(true));
      document.getElementById('resetFiltersBtn').addEventListener('click', resetFilters);
      els.searchInput.addEventListener('input', renderMeetings);
      if (els.filterStatus) els.filterStatus.addEventListener('change', renderMeetings);

      els.form.querySelectorAll('input, textarea, select').forEach(field => {
        field.addEventListener('input', persistDraft);
        field.addEventListener('change', persistDraft);
      });

      window.addEventListener('beforeunload', persistDraft);
      document.addEventListener('visibilitychange', () => {
        if (document.visibilityState === 'hidden') persistDraft();
      });
    }

      document.querySelectorAll('.lang-btn').forEach(btn => {

      document.documentElement.setAttribute('lang', currentLang);
      document.body.dataset.lang = currentLang;

    function readData() {
      try {
        const primary = localStorage.getItem(STORE_KEY);
        if (primary) return JSON.parse(primary) || [];
      } catch {}
      try {
        const backup = localStorage.getItem(BACKUP_KEY);
        if (backup) return JSON.parse(backup) || [];
      } catch {}
      return [];
    }

    function saveData() {
      const payload = JSON.stringify(meetings);
      localStorage.setItem(STORE_KEY, payload);
      localStorage.setItem(BACKUP_KEY, payload);
    }

    function getDraft() {
      return {
        id: els.id.value || '',
        date: els.date.value || '',
        status: 'planned',
        manager: els.manager.value || '',
        subject: els.subject.value || '',
        discussed: els.discussed.value || '',
        agreed: els.agreed.value || '',
        nextSteps: els.nextSteps.value || '',
        nextDate: els.nextDate.value || ''
      };
    }

    function persistDraft() {
      try {
        localStorage.setItem(DRAFT_KEY, JSON.stringify(getDraft()));
      } catch {}
    }

    function restoreDraft() {
      try {
        const raw = localStorage.getItem(DRAFT_KEY);
        if (!raw) return;
        const draft = JSON.parse(raw);
        els.id.value = draft.id || '';
        els.date.value = draft.date || '';
        if (els.status) els.status.value = 'planned';
        els.manager.value = draft.manager || '';
        els.subject.value = draft.subject || '';
        els.discussed.value = draft.discussed || '';
        els.agreed.value = draft.agreed || '';
        els.nextSteps.value = draft.nextSteps || '';
        els.nextDate.value = draft.nextDate || '';
      } catch {}
      setDefaultDate();
    }

    function clearDraft() {
      localStorage.removeItem(DRAFT_KEY);
    }

    function makeId() {
      return Date.now().toString(36) + Math.random().toString(36).slice(2, 8);
    }

    async function handleSubmit(e) {
      e.preventDefault();

      const item = {
        id: els.id.value || makeId(),
        date: els.date.value,
        status: els.status.value,
        manager: els.manager.value.trim(),
        subject: els.subject.value.trim(),
        discussed: els.discussed.value.trim(),
        agreed: els.agreed.value.trim(),
        nextSteps: els.nextSteps.value.trim(),
        nextDate: els.nextDate.value,
        createdAt: new Date().toISOString(),
        updatedAt: new Date().toISOString()
      };

      if (!item.date || !item.manager || !item.subject || !item.discussed) {
        alert(t('required'));
        return;
      }

      const existingIndex = meetings.findIndex(m => m.id === item.id);

      if (existingIndex >= 0) {
        item.createdAt = meetings[existingIndex].createdAt;
        meetings[existingIndex] = item;
      } else {
        meetings.unshift(item);
      }

      saveData();
      renderAll();

      const saveResult = await saveWorkbookToDisk(false);

      if (saveResult.status === 'cancelled') {
        alert(t('saveCancelled'));
      } else if (saveResult.status === 'error') {
        alert(t('saveError'));
      } else if (saveResult.status === 'local-only') {
        alert(t('savedLocallyOnly'));
      }

      els.id.value = item.id;
      persistDraft();
      renderAll();
    }

    function resetForm() {
      els.form.reset();

    function resetFilters() {

    function filteredMeetings() {
      const query = els.searchInput.value.trim().toLowerCase();
      const filter = 'all';

      return [...meetings]
        .filter(item => {
          const matchQuery = !query || [item.manager, item.subject, item.discussed, item.agreed, item.nextSteps]
            .join(' ')
            .toLowerCase()
            .includes(query);
          return matchQuery;
        })
        .sort((a, b) => new Date(b.date) - new Date(a.date));
    }

    function allMeetingsSorted() {
      return [...meetings].sort((a, b) => new Date(b.date) - new Date(a.date));
    }

    function escapeHtml(str = '') {
      return String(str)
        .replace(/&/g, '&amp;')
        .replace(/</g, '&lt;')
        .replace(/>/g, '&gt;')
        .replace(/"/g, '&quot;')
        .replace(/'/g, '&#039;');
    }

    function safeSheetName(value) {
      return String(value || 'Sheet').replace(/[\/?*\[\]:]/g, ' ').trim().slice(0, 31) || 'Sheet';
    }

    function pad2(value) {
      return String(value).padStart(2, '0');
    }

    function parseTrackerDate(value) {
      if (!value) return null;
      const [year, month, day] = String(value).split('-').map(Number);
      if (!year || !month || !day) return null;
      return new Date(year, month - 1, day);
    }

    function toIsoDate(date) {
      return `${date.getFullYear()}-${pad2(date.getMonth() + 1)}-${pad2(date.getDate())}`;
    }

    function startOfIsoWeek(date) {
      const d = new Date(date.getFullYear(), date.getMonth(), date.getDate());
      const day = d.getDay() || 7;
      if (day !== 1) d.setDate(d.getDate() - day + 1);
      d.setHours(0, 0, 0, 0);
      return d;
    }

    function getIsoWeekInfo(date) {
      const temp = new Date(Date.UTC(date.getFullYear(), date.getMonth(), date.getDate()));
      const dayNum = temp.getUTCDay() || 7;
      temp.setUTCDate(temp.getUTCDate() + 4 - dayNum);
      const yearStart = new Date(Date.UTC(temp.getUTCFullYear(), 0, 1));
      const week = Math.ceil((((temp - yearStart) / 86400000) + 1) / 7);
      return {
        year: temp.getUTCFullYear(),
        week,
        monday: startOfIsoWeek(date)
      };
    }

    function formatWeekLabel(info) {
      return `${t('reportWeekLabelPrefix')} ${info.week} · ${info.year}`;
    }

    function formatMonthLabel(date) {
      return new Intl.DateTimeFormat(currentLang, { month: 'short', year: 'numeric' }).format(date);
    }

    function addPeriodCount(map, key, factory, status) {
      if (!map.has(key)) map.set(key, factory());
      const bucket = map.get(key);
      bucket.count += 1;
      bucket.completed = bucket.completed || 0;
      bucket.planned = bucket.planned || 0;
      bucket.followup = bucket.followup || 0;
      bucket.open = bucket.open || 0;
      if (status === 'done') bucket.completed += 1;
      else if (status === 'followup') bucket.followup += 1;
      else {
        bucket.planned += 1;
        bucket.open += 1;
      }
    }

    function buildMeetingSummaries(sourceMeetings) {
      const weeklyMap = new Map();
      const monthlyMap = new Map();
      const quarterlyMap = new Map();
      const yearlyMap = new Map();
      const statusMap = new Map();
      const totals = { all: 0, completed: 0, planned: 0, followup: 0, open: 0 };

      (sourceMeetings || []).forEach(item => {
        const date = parseTrackerDate(item.date);
        if (!date) return;
        const status = statusOptions.includes(item.status) ? item.status : 'planned';
        totals.all += 1;
        if (status === 'done') totals.completed += 1;
        else if (status === 'followup') { totals.followup += 1; totals.open += 1; }
        else { totals.planned += 1; totals.open += 1; }

        statusMap.set(status, (statusMap.get(status) || 0) + 1);

        const weekInfo = getIsoWeekInfo(date);
        addPeriodCount(weeklyMap, `${weekInfo.year}-W${pad2(weekInfo.week)}`, () => ({
          label: formatWeekLabel(weekInfo),
          periodStart: toIsoDate(weekInfo.monday),
          count: 0
        }), status);

        const monthKey = `${date.getFullYear()}-${pad2(date.getMonth() + 1)}`;
        addPeriodCount(monthlyMap, monthKey, () => ({
          label: formatMonthLabel(date),
          periodStart: `${monthKey}-01`,
          count: 0
        }), status);

        const quarter = Math.floor(date.getMonth() / 3) + 1;
        addPeriodCount(quarterlyMap, `${date.getFullYear()}-Q${quarter}`, () => ({
          label: `Q${quarter} ${date.getFullYear()}`,

    function loadExternalScript(srcUrl) {
      return new Promise((resolve, reject) => {
        const existing = Array.from(document.scripts).find(script => script.src === srcUrl);
        if (existing) {
          if (existing.dataset.loaded === 'true') resolve();
          existing.addEventListener('load', () => resolve(), { once: true });
          existing.addEventListener('error', () => reject(new Error('Script failed: ' + srcUrl)), { once: true });
          return;
        }
        const script = document.createElement('script');
        script.src = srcUrl;
        script.async = true;
        script.dataset.dynamicLoader = 'true';
        script.onload = () => { script.dataset.loaded = 'true'; resolve(); };
        script.onerror = () => reject(new Error('Script failed: ' + srcUrl));
        document.head.appendChild(script);
      });
    }

        function xmlEscape(value) {
      return String(value == null ? '' : value)
        .replace(/&/g, '&amp;')
        .replace(/</g, '&lt;')
        .replace(/>/g, '&gt;')
        .replace(/"/g, '&quot;')
        .replace(/'/g, '&apos;');
    }

    function xmlSheetName(value) {
      return xmlEscape(String(value || 'Sheet').replace(/[\\/*?:\[\]]/g, ' ').slice(0, 31));
    }

    function xmlCell(value, style = 'Text', mergeAcross = 0, type = null) {
      const numeric = typeof value === 'number' && Number.isFinite(value);
      const cellType = type || (numeric ? 'Number' : 'String');
      const merge = mergeAcross ? ` ss:MergeAcross="${mergeAcross}"` : '';
      return `<Cell ss:StyleID="${style}"${merge}><Data ss:Type="${cellType}">${xmlEscape(value)}</Data></Cell>`;
    }

    function xmlEmptyCell(style = 'Text') {
      return `<Cell ss:StyleID="${style}"/>`;
    }

    function xmlRow(cells, height = null) {
      const h = height ? ` ss:AutoFitHeight="0" ss:Height="${height}"` : '';
      return `<Row${h}>${cells.join('')}</Row>`;
    }

    function xmlWorksheet(name, rows, columns = []) {
      const colXml = columns.map(width => `<Column ss:Width="${width}"/>`).join('');
      return `<Worksheet ss:Name="${xmlSheetName(name)}"><Table>${colXml}${rows.join('')}</Table><WorksheetOptions xmlns="urn:schemas-microsoft-com:office:excel"><FreezePanes/><FrozenNoSplit/><SplitHorizontal>4</SplitHorizontal><TopRowBottomPane>4</TopRowBottomPane><ActivePane>2</ActivePane><Panes><Pane><Number>3</Number></Pane><Pane><Number>2</Number></Pane></Panes><ProtectObjects>False</ProtectObjects><ProtectScenarios>False</ProtectScenarios></WorksheetOptions></Worksheet>`;

    function chartBlock(title, items, colorStyle = 'ChartGreen') {
      const cleanItems = (items || []).slice(-12).filter(item => item && item.label);
      const rows = [];
      rows.push(xmlRow([xmlCell(title, 'Section', Math.max(4, cleanItems.length * 3 - 1))], 24));
      if (!cleanItems.length) {
        rows.push(xmlRow([xmlCell('-', 'Text')], 20));
        return rows;
      }
      const max = Math.max(1, ...cleanItems.flatMap(item => [Number(item.count) || 0, Number(item.completed) || 0, Number(item.followup) || 0]));
      const chartHeight = 10;
      const labelCells = [xmlEmptyCell('Text')];
      cleanItems.forEach(item => {
        labelCells.push(xmlCell(item.label, 'ChartLabel', 2));
      });
      rows.push(xmlRow(labelCells, 24));
      for (let level = chartHeight; level >= 1; level -= 1) {
        const valueLabel = Math.ceil((max / chartHeight) * level);
        const cells = [xmlCell(valueLabel, 'Axis')];
        cleanItems.forEach(item => {
          const totalH = Math.round(((Number(item.count) || 0) / max) * chartHeight);
          const doneH = Math.round(((Number(item.completed) || 0) / max) * chartHeight);
          const followH = Math.round(((Number(item.followup) || 0) / max) * chartHeight);
          cells.push(level <= totalH ? xmlCell('', colorStyle) : xmlEmptyCell('ChartBlank'));
          cells.push(level <= doneH ? xmlCell('', 'ChartBlue') : xmlEmptyCell('ChartBlank'));
          cells.push(level <= followH ? xmlCell('', 'ChartRed') : xmlEmptyCell('ChartBlank'));
        });
        rows.push(xmlRow(cells, 16));
      }
      const legend = [xmlCell('', 'Text'), xmlCell('', colorStyle), xmlCell(t('reportTotalMeetings'), 'Legend')];
      rows.push(xmlRow(legend, 20));
      rows.push(xmlRow([xmlCell('', 'Text')], 12));
      return rows;
    }

    function makePeriodRows(sourceMeetings, mode) {
      const map = new Map();
      sourceMeetings.forEach(item => {
        const date = parseTrackerDate(item.date);
        if (!date) return;
        let key = '', label = '', start = '';
        if (mode === 'week') {
          const info = getIsoWeekInfo(date);
          key = `${info.year}-W${pad2(info.week)}`;
          label = formatWeekLabel(info);
          start = toIsoDate(info.monday);
        } else if (mode === 'month') {
          key = `${date.getFullYear()}-${pad2(date.getMonth() + 1)}`;
          label = formatMonthLabel(date);
          start = `${key}-01`;
        } else if (mode === 'quarter') {
          const q = Math.floor(date.getMonth() / 3) + 1;
          key = `${date.getFullYear()}-Q${q}`;
          label = `Q${q} ${date.getFullYear()}`;
          start = `${date.getFullYear()}-${pad2((q - 1) * 3 + 1)}-01`;
        } else {
          key = String(date.getFullYear());
          label = key;
          start = `${key}-01-01`;
        }
        if (!map.has(key)) map.set(key, { label, count: 0, start });

      const generatedAt = new Intl.DateTimeFormat(currentLang, { dateStyle: 'medium', timeStyle: 'short' }).format(new Date()); const weekly = makePeriodRows(sourceMeetings, 'week'); const monthly = makePeriodRows(sourceMeetings, 'month'); const quarterly = makePeriodRows(sourceMeetings, 'quarter'); const yearly = makePeriodRows(sourceMeetings, 'year'); const colors = { green: '22C55E', olive: '6A8F3A', orange: 'F28C28', lime: '84CC16' };
      const dashboard = workbook.addWorksheet(t('reportDashboardSheet') || 'Dashboard', { views: [{ state: 'frozen', ySplit: 2 }] }); dashboard.columns = [{ width: 24 }, { width: 14 }, { width: 6 }, { width: 6 }, { width: 6 }, { width: 6 }, { width: 6 }, { width: 6 }]; dashboard.mergeCells('A1:H1'); applyTitleCell(dashboard.getCell('A1'), colors.olive); dashboard.getCell('A1').value = t('reportTitle') || 'Manager meetings report'; dashboard.getRow(1).height = 32; dashboard.getCell('A2').value = t('reportGenerated') || 'Generated'; dashboard.getCell('B2').value = generatedAt; dashboard.getCell('A4').value = t('reportTotalMeetings') || 'Total meetings'; dashboard.getCell('B4').value = sourceMeetings.length; dashboard.getCell('A4').font = { bold: true, size: 13, color: { argb: 'FF172033' } }; dashboard.getCell('B4').font = { bold: true, size: 20, color: { argb: 'FFFFFFFF' } }; dashboard.getCell('B4').fill = { type: 'pattern', pattern: 'solid', fgColor: { argb: 'FF22C55E' } }; dashboard.getCell('B4').alignment = { horizontal: 'center', vertical: 'middle' }; dashboard.getRow(4).height = 30;
      let row = 7; row = addPeriodBlock(dashboard, t('reportChartWeekly') || 'Meetings per week', t('reportWeek') || 'Week', weekly, row, colors.green); row = addPeriodBlock(dashboard, t('reportChartMonthly') || 'Meetings per month', t('reportMonth') || 'Month', monthly, row, colors.orange); row = addPeriodBlock(dashboard, t('reportChartQuarterly') || 'Meetings per quarter', t('reportQuarter') || 'Quarter', quarterly, row, colors.olive); row = addPeriodBlock(dashboard, t('reportChartYearly') || 'Meetings per year', t('reportYear') || 'Year', yearly, row, colors.lime);
      function addPeriodSheet(sheetName, title, labelTitle, data, color) { const ws = workbook.addWorksheet(safeSheetName(sheetName)); ws.columns = [{ width: 28 }, { width: 16 }, { width: 12 }, { width: 12 }, { width: 12 }, { width: 12 }, { width: 12 }, { width: 12 }]; ws.mergeCells('A1:H1'); applyTitleCell(ws.getCell('A1'), color); ws.getCell('A1').value = title; ws.getCell('A2').value = t('reportGenerated') || 'Generated'; ws.getCell('B2').value = generatedAt; addPeriodBlock(ws, title, labelTitle, data, 4, color); }
      addPeriodSheet(t('reportWeeklySheet') || 'Weekly', t('reportChartWeekly') || 'Meetings per week', t('reportWeek') || 'Week', weekly, colors.green); addPeriodSheet(t('reportMonthlySheet') || 'Monthly', t('reportChartMonthly') || 'Meetings per month', t('reportMonth') || 'Month', monthly, colors.orange); addPeriodSheet(t('reportQuarterlySheet') || 'Quarterly', t('reportChartQuarterly') || 'Meetings per quarter', t('reportQuarter') || 'Quarter', quarterly, colors.olive); addPeriodSheet(t('reportYearlySheet') || 'Yearly', t('reportChartYearly') || 'Meetings per year', t('reportYear') || 'Year', yearly, colors.lime);
      const meetingRows = getCleanMeetingRows(sourceMeetings); const headers = meetingRows.length ? Object.keys(meetingRows[0]) : ['#', t('labelDate'), t('labelManager'), t('labelSubject'), t('labelDiscussed'), t('labelAgreed'), t('labelNextSteps'), t('labelNextMeeting')]; const ws = workbook.addWorksheet(t('exportSheet') || 'Meetings', { views: [{ state: 'frozen', ySplit: 4 }] }); ws.columns = [{ width: 6 }, { width: 15 }, { width: 24 }, { width: 30 }, { width: 54 }, { width: 42 }, { width: 42 }, { width: 18 }]; ws.mergeCells('A1:H1'); applyTitleCell(ws.getCell('A1'), colors.olive); ws.getCell('A1').value = t('exportSheet') || 'Meetings'; ws.getCell('A2').value = t('reportGenerated') || 'Generated'; ws.getCell('B2').value = generatedAt; const hr = ws.getRow(4); headers.forEach((h, idx) => { const cell = hr.getCell(idx + 1); cell.value = h; applyHeaderCell(cell, colors.orange); }); meetingRows.forEach((obj, rIdx) => { const er = ws.getRow(5 + rIdx); er.height = 60; headers.forEach((h, cIdx) => { const cell = er.getCell(cIdx + 1); cell.value = obj[h] == null ? '' : obj[h]; applyBodyCell(cell, rIdx % 2 === 1); if (cIdx === 0 || cIdx === 1) cell.alignment = { horizontal: 'center', vertical: 'top', wrapText: true }; }); }); ws.autoFilter = { from: 'A4', to: 'H4' }; return workbook;
    }
    function saveBufferAsFile(buffer, fileName) { const blob = new Blob([buffer], { type: 'application/vnd.openxmlformats-officedocument.spreadsheetml.sheet' }); const url = URL.createObjectURL(blob); const a = document.createElement('a'); a.href = url; a.download = fileName; document.body.appendChild(a); a.click(); setTimeout(() => { URL.revokeObjectURL(url); a.remove(); }, 1000); }
    async function exportExcel(forceChooseLocation = false) {
      try { const sourceMeetings = allMeetingsSorted(); if (!sourceMeetings.length) { alert(t('emptyState') || 'No meetings to export.'); return; } const workbook = await createCleanCorporateWorkbook(sourceMeetings); const buffer = await workbook.xlsx.writeBuffer(); const fileName = `${t('exportFile')}_EXCEL_${new Date().toISOString().slice(0, 10)}.xlsx`; saveBufferAsFile(buffer, fileName); }
      catch (error) { console.error('ExcelJS export failed. Trying simple SheetJS fallback.', error); try { await ensureXlsxReady(); const sourceMeetings = allMeetingsSorted(); const rows = getCleanMeetingRows(sourceMeetings); const wb = XLSX.utils.book_new(); const generatedAt = new Intl.DateTimeFormat(currentLang, { dateStyle: 'medium', timeStyle: 'short' }).format(new Date()); XLSX.utils.book_append_sheet(wb, XLSX.utils.aoa_to_sheet([[t('reportTitle') || 'Report'], [t('reportGenerated') || 'Generated', generatedAt], [], [t('reportTotalMeetings') || 'Total meetings', sourceMeetings.length]]), safeSheetName(t('reportDashboardSheet') || 'Dashboard')); XLSX.utils.book_append_sheet(wb, XLSX.utils.json_to_sheet(rows), safeSheetName(t('exportSheet') || 'Meetings')); XLSX.writeFile(wb, `${t('exportFile')}_EXCEL_${new Date().toISOString().slice(0, 10)}.xlsx`, { bookType: 'xlsx', compression: false }); } catch (fallbackError) { console.error('Excel export failed.', fallbackError); alert(currentLang === 'pl' ? 'Nie udało się wygenerować pliku Excel.' : currentLang === 'nl' ? 'Het Excel-bestand kon niet worden gemaakt.' : 'The Excel file could not be created.'); } }
    }

    async function saveWorkbookToDisk(forceChooseLocation = false, workbook = null) {
      try {
        await ensureXlsxReady();
        const wb = workbook || createStableXlsxWorkbook();
        if (!wb) return { status: 'empty' };
        if (!window.showSaveFilePicker) return { status: 'local-only' };
        const handle = await ensureWritableFileHandle(forceChooseLocation);
        if (!handle) return { status: 'cancelled' };
        const output = XLSX.write(wb, { bookType: 'xlsx', type: 'array', compression: true });
        const blob = new Blob([output], { type: 'application/vnd.openxmlformats-officedocument.spreadsheetml.sheet' });
        const writable = await handle.createWritable();
        await writable.write(blob);
        await writable.close();
        return { status: 'saved' };
      } catch (error) {
        console.error(error);
        return { status: error && error.name === 'AbortError' ? 'cancelled' : 'error' };
      }
    }

    async function ensureWritableFileHandle(forceChooseLocation = false) {
      if (!window.showSaveFilePicker) return null;

      if (!forceChooseLocation && !excelFileHandle) {
        excelFileHandle = await loadStoredFileHandle();
      }

      if (!forceChooseLocation && excelFileHandle) {
        const hasPermission = await verifyPermission(excelFileHandle, true);
        if (hasPermission) return excelFileHandle;
      }

      const suggestedName = `${t('exportFile')}.xlsx`;
      const pickedHandle = await window.showSaveFilePicker({
        suggestedName,
        types: [{
          description: t('chooseLocation'),
          accept: {
            'application/vnd.openxmlformats-officedocument.spreadsheetml.sheet': ['.xlsx']
          }
        }]
      });

      const granted = await verifyPermission(pickedHandle, true);
      if (!granted) return null;

      excelFileHandle = pickedHandle;
      await saveFileHandleToDb(pickedHandle);
      return excelFileHandle;
    }

    async function verifyPermission(handle, readWrite = false) {
      if (!handle) return false;
      const options = readWrite ? { mode: 'readwrite' } : {};
      if ((await handle.queryPermission(options)) === 'granted') return true;
      if ((await handle.requestPermission(options)) === 'granted') return true;
      return false;
    }

    function openHandleDb() {
      return new Promise((resolve, reject) => {
        if (!window.indexedDB) {
          resolve(null);
          return;
        }

        const request = indexedDB.open(FILE_DB_NAME, 1);

        request.onupgradeneeded = () => {
          const db = request.result;
          if (!db.objectStoreNames.contains(FILE_DB_STORE)) {
            db.createObjectStore(FILE_DB_STORE);
          }
        };

        request.onsuccess = () => resolve(request.result);
        request.onerror = () => reject(request.error);
      });
    }

    async function saveFileHandleToDb(handle) {
      try {
        const db = await openHandleDb();
        if (!db) return;
        await new Promise((resolve, reject) => {
          const tx = db.transaction(FILE_DB_STORE, 'readwrite');
          tx.objectStore(FILE_DB_STORE).put(handle, FILE_DB_KEY);
          tx.oncomplete = () => resolve();
          tx.onerror = () => reject(tx.error);
        });
        db.close();
      } catch (error) {
        console.error(error);
      }
    }

    async function loadStoredFileHandle() {
      try {
        const db = await openHandleDb();
        if (!db) return null;
        const handle = await new Promise((resolve, reject) => {
          const tx = db.transaction(FILE_DB_STORE, 'readonly');
          const request = tx.objectStore(FILE_DB_STORE).get(FILE_DB_KEY);
          request.onsuccess = () => resolve(request.result || null);
          request.onerror = () => reject(request.error);
        });
        db.close();
        return handle;
      } catch (error) {
        console.error(error);
        return null;
      }
    }

    function applyPlatformLanguage(lang) {
      const normalized = ['pl', 'en', 'nl'].includes(String(lang || '').toLowerCase().slice(0, 2))
        ? String(lang).toLowerCase().slice(0, 2)
        : 'pl';
      currentLang = normalized;
      localStorage.setItem(LANG_KEY, currentLang);
      localStorage.setItem('rw_lang', currentLang);
      localStorage.setItem('doc_lang', currentLang);
      localStorage.setItem('supplier_lang', currentLang);
      updateLanguageButtons();
      renderAll();
    }

    function notifyParentLanguage(lang) {
      try {
        if (window.parent && window.parent !== window) {
          window.parent.postMessage({ type: 'rw:setLang', lang }, '*');
        }
      } catch (error) {}
    }

    window.__rwApplyModuleLang = applyPlatformLanguage;
    window.addEventListener('message', event => {
      if (!event || !event.data) return;
      if (event.data.type === 'rw:setLang') applyPlatformLanguage(event.data.lang);
      if (event.data.type === 'rw:getLang' && event.source) {
        try { event.source.postMessage({ type:'rw:setLang', lang:currentLang }, '*'); } catch {}
      }
    });
    try {
      if (window.parent && window.parent !== window) window.parent.postMessage({ type:'rw:getLang' }, '*');
    } catch {}
  </script>
