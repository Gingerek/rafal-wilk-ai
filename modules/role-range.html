function copiedText(r){return [['code',r.code],['profile',r.profile],['group',r.group],['family',r.family],['level',r.level],...(r.variant?[['variantLabel',variantName(r.variant)]]:[]),['jobLevel',r.jobLevel],['payZone',r.payZone],['currency',r.currency],['iso',r.iso],['structure',r.scale],['minimum',amount(r.minimum)],['monthlyMinimum',conversionText(r,'minimum','month')],['hourlyMinimum',conversionText(r,'minimum','hour')],['mid',amount(r.mid)],['monthlyMid',conversionText(r,'mid','month')],['hourlyMid',conversionText(r,'mid','hour')],['maximum',amount(r.maximum)],['monthlyMaximum',conversionText(r,'maximum','month')],['hourlyMaximum',conversionText(r,'maximum','hour')]].map(([k,v])=>`${t(k)}: ${value(v)}`).join('\n');}
async function copyRecord(id,button){const r=engine.records.find(x=>x.id===id);if(!r)return;const text=copiedText(r);try{if(navigator.clipboard&&window.isSecureContext){await navigator.clipboard.writeText(text);toast(t('copied'));return;}}catch(_){}const old=button.closest('.detail-content').querySelector('textarea');if(old)old.remove();const area=document.createElement('textarea');area.className='copy-area';area.readOnly=true;area.value=text;area.setAttribute('aria-label',t('copy'));button.closest('.detail-content').appendChild(area);area.focus();area.select();let copied=false;try{copied=document.execCommand('copy');}catch(_){}if(copied){area.remove();button.focus();toast(t('copied'));}else toast(t('copyManual'));}
$('query').addEventListener('input',()=>{clearTimeout(inputTimer);inputTimer=setTimeout(searchChanged,90);});
$('query').addEventListener('keydown',e=>{if(e.key==='Enter'){e.preventDefault();searchChanged();}if(e.key==='Escape'){e.preventDefault();$('query').value='';searchChanged();}});
$('clearSearch').addEventListener('click',()=>{$('query').value='';searchChanged();$('query').focus();});
document.querySelectorAll('[data-query]').forEach(b=>b.addEventListener('click',()=>{state.group='';state.family='';state.level='';state.variant='';$('query').value=b.dataset.query;syncFilters();searchChanged();}));
$('filtersToggle').addEventListener('click',()=>{const open=$('filters').hidden;$('filters').hidden=!open;$('filtersToggle').setAttribute('aria-expanded',String(open));});
$('group').addEventListener('change',()=>{clearTimeout(inputTimer);state.query=$('query').value;state.group=$('group').value;if(state.family&&!engine.records.some(r=>r.group===state.group&&r.family===state.family))state.family='';state.limit=20;syncFilters();renderResults();});
for(const key of ['family'])$(key).addEventListener('change',()=>{clearTimeout(inputTimer);state.query=$('query').value;state[key]=$(key).value;state.limit=20;syncFilters();renderResults();});
$('classification').addEventListener('change',()=>chooseClassification($('classification').value));
$('levelShortcuts').addEventListener('click',e=>{const b=e.target.closest('[data-classification]');if(!b)return;const key=b.dataset.classification;chooseClassification(key);$('levelShortcuts').querySelector(`[data-classification="${key}"]`)?.focus({preventScroll:true});});
$('reset').addEventListener('click',reset);
$('more').addEventListener('click',()=>{const oldLimit=state.limit;state.limit+=20;renderResults();const firstNew=$('results').querySelectorAll('.row-details summary')[oldLimit];if(firstNew)firstNew.focus({preventScroll:true});});
$('results').addEventListener('click',e=>{const copy=e.target.closest('[data-copy]');if(copy){copyRecord(copy.dataset.copy,copy);return;}const b=e.target.closest('[data-family-row]');if(b){const r=engine.records.find(x=>x.id===b.dataset.familyRow);state.group=r.group;state.family=r.family;state.limit=20;$('filters').hidden=false;$('filtersToggle').setAttribute('aria-expanded','true');syncFilters();renderResults();$('query').focus({preventScroll:true});}});
$('languages').addEventListener('click',e=>{const b=e.target.closest('[data-lang]');if(!b)return;setLanguage(b.dataset.lang);if(window.parent!==window&&e.isTrusted)window.parent.postMessage({type:'rw:setLang',lang:b.dataset.lang},location.origin);});
window.addEventListener('message',e=>{if(window.parent!==window&&e.source===window.parent&&e.origin===location.origin&&e.data?.type==='rw:setLang')setLanguage(e.data.lang);});
setLanguage(language);
</script>
</body></html>
