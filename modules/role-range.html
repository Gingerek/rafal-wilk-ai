function suggest(query){if(!norm(query))return [];const matched=data.filter(r=>hasQuery(r,query));const found=[...new Set(matched.map(r=>r.group))];return found.map(group=>({group,scope:matched.filter(r=>r.group===group)})).sort((a,b)=>Number(norm(b.group)===norm(query))-Number(norm(a.group)===norm(query))||Number(norm(b.group).startsWith(norm(query)))-Number(norm(a.group).startsWith(norm(query)))||compare(a.group,b.group));}
function familyNames(group=state.group){return [...new Set(data.filter(r=>r.group===group).map(r=>r.family))].sort(compare);}
function allowedFamilies(){const all=familyNames();return state.scopeFamilies?all.filter(f=>state.scopeFamilies.includes(f)):all;}
function levelNames(){return [...new Set(data.filter(r=>r.group===state.group&&r.family===state.family).map(r=>r.level))].sort((a,b)=>prefixes.indexOf(a[0])-prefixes.indexOf(b[0])||compare(a,b));}
function results(){if(!state.group||!state.family||!state.level)return [];return data.filter(r=>r.group===state.group&&r.family===state.family&&r.level===state.level).sort((a,b)=>compare(a.profile,b.profile)||compare(a.code,b.code)||a.row-b.row);}
function formatAmount(value){if(value===null||value==='')return t('missing');return new Intl.NumberFormat({pl:'pl-PL',en:'en-GB',nl:'nl-NL'}[language],{maximumFractionDigits:10}).format(Number(value));}
function displayValue(value){return clean(value)||t('missing');}
function amountHtml(r,key){return `${r.currency==='EUR'?'<span class="money-symbol">€</span>':''}${esc(formatAmount(r[key]))}`;}
function closeSuggestions(){state.open=false;state.active=-1;$('suggestions').hidden=true;$('groupSearch').setAttribute('aria-expanded','false');$('groupSearch').removeAttribute('aria-activedescendant');}
function paintSuggestions(){if(!state.open){closeSuggestions();return;}const found=state.suggestions.slice(0,10);$('suggestions').innerHTML=found.length?found.map((s,i)=>{const families=[...new Set(s.scope.map(r=>r.family))];return `<button type="button" role="option" class="suggestion${i===state.active?' active':''}" id="suggestion-${i}" data-option="${i}" aria-selected="${i===state.active}"><strong>${esc(s.group)}</strong><small>${esc(families.length===1?families[0]:`${t('families')}: ${families.length}`)}</small></button>`;}).join('')+(state.suggestions.length>10?`<div class="message">${t('more')}</div>`:''):`<div class="message">${t('noMatches')}</div>`;$('suggestions').hidden=false;$('groupSearch').setAttribute('aria-expanded','true');if(state.active>=0)$('groupSearch').setAttribute('aria-activedescendant',`suggestion-${state.active}`);else $('groupSearch').removeAttribute('aria-activedescendant');}
function selectGroup(group,queryScope=null){state.group=group;state.query=group;state.family='';state.level='';state.scopeFamilies=queryScope;const families=allowedFamilies();if(families.length===1)state.family=families[0];if(state.family){const levels=levelNames();if(levels.length===1)state.level=levels[0];}$('groupSearch').value=group;closeSuggestions();render();}
function chooseSuggestion(i){const s=state.suggestions[i];if(!s)return;const exactGroup=norm(s.group).includes(norm(state.query));const scope=exactGroup?null:[...new Set(s.scope.map(r=>r.family))];selectGroup(s.group,scope);}
function inputChanged(){state.query=$('groupSearch').value;state.group='';state.family='';state.level='';state.scopeFamilies=null;state.active=-1;state.suggestions=suggest(state.query);const exact=groups.find(g=>norm(g)===norm(state.query));if(exact){selectGroup(exact);return;}state.open=!!norm(state.query);render();paintSuggestions();}
function renderFilters(){const options=allowedFamilies();$('family').replaceChildren(new Option(state.group?t('chooseFamily'):t('chooseGroup'),''));for(const value of options)$('family').add(new Option(value,value));$('family').disabled=!state.group;$('family').value=state.family;$('step2').classList.toggle('ready',!!state.group);$('step3').classList.toggle('ready',!!state.family);$('levels').innerHTML=state.family?levelNames().map(level=>`<button type="button" class="level-button${level===state.level?' selected':''}" data-level="${esc(level)}" aria-pressed="${level===state.level}">${esc(level)}</button>`).join(''):`<span class="level-placeholder">${t('levelDisabled')}</span>`;$('clearSearch').hidden=!state.query;$('reset').disabled=!state.query&&!state.group;$('selectionPath').innerHTML=state.family?`${esc(state.group)} <span aria-hidden="true">/</span> <strong>${esc(state.family)}</strong>`:state.group?esc(state.group):state.query?t('pick'):'';}
const detailKeys=['code','profile','group','family','level','jobLevel','payZone','currency','iso','structure','minimum','mid','maximum'];
function card(r,index,total){const fields=detailKeys.map(key=>[key,key==='structure'?r.scale:['minimum','mid','maximum'].includes(key)?formatAmount(r[key]):r[key]]);if(r.extra)fields.push(['extra',r.extra]);return `<article class="result-card" data-row="${r.row}"><div class="card-top"><div><div class="profile-label">${t('profile')}</div><h3>${esc(r.profile)}</h3><div class="job-meta"><span>${t('code')}: ${esc(r.code)}</span>${total>1?`<span>${t('payZone')}: ${esc(r.payZone)}</span><span>${t('row')} ${r.row}</span>`:''}</div></div><span class="pathway">${esc(r.level)}</span></div><div class="metrics"><div class="metric scale"><div class="metric-label" title="${t('structure')}">${t('scale')}</div><div class="metric-value" data-metric="scale">${esc(displayValue(r.scale))}</div>${r.extra?`<div class="adjusted">${t('extra')}: <strong>${esc(r.extra)}</strong></div>`:''}</div>${['minimum','mid','maximum'].map(key=>`<div class="metric ${key}"><div class="metric-label">${t(key)}</div><div class="metric-value" data-metric="${key}">${amountHtml(r,key)}</div>${r.currency!=='EUR'?`<div class="currency-label">${esc(r.currency||t('missing'))}</div>`:''}</div>`).join('')}</div><div class="card-bottom"><details class="details"><summary>${t('details')}</summary><dl class="detail-grid">${fields.map(([key,value])=>`<div><dt>${t(key==='level'?'levelFull':key)}</dt><dd>${esc(displayValue(value))}</dd></div>`).join('')}</dl><div class="details-note"><span>${t('source')}: ${esc(SOURCE.source)} · ${esc(SOURCE.sheet)} · ${t('row')} ${r.row}<br>${t('note')}<br>${t('originalNames')}</span><button class="copy" data-copy="${r.row}">${icon('copy')} ${t('copy')}</button></div><textarea class="copy-area" id="copy-${r.row}" readonly aria-label="${t('copy')}" hidden></textarea></details></div></article>`;}
function renderOutput(){const found=results();$('output').setAttribute('aria-label',t('results'));if(found.length){const count=found.length===1?t('one'):t('many').replace('{n}',found.length);$('output').innerHTML=`<div class="result-heading"><h2>${esc(state.family)}</h2><span>${count}</span></div><div class="results">${found.map((r,i)=>card(r,i,found.length)).join('')}</div>`;$('status').textContent=`${count}. ${t('level')}: ${state.level}.`;}else{const text=!state.group?t('start'):!state.family?t('familyPrompt'):t('levelPrompt');$('output').innerHTML=`<div class="empty"><div class="empty-icon">${icon('search')}</div><p>${text}</p>${!state.group?`<small>${t('startHint')}</small>`:''}</div>`;$('status').textContent=text;}}
function render(){renderFilters();renderOutput();}
function reset(){state.query='';state.group='';state.family='';state.level='';state.scopeFamilies=null;state.suggestions=[];$('groupSearch').value='';closeSuggestions();render();$('groupSearch').focus();}
function applyLanguage(lang){if(!I18N[lang])return;language=lang;document.documentElement.lang=lang;document.title=`${t('title')} · Role & Range`;for(const el of document.querySelectorAll('[data-t]'))el.textContent=t(el.dataset.t);$('languages').setAttribute('aria-label',t('language'));for(const b of $('languages').children){const active=b.dataset.lang===lang;b.classList.toggle('active',active);b.setAttribute('aria-pressed',String(active));}$('groupSearch').placeholder=t('searchPlaceholder');$('clearSearch').setAttribute('aria-label',t('clear'));$('source').textContent=`${t('source')}: ${SOURCE.source}`;$('toast').hidden=true;render();if(state.open)paintSuggestions();try{localStorage.setItem('role-range-language-v2',lang);}catch(_){} }
function showToast(text){clearTimeout(showToast.timer);$('toast').textContent=text;$('toast').hidden=false;showToast.timer=setTimeout(()=>$('toast').hidden=true,3200);}
function copyTextFor(r){const values={...r,structure:r.scale};return detailKeys.map(key=>`${t(key==='level'?'levelFull':key)}: ${['minimum','mid','maximum'].includes(key)?formatAmount(r[key]):displayValue(values[key])}`).join('\n')+`\n${t('source')}: ${SOURCE.source}, ${SOURCE.sheet}, ${t('row')} ${r.row}.\n${t('note')}`;}
async function copyRow(row){const r=data.find(r=>r.row===row);if(!r)return;const text=copyTextFor(r);try{if(navigator.clipboard&&window.isSecureContext){await navigator.clipboard.writeText(text);showToast(t('copied'));return;}}catch(_){}const area=$(`copy-${row}`);area.hidden=false;area.value=text;area.focus();area.select();try{if(document.execCommand('copy')){area.hidden=true;showToast(t('copied'));return;}}catch(_){}showToast(t('copyManual'));}
$('groupSearch').addEventListener('input',inputChanged);
$('groupSearch').addEventListener('focus',()=>{if(state.query&&!state.group){state.suggestions=suggest(state.query);state.open=true;paintSuggestions();}});
$('groupSearch').addEventListener('keydown',e=>{if(e.key==='Escape'){closeSuggestions();return;}if((e.key==='ArrowDown'||e.key==='ArrowUp')&&state.suggestions.length){e.preventDefault();state.open=true;const count=Math.min(10,state.suggestions.length);state.active=(state.active+(e.key==='ArrowDown'?1:-1)+count)%count;paintSuggestions();}if(e.key==='Enter'&&state.open&&state.suggestions.length){e.preventDefault();chooseSuggestion(Math.max(0,state.active));$('family').focus();}});
$('suggestions').addEventListener('click',e=>{const option=e.target.closest('[data-option]');if(option)chooseSuggestion(Number(option.dataset.option));});
document.addEventListener('click',e=>{if(!$('searchWrap').contains(e.target))closeSuggestions();});
$('family').addEventListener('change',()=>{state.family=$('family').value;const available=levelNames();if(!available.includes(state.level))state.level='';if(available.length===1)state.level=available[0];closeSuggestions();render();});
$('levels').addEventListener('click',e=>{const b=e.target.closest('[data-level]');if(!b)return;state.level=b.dataset.level;render();const active=$('levels').querySelector(`[data-level="${state.level}"]`);active?.focus({preventScroll:true});});
$('clearSearch').addEventListener('click',reset);$('reset').addEventListener('click',reset);
$('languages').addEventListener('click',e=>{const b=e.target.closest('[data-lang]');if(!b)return;applyLanguage(b.dataset.lang);if(window.parent!==window&&e.isTrusted)window.parent.postMessage({type:'rw:setLang',lang:b.dataset.lang},location.origin);});
window.addEventListener('message',e=>{if(window.parent!==window&&e.source===window.parent&&e.origin===location.origin&&e.data?.type==='rw:setLang')applyLanguage(e.data.lang);});
$('output').addEventListener('click',e=>{const b=e.target.closest('[data-copy]');if(b)copyRow(Number(b.dataset.copy));});
applyLanguage(language);
</script>
</body>
