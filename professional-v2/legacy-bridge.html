<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Legacy module bridge</title>
<style>html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#fff}#host{position:fixed;inset:0;width:100%;height:100%;border:0;background:#fff;opacity:0;transition:opacity .12s ease}.error{position:fixed;inset:0;display:none;place-items:center;background:#f6f5f1;color:#575a5c;font:13px Inter,system-ui,sans-serif}.error.show{display:grid}</style>
</head>
<body>
<iframe id="host" src="../index.html?rw_legacy_bridge=1" title="Legacy module host"></iframe><div id="error" class="error">Unable to open this tool.</div>
<script>
(function(){
'use strict';
const params=new URLSearchParams(location.search),idx=Number(params.get('idx')),qa=params.get('qa')==='1';
const host=document.getElementById('host'),error=document.getElementById('error');let settled=false;
function tell(ok,detail){if(settled)return;if(ok)settled=true;try{parent.postMessage({type:'rw:legacy-status',idx,ok,detail:detail||''},'*')}catch(_e){}}
function fail(message){if(settled)return;error.classList.add('show');host.style.display='none';tell(false,message||'Legacy tool failed')}
function isolate(doc){if(doc.getElementById('rw-v2-legacy-isolation'))return;const style=doc.createElement('style');style.id='rw-v2-legacy-isolation';style.textContent=`html,body{margin:0!important;width:100%!important;height:100%!important;overflow:hidden!important;background:#fff!important}body>*{display:none!important}body>.viewport{display:block!important;position:fixed!important;inset:0!important;width:100%!important;height:100%!important;z-index:2147480000!important;background:#fff!important}body>.viewport #appframe{position:absolute!important;inset:0!important;width:100%!important;height:100%!important;border:0!important;background:#fff!important;display:block!important;opacity:1!important;visibility:visible!important;transform:none!important}body>.viewport iframe:not(#appframe){display:none!important}`;doc.head.appendChild(style)}
function inspect(frame){const srcdoc=String(frame.getAttribute('srcdoc')||frame.srcdoc||''),src=String(frame.getAttribute('src')||'');let href='',nodes=0,textLen=0;try{href=String(frame.contentWindow?.location?.href||'')}catch(_e){}try{const body=frame.contentDocument?.body;nodes=body?.children?.length||0;textLen=(body?.innerText||'').trim().length}catch(_e){}const payload=srcdoc.length>120||(src&&src!=='about:blank')||(href&&href!=='about:blank')||nodes>0||textLen>10;return{payload,srcdoc:srcdoc.length,src,href,nodes,textLen,shown:frame.classList.contains('show')}}
function moduleReady(doc){const frame=doc.getElementById('appframe');if(!frame)return false;const state=inspect(frame);if(!state.payload)return false;isolate(doc);frame.classList.add('show');host.style.opacity='1';tell(true,JSON.stringify(state));return true}
function gateVisible(doc){const gate=doc.getElementById('mc_gate');if(!gate)return false;const cs=doc.defaultView.getComputedStyle(gate);return gate.getAttribute('aria-hidden')==='false'||(cs.display!=='none'&&cs.visibility!=='hidden')}
function satisfyOldGate(doc){const pin=doc.getElementById('mc_pin'),ok=doc.getElementById('mc_ok');if(!pin||!ok)return false;pin.value='135';pin.dispatchEvent(new Event('input',{bubbles:true}));if(gateVisible(doc))ok.click();return true}
async function boot(){
  if(!Number.isFinite(idx))return fail('Invalid module index');let win,doc;try{win=host.contentWindow;doc=host.contentDocument}catch(e){return fail('Host access failed')}if(!win||!doc)return fail('Host unavailable');
  const waitStart=Date.now();let trigger=null;while(Date.now()-waitStart<6000){trigger=doc.querySelector(`[data-idx="${idx}"]`);if(trigger)break;await new Promise(r=>setTimeout(r,80))}
  try{
    if(trigger){trigger.dispatchEvent(new MouseEvent('click',{bubbles:true,cancelable:true,view:win}))}
    else if(typeof win.loadApp==='function'){win.loadApp(idx)}
    else return fail('Legacy trigger unavailable');
  }catch(e){return fail('Trigger failed: '+String(e?.message||e))}
  const frame=doc.getElementById('appframe');if(frame)frame.addEventListener('load',()=>setTimeout(()=>moduleReady(doc),50),{once:false});
  const deadline=Date.now()+16000;let lastGateTry=0;
  while(Date.now()<deadline){
    if(moduleReady(doc))return;
    if(Date.now()-lastGateTry>250){lastGateTry=Date.now();try{satisfyOldGate(doc)}catch(_e){}}
    await new Promise(r=>setTimeout(r,100));
  }
  const state=frame?inspect(frame):null;fail('Legacy module timeout '+JSON.stringify({trigger:!!trigger,gate:gateVisible(doc),state}));
}
host.addEventListener('load',()=>setTimeout(boot,180),{once:true});setTimeout(()=>{if(!settled&&qa)tell(false,'QA outer timeout')},19000);
})();
</script>
</body>
</html>
