<!doctype html>
<html lang="pl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <title>Rafal Wilk AI Tool</title>
  <style>
    html,body{margin:0;min-height:100%;background:#fff;color:#111318;font-family:system-ui,-apple-system,"Segoe UI",sans-serif}
    .rw-loader{min-height:100vh;display:grid;place-items:center;padding:24px;text-align:center;background:#f5f3ee;color:#61646a}
    .rw-loader strong{display:block;color:#111318;margin-bottom:8px}.rw-loader p{margin:0;max-width:520px;line-height:1.6;font-size:13px}
  </style>
</head>
<body>
  <div class="rw-loader" id="rwLoader"><div><strong>Opening tool…</strong><p>The module is being prepared inside the Rafal Wilk AI workspace.</p></div></div>
  <script src="../assets/js/legacy-apps-bundle.js?v=20260727-cv-match-engine-4"></script>
  <script>
  (function(){
    'use strict';
    const params=new URLSearchParams(location.search);
    const idx=Number(params.get('idx'));
    const lang=(params.get('lang')||localStorage.getItem('rw_lang')||'pl').slice(0,2).toLowerCase();
    try{localStorage.setItem('rw_lang',lang);localStorage.setItem('doc_lang',lang);localStorage.setItem('supplier_lang',lang)}catch(_e){}
    function decodeUtf8Base64(value){
      const bin=atob(String(value||''));
      const bytes=new Uint8Array(bin.length);
      for(let i=0;i<bin.length;i++)bytes[i]=bin.charCodeAt(i);
      return new TextDecoder('utf-8').decode(bytes);
    }
    function encodeUtf8Base64(value){
      const bytes=new TextEncoder().encode(String(value||''));
      let bin='';
      const chunk=0x8000;
      for(let i=0;i<bytes.length;i+=chunk){
        bin+=String.fromCharCode(...bytes.subarray(i,Math.min(i+chunk,bytes.length)));
      }
      return btoa(bin);
    }
    function escapeAttr(value){return String(value).replace(/&/g,'&amp;').replace(/"/g,'&quot;').replace(/</g,'&lt;')}
    function showError(message){
      const el=document.getElementById('rwLoader');
      if(el)el.innerHTML='<div><strong>Unable to open this tool.</strong><p>'+String(message||'The module could not be loaded.')+'</p></div>';
      try{parent.postMessage({type:'rw:module-error',idx,detail:String(message||'Module error')},'*')}catch(_e){}
    }
    const SAFE_TRANSLATE_MERIT=`function translateMerit(){
      const setMeritText=function(id,value){const el=document.getElementById(id);if(el)el.textContent=value;};
      setMeritText('meritPanelTitle',mt('panelTitle'));
      setMeritText('meritPanelHint',mt('panelHint'));
      const moduleWrap=document.querySelector('.module-switch-wrap');
      const moduleTabs=document.querySelector('.module-switch[role="tablist"]');
      const billBtn=document.querySelector('.module-switch-btn[data-module-target="bill"]');
      const caoBtn=document.querySelector('.module-switch-btn[data-module-target="cao"]');
      if(moduleWrap)moduleWrap.setAttribute('aria-label',mt('moduleAria'));
      if(moduleTabs)moduleTabs.setAttribute('aria-label',mt('moduleAria'));
      if(billBtn)billBtn.textContent=mt('moduleBill');
      if(caoBtn)caoBtn.textContent=mt('moduleCao');
      setMeritText('meritScenarioLabel',mt('scenarioLabel'));
      setMeritText('meritScenarioOptionCao',mt('scenarioCao'));
      setMeritText('meritScenarioOptionManual',mt('scenarioManual'));
      setMeritText('meritYearLabel',mt('yearLabel'));
      setMeritText('meritPathwayLabel',mt('pathwayLabel'));
      setMeritText('meritMarkupLabel',mt('markupLabel'));
      setMeritText('meritScaleLabel',mt('scaleLabel'));
      setMeritText('meritLeftKicker',mt('leftKicker'));
      setMeritText('meritRightKicker',mt('rightKicker'));
      setMeritText('meritAgencyFactorLabel',mt('agencyFactorRow'));
      setMeritText('meritSystemInputLabel',mt('systemInputLabel'));
      setMeritText('meritSystemInputSub',mt('systemInputSub'));
      setMeritText('meritPctLabel',mt('meritPctLabel'));
      setMeritText('meritPctSub',mt('meritPctSub'));
      setMeritText('meritAnnualLabel',mt('annualLabel'));
      setMeritText('meritMonthlyLabel',mt('monthlyLabel'));
      setMeritText('meritBeforeMarkupTitle',mt('beforeMarkupTitle'));
      setMeritText('meritBeforeMarkupSub',mt('beforeMarkupSub'));
      setMeritText('meritAfterMarkupTitle',mt('afterMarkupTitle'));
      setMeritText('meritAfterMarkupSub',mt('afterMarkupSub'));
      setMeritText('meritCurrentSubtle',mt('currentSubtle'));
      setMeritText('meritCurrentTitle',mt('currentTitle'));
      setMeritText('meritNewSubtle',mt('newSubtle'));
      setMeritText('meritNewTitle',mt('newTitle'));
      setMeritText('meritScaleLookupTitle',mt('scaleLookupTitle'));
      setMeritText('meritMatrixTitle',mt('matrixTitle'));
      setScenarioUI(false);
      populatePathways();
      updateScaleButtons();
      calcMerit();
    }`;
    function patchRekentoolMasterInner(html){
      if(idx!==2)return html;
      const masterRe=/(['"]Master['"]\s*:\s*['"])([A-Za-z0-9+/=]+)(['"])/;
      const match=masterRe.exec(html);
      if(!match)return html;
      let inner=decodeUtf8Base64(match[2]);
      const fnRe=/function translateMerit\(\)\{[\s\S]*?setScenarioUI\(false\);\s*populatePathways\(\);\s*updateScaleButtons\(\);\s*calcMerit\(\);\s*\}/;
      if(!fnRe.test(inner))return html;
      inner=inner.replace(fnRe,SAFE_TRANSLATE_MERIT);
      const encoded=encodeUtf8Base64(inner);
      return html.slice(0,match.index)+match[1]+encoded+match[3]+html.slice(match.index+match[0].length);
    }
    function sanitizeMalformedInlineScripts(html){
      if(idx!==2)return html;
      const parsed=new DOMParser().parseFromString(html,'text/html');
      [...parsed.scripts].forEach(script=>{
        const type=(script.getAttribute('type')||'').trim().toLowerCase();
        if(script.src||type==='module'||(type&&type!=='text/javascript'&&type!=='application/javascript'))return;
        const code=script.textContent||'';
        if(!code.trim())return;
        try{new Function(code)}catch(_error){script.remove();}
      });
      return '<!doctype html>\n'+parsed.documentElement.outerHTML;
    }
    try{
      if(!Number.isFinite(idx))throw new Error('Invalid module index.');
      if(typeof APPS==='undefined'||!Array.isArray(APPS))throw new Error('Legacy application library is unavailable.');
      const app=APPS[idx];
      if(!app||!app.b64)throw new Error('Requested module was not found.');
      let html=decodeUtf8Base64(app.b64);
      html=patchRekentoolMasterInner(html);
      html=sanitizeMalformedInlineScripts(html);
      const absoluteBase=new URL('../',location.href).href;
      if(!/<base\b/i.test(html)){
        const baseTag='<base href="'+escapeAttr(absoluteBase)+'">';
        if(/<head\b[^>]*>/i.test(html))html=html.replace(/<head\b([^>]*)>/i,'<head$1>'+baseTag);
        else html=baseTag+html;
      }
      const blob=new Blob([html],{type:'text/html;charset=utf-8'});
      location.replace(URL.createObjectURL(blob));
    }catch(error){showError(error&&error.message?error.message:String(error));}
  })();
  </script>
</body>
</html>
