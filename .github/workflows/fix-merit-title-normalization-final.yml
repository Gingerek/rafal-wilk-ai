name: Fix Merit title normalization final
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/fix-merit-title-normalization-final.yml'
permissions:
  contents: write
jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Normalize title lookup and preserve workbook logic
        shell: bash
        run: |
          python3 - <<'PY'
          import os, re, tempfile, zipfile, xml.etree.ElementTree as ET

          FILE='downloads/Merit_2026_Employee_Bulk_Calculator_350_exact.xlsx'
          NS='http://schemas.openxmlformats.org/spreadsheetml/2006/main'
          XMLNS='http://www.w3.org/XML/1998/namespace'
          ET.register_namespace('',NS)
          ns={'m':NS}

          def display_clean(s):
              s='' if s is None else str(s)
              s=s.replace('\u00a0',' ').replace('\r',' ').replace('\n',' ').replace('\t',' ')
              return ' '.join(s.split())

          def norm_key(s):
              s=display_clean(s)
              for d in ['–','—','‑','−']:
                  s=s.replace(d,'-')
              return s.upper()

          def shared_strings(z):
              out=[]
              if 'xl/sharedStrings.xml' not in z.namelist(): return out
              root=ET.fromstring(z.read('xl/sharedStrings.xml'))
              for si in root.findall('m:si',ns):
                  out.append(''.join(t.text or '' for t in si.findall('.//m:t',ns)))
              return out

          def cell_text(c, shared):
              if c is None: return ''
              typ=c.get('t')
              if typ=='s':
                  v=c.find('m:v',ns)
                  return shared[int(v.text)] if v is not None and v.text else ''
              if typ=='inlineStr':
                  return ''.join(t.text or '' for t in c.findall('.//m:t',ns))
              v=c.find('m:v',ns)
              return '' if v is None or v.text is None else v.text

          def col_num(ref):
              letters=''.join(ch for ch in ref if ch.isalpha())
              n=0
              for ch in letters:
                  n=n*26+(ord(ch.upper())-64)
              return n

          def ensure_cell(sheet, ref):
              rownum=int(''.join(ch for ch in ref if ch.isdigit()))
              sd=sheet.find('m:sheetData',ns)
              row=None
              for r in sd.findall('m:row',ns):
                  if int(r.get('r'))==rownum:
                      row=r; break
              if row is None:
                  row=ET.Element(f'{{{NS}}}row',{'r':str(rownum)})
                  inserted=False
                  for i,r in enumerate(list(sd)):
                      if int(r.get('r'))>rownum:
                          sd.insert(i,row); inserted=True; break
                  if not inserted: sd.append(row)
              for c in row.findall('m:c',ns):
                  if c.get('r')==ref: return c
              c=ET.Element(f'{{{NS}}}c',{'r':ref})
              target=col_num(ref)
              inserted=False
              for i,existing in enumerate(list(row)):
                  if existing.tag==f'{{{NS}}}c' and col_num(existing.get('r'))>target:
                      row.insert(i,c); inserted=True; break
              if not inserted: row.append(c)
              return c

          def set_inline(c,text):
              for child in list(c):
                  if child.tag in {f'{{{NS}}}v',f'{{{NS}}}is',f'{{{NS}}}f'}:
                      c.remove(child)
              c.set('t','inlineStr')
              isel=ET.SubElement(c,f'{{{NS}}}is')
              t=ET.SubElement(isel,f'{{{NS}}}t')
              t.set(f'{{{XMLNS}}}space','preserve')
              t.text=str(text)

          def set_formula(c,formula):
              for child in list(c):
                  if child.tag in {f'{{{NS}}}v',f'{{{NS}}}is',f'{{{NS}}}f'}:
                      c.remove(child)
              if 't' in c.attrib: del c.attrib['t']
              f=ET.SubElement(c,f'{{{NS}}}f')
              f.text=formula[1:] if formula.startswith('=') else formula

          def norm_expr(row):
              b=f'$B{row}'
              return ('UPPER(TRIM(SUBSTITUTE(SUBSTITUTE(SUBSTITUTE(SUBSTITUTE(SUBSTITUTE('
                      f'CLEAN(SUBSTITUTE(SUBSTITUTE(SUBSTITUTE({b},CHAR(10)," "),CHAR(13)," "),CHAR(9)," ")),'
                      'CHAR(160)," "),"–","-"),"—","-"),"‑","-"),"−","-")))')

          def continuation():
              return 'OR(LEFT(n,12)="1 STAP BOVEN",LEFT(n,15)="2 STAPPEN BOVEN",LEFT(n,13)="QUALIFICATION",LEFT(n,23)="CQ=COMMISSIONING&QUAL")'

          def d_formula(row):
              n=norm_expr(row)
              fallback=('IF(OR(RIGHT(n,2)="P1",RIGHT(n,2)="P2",RIGHT(n,2)="P3",RIGHT(n,2)="P4",'
                        'RIGHT(n,2)="PS",ISNUMBER(SEARCH("INDUSTRIAL HYGIENIST",n))),"PS","GS")')
              custom=('AND(ISNUMBER(SEARCH("SITE ENGINEERING",n)),'
                      'OR(ISNUMBER(SEARCH("P1-F",n)),ISNUMBER(SEARCH("P1-G",n)),ISNUMBER(SEARCH("P3-J",n)),ISNUMBER(SEARCH("P2-H",n))))')
              return (f'=IF($B{row}="","",LET(n,{n},IF({continuation()},"",IF({custom},"GS",'
                      f'IFERROR(INDEX(\'Data\'!$R$2:$R$119,MATCH(n,\'Data\'!$P$2:$P$119,0)),{fallback})))))')

          def f_formula(row):
              n=norm_expr(row)
              fallback=('IF(ISNUMBER(SEARCH("INDUSTRIAL HYGIENIST",n)),'
                        'IF(OR(ISNUMBER(SEARCH("P2",n)),ISNUMBER(SEARCH(" II "," "&n&" ")),ISNUMBER(SEARCH(" 2 "," "&n&" "))),"H","G"),"")')
              general=f'IFERROR(INDEX(\'Data\'!$Q$2:$Q$119,MATCH(n,\'Data\'!$P$2:$P$119,0)),{fallback})'
              custom=(f'IF(AND(ISNUMBER(SEARCH("SITE ENGINEERING",n)),ISNUMBER(SEARCH("P1-F",n))),"F",'
                      f'IF(AND(ISNUMBER(SEARCH("SITE ENGINEERING",n)),ISNUMBER(SEARCH("P1-G",n))),"G",'
                      f'IF(AND(ISNUMBER(SEARCH("SITE ENGINEERING",n)),ISNUMBER(SEARCH("P3-J",n))),"J",'
                      f'IF(AND(ISNUMBER(SEARCH("SITE ENGINEERING",n)),ISNUMBER(SEARCH("P2-H",n))),"H",{general}))))')
              return f'=IF($B{row}="","",LET(n,{n},IF({continuation()},"",{custom})))'

          with zipfile.ZipFile(FILE,'r') as zin:
              shared=shared_strings(zin)
              s1=ET.fromstring(zin.read('xl/worksheets/sheet1.xml'))
              s2=ET.fromstring(zin.read('xl/worksheets/sheet2.xml'))
              wb=ET.fromstring(zin.read('xl/workbook.xml'))
              styles=ET.fromstring(zin.read('xl/styles.xml'))
              c1={c.get('r'):c for c in s1.findall('.//m:c',ns)}
              c2={c.get('r'):c for c in s2.findall('.//m:c',ns)}

              # Canonical 118 titles: one physical line, ordinary spaces, same on source list and Data sheet.
              titles=[]
              scales=[]
              suppliers=[]
              for r in range(2,120):
                  title=display_clean(cell_text(c1.get(f'U{r}'),shared))
                  if not title: raise RuntimeError(f'Missing authoritative title U{r}')
                  titles.append(title)
                  scales.append(cell_text(c2.get(f'B{r}'),shared))
                  suppliers.append(cell_text(c2.get(f'C{r}'),shared))
                  set_inline(ensure_cell(s1,f'U{r}'),title)
                  set_inline(ensure_cell(s2,f'A{r}'),title)

              # Internal normalized lookup keys. No visible title is duplicated; aliases are handled by Site Engineering rules.
              set_inline(ensure_cell(s2,'P1'),'Normalized Job Title Key (internal)')
              set_inline(ensure_cell(s2,'Q1'),'Salary Scale (internal)')
              set_inline(ensure_cell(s2,'R1'),'Supplier Type (internal)')
              seen={}
              for r,(title,scale,supplier) in enumerate(zip(titles,scales,suppliers),2):
                  key=norm_key(title)
                  if key in seen and seen[key]!=(scale,supplier):
                      raise RuntimeError(f'Conflicting normalized title: {title}')
                  seen[key]=(scale,supplier)
                  set_inline(ensure_cell(s2,f'P{r}'),key)
                  set_inline(ensure_cell(s2,f'Q{r}'),scale)
                  set_inline(ensure_cell(s2,f'R{r}'),supplier)

              # Robust formulas for every one of 350 employee rows. Write row-by-row; never autofill text literals.
              for r in range(5,355):
                  set_formula(ensure_cell(s1,f'D{r}'),d_formula(r))
                  set_formula(ensure_cell(s1,f'F{r}'),f_formula(r))

              # Force calculation when opened.
              calc=wb.find('m:calcPr',ns)
              if calc is None: calc=ET.SubElement(wb,f'{{{NS}}}calcPr')
              calc.set('calcMode','auto'); calc.set('fullCalcOnLoad','1'); calc.set('forceFullCalc','1')

              # Extend Data used range to helper columns.
              dim=s2.find('m:dimension',ns)
              if dim is not None: dim.set('ref','A1:R119')

              # Preserve protection / hidden formulas and prior upward-rounding change.
              if s1.find('m:sheetProtection',ns) is None: raise RuntimeError('Sheet protection missing')
              hidden=sum(1 for p in styles.findall('.//m:protection',ns) if p.get('hidden')=='1')
              if hidden<1: raise RuntimeError('Hidden formula styles missing')
              all_formulas=[f.text or '' for f in s1.findall('.//m:f',ns)]
              if any('ROUNDDOWN' in x.upper() for x in all_formulas): raise RuntimeError('ROUNDDOWN returned unexpectedly')
              if not any('ROUNDUP' in x.upper() for x in all_formulas): raise RuntimeError('ROUNDUP formulas missing')

              # Verify constants were not rewritten per row and all 118 keys are clean.
              f354=(ensure_cell(s1,'F354').find('m:f',ns).text or '')
              for token in ['P1-F','P1-G','P3-J','P2-H']:
                  if token not in f354: raise RuntimeError(f'Formula literal mutated: {token}')
              if any(('\n' in t or '\r' in t or '\u00a0' in t) for t in titles):
                  raise RuntimeError('Title cleanup failed')

              s1b=ET.tostring(s1,encoding='utf-8',xml_declaration=True)
              s2b=ET.tostring(s2,encoding='utf-8',xml_declaration=True)
              wbb=ET.tostring(wb,encoding='utf-8',xml_declaration=True)
              fd,tmp=tempfile.mkstemp(suffix='.xlsx'); os.close(fd)
              try:
                  with zipfile.ZipFile(tmp,'w') as zout:
                      for item in zin.infolist():
                          payload=zin.read(item.filename)
                          if item.filename=='xl/worksheets/sheet1.xml': payload=s1b
                          elif item.filename=='xl/worksheets/sheet2.xml': payload=s2b
                          elif item.filename=='xl/workbook.xml': payload=wbb
                          zout.writestr(item,payload)
                  os.replace(tmp,FILE)
              finally:
                  if os.path.exists(tmp): os.unlink(tmp)

          print('Merit title normalization complete: 118 titles, 350 rows, Site Engineering paste-safe lookup.')
          PY
      - name: Commit corrected workbook
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add downloads/Merit_2026_Employee_Bulk_Calculator_350_exact.xlsx
          if git diff --cached --quiet; then exit 0; fi
          git commit -m 'Make all Merit title lookups paste-safe'
          git push
