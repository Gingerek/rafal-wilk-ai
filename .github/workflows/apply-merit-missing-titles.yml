name: Apply verified Merit title update

on:
  push:
    branches:
      - agent/add-missing-merit-titles
    paths:
      - .github/workflows/apply-merit-missing-titles.yml

permissions:
  contents: write

jobs:
  update-workbook:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/add-missing-merit-titles

      - name: Add only missing Merit titles
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          from zipfile import ZipFile, ZIP_DEFLATED
          from html import escape
          import os, tempfile

          path = Path('downloads/Merit_2026_Employee_Bulk_Calculator_350_exact.xlsx')
          titles = [
              ('CQ engineer\u00a0 Site Engineering P1-G midpoint\u00a0\u00a0 (CQ=Commissioning&Qualification)\n1 stap boven mid', 'G', 'PS'),
              ('CQ engineer Site Engineering P1-F midpoint \u00a0\u00a0(CQ=Commissioning&Qualification)', 'F', 'PS'),
              ('CQ engineer Site Engineering P1-G Tussen midpoint en max.\u00a0\u00a0 (CQ=Commissioning&Qualification)', 'G', 'PS'),
              ('SPOC=Programma-manager Site Engineering\u00a0 P3-J\u00a0\u00a0Tussen midpoint en max.\n2 stappen boven mid 1 stap\u00a0 onder max', 'J', 'PS'),
              ('Projectmanager Site Engineering P2-H Tussen midpoint en max.\n2 stappen boven mid 1 stap onder max', 'H', 'PS'),
              ('Civil engineer Site Engineering P1-G midpoint 1 stap boven', 'G', 'PS'),
          ]

          with ZipFile(path, 'r') as zin:
              infos = zin.infolist()
              data = {info.filename: zin.read(info.filename) for info in infos}

          s1 = data['xl/worksheets/sheet1.xml'].decode('utf-8')
          s2 = data['xl/worksheets/sheet2.xml'].decode('utf-8')

          # Same formulas and same method; only extend existing lookup/list endpoints.
          if s1.count("$A$2:$C$113") != 350:
              raise RuntimeError('Unexpected supplier lookup formula count')
          if s1.count("$A$2:$B$113") != 350:
              raise RuntimeError('Unexpected scale lookup formula count')
          if s1.count("$U$2:$U$113") != 1:
              raise RuntimeError('Unexpected dropdown source count')
          s1 = s1.replace("$A$2:$C$113", "$A$2:$C$119")
          s1 = s1.replace("$A$2:$B$113", "$A$2:$B$119")
          s1 = s1.replace("$U$2:$U$113", "$U$2:$U$119")

          def text_cell(ref, value, style=None):
              style_attr = f' s="{style}"' if style else ''
              return f'<x:c r="{ref}"{style_attr} t="str"><x:v>{escape(value)}</x:v></x:c>'

          for idx, (title, scale, supplier) in enumerate(titles, start=114):
              # Hidden dropdown helper on Employee sheet.
              old = f'<x:c r="U{idx}" />'
              new = text_cell(f'U{idx}', title)
              if s1.count(old) != 1:
                  raise RuntimeError(f'Unexpected helper cell U{idx}')
              s1 = s1.replace(old, new, 1)

              # Data sheet: Job Title, Salary Scale, Supplier Type.
              a_style = '92' if idx == 114 else None
              b_style = '92' if idx == 114 else None
              old_a = f'<x:c r="A{idx}"' + (f' s="{a_style}"' if a_style else '') + ' />'
              old_b = f'<x:c r="B{idx}"' + (f' s="{b_style}"' if b_style else '') + ' />'
              old_c = f'<x:c r="C{idx}" />'
              for old_cell, new_cell in [
                  (old_a, text_cell(f'A{idx}', title, a_style)),
                  (old_b, text_cell(f'B{idx}', scale, b_style)),
                  (old_c, text_cell(f'C{idx}', supplier)),
              ]:
                  if s2.count(old_cell) != 1:
                      raise RuntimeError(f'Unexpected Data cell pattern at row {idx}: {old_cell}')
                  s2 = s2.replace(old_cell, new_cell, 1)

          # Guardrails: no old endpoints remain and all six source titles are present.
          if any(x in s1 for x in ("$A$2:$C$113", "$A$2:$B$113", "$U$2:$U$113")):
              raise RuntimeError('Old range endpoint remains')
          for title, scale, supplier in titles:
              if escape(title) not in s1 or escape(title) not in s2:
                  raise RuntimeError(f'Missing inserted title: {title}')

          data['xl/worksheets/sheet1.xml'] = s1.encode('utf-8')
          data['xl/worksheets/sheet2.xml'] = s2.encode('utf-8')

          fd, tmp_name = tempfile.mkstemp(suffix='.xlsx', dir=str(path.parent))
          os.close(fd)
          try:
              with ZipFile(tmp_name, 'w') as zout:
                  for info in infos:
                      # Retain entry metadata and original compression method.
                      zout.writestr(info, data[info.filename])
              with ZipFile(tmp_name, 'r') as check:
                  bad = check.testzip()
                  if bad:
                      raise RuntimeError(f'Corrupt ZIP member: {bad}')
              os.replace(tmp_name, path)
          finally:
              if os.path.exists(tmp_name):
                  os.unlink(tmp_name)
          PY

      - name: Commit only the workbook result
        shell: bash
        run: |
          rm -rf .tmp-merit-upload
          rm -f .github/workflows/apply-merit-missing-titles.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add downloads/Merit_2026_Employee_Bulk_Calculator_350_exact.xlsx
          git add -u .tmp-merit-upload .github/workflows/apply-merit-missing-titles.yml || true
          git diff --cached --quiet && { echo 'No changes produced'; exit 1; }
          git commit -m "Add missing Merit job titles"
          git push
