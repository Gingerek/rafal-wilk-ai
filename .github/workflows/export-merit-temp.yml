name: Export Merit workbook temporary
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/export-merit-temp.yml'
permissions:
  contents: read
jobs:
  export:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/upload-artifact@v4
        with:
          name: merit-current-xlsx
          path: downloads/Merit_2026_Employee_Bulk_Calculator_350_exact.xlsx
          if-no-files-found: error
          retention-days: 1
