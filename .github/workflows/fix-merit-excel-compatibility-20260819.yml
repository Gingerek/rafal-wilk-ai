name: Fix Merit Excel compatibility once
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/fix-merit-excel-compatibility-20260819.yml'
permissions:
  contents: write
jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Replace modern formulas with legacy-compatible formulas
        shell: bash
        run: |
          python3 - <<'PY'
          import os, re, tempfile, zipfile, xml.etree.ElementTree as ET
          FILE='downloads/Merit_2026_Employee_Bulk_Calculator_350_exact.xlsx'
          NS='http://schemas.openxmlformats.org/spreadsheetml/2006/main'
          XMLNS='http://www.w3.org/XML/1998/namespace'
          ET.register_namespace('',NS)
          ns={'m':NS}

          def shared_strings(z):
              out=[]
              if 'xl/sharedStrings.xml' not in z.namelist(): return out
              root=ET.fromstring(z.read('xl/sharedStrings.xml'))
              for si in root.findall('m:si',ns):
                  out.append(''.join(t.text or '' for t in si.findall('.//m:t',ns)))
              return out

          def cell_text(c, shared):
              if c is None: return ''
              typ=c.get('t')
              if typ=='s':
                  v=c.find('m:v',ns)
                  return shared[int(v.text)] if v is not None and v.text else ''
              if typ=='inlineStr':
                  return ''.join(t.text or '' for t in c.findall('.//m:t',ns))
              v=c.find('m:v',ns)
              return '' if v is None or v.text is None else v.text

          def col_num(ref):
              letters=''.join(ch for ch in ref if ch.isalpha())
              n=0
              for ch in letters: n=n*26+(ord(ch.upper())-64)
              return n

          def ensure_cell(sheet, ref):
              rownum=int(''.join(ch for ch in ref if ch.isdigit()))
              sd=sheet.find('m:sheetData',ns)
              row=None
              for r in sd.findall('m:row',ns):
                  if int(r.get('r'))==rownum: row=r; break
              if row is None:
                  row=ET.Element(f'{{{NS}}}row',{'r':str(rownum)})
                  inserted=False
                  for i,r in enumerate(list(sd)):
                      if int(r.get('r'))>rownum:
                          sd.insert(i,row); inserted=True; break
                  if not inserted: sd.append(row)
              for c in row.findall('m:c',ns):
                  if c.get('r')==ref: return c
              c=ET.Element(f'{{{NS}}}c',{'r':ref})
              target=col_num(ref)
              inserted=False
              for i,existing in enumerate(list(row)):
                  if existing.tag==f'{{{NS}}}c' and col_num(existing.get('r'))>target:
                      row.insert(i,c); inserted=True; break
              if not inserted: row.append(c)
              return c

          def set_inline(c,text):
              for child in list(c):
                  if child.tag in {f'{{{NS}}}v',f'{{{NS}}}is',f'{{{NS}}}f'}: c.remove(child)
              c.set('t','inlineStr')
              isel=ET.SubElement(c,f'{{{NS}}}is')
              t=ET.SubElement(isel,f'{{{NS}}}t')
              t.set(f'{{{XMLNS}}}space','preserve')
              t.text=str(text)

          def set_formula(c,formula):
              for child in list(c):
                  if child.tag in {f'{{{NS}}}v',f'{{{NS}}}is',f'{{{NS}}}f'}: c.remove(child)
              c.attrib.pop('t',None)
              f=ET.SubElement(c,f'{{{NS}}}f')
              f.text=formula[1:] if formula.startswith('=') else formula

          def clean_display(s):
              s='' if s is None else str(s)
              s=s.replace('\u00a0',' ').replace('\r',' ').replace('\n',' ').replace('\t',' ')
              return ' '.join(s.split())

          def norm_key(s):
              s=clean_display(s)
              for d in ['–','—','‑','−']: s=s.replace(d,'-')
              return s.upper()

          def norm_expr(row):
              b=f'$B{row}'
              return ('UPPER(TRIM(SUBSTITUTE(SUBSTITUTE(SUBSTITUTE(SUBSTITUTE(SUBSTITUTE('
                      f'CLEAN(SUBSTITUTE(SUBSTITUTE(SUBSTITUTE({b},CHAR(10)," "),CHAR(13)," "),CHAR(9)," ")),'
                      'CHAR(160)," "),"–","-"),"—","-"),"‑","-"),"−","-")))')

          def continuation(n):
              return (f'OR(LEFT({n},12)="1 STAP BOVEN",LEFT({n},15)="2 STAPPEN BOVEN",LEFT({n},13)="QUALIFICATION")')

          def supplier_formula(row):
              n=norm_expr(row)
              cont=continuation(n)
              site=(f'AND(ISNUMBER(SEARCH("SITE ENGINEERING",{n})),OR('
                    f'ISNUMBER(SEARCH("CQ ENGINEER",{n})),ISNUMBER(SEARCH("SPOC=PROGRAMMA-MANAGER",{n})),'
                    f'ISNUMBER(SEARCH("PROJECTMANAGER",{n})),ISNUMBER(SEARCH("CIVIL ENGINEER",{n}))))')
              fallback=(f'IF(OR(RIGHT({n},2)="P1",RIGHT({n},2)="P2",RIGHT({n},2)="P3",RIGHT({n},2)="P4",'
                        f'RIGHT({n},2)="PS",ISNUMBER(SEARCH("INDUSTRIAL HYGIENIST",{n}))),"PS","GS")')
              return (f'=IF($B{row}="","",IF({cont},"",IF({site},"GS",'
                      f'IFERROR(INDEX(\'Data\'!$R$2:$R$119,MATCH({n},\'Data\'!$P$2:$P$119,0)),{fallback}))))')

          def scale_formula(row):
              n=norm_expr(row)
              cont=continuation(n)
              fallback=(f'IF(ISNUMBER(SEARCH("INDUSTRIAL HYGIENIST",{n})),IF(OR('
                        f'ISNUMBER(SEARCH("P2",{n})),ISNUMBER(SEARCH(" II "," "&{n}&" ")),'
                        f'ISNUMBER(SEARCH(" 2 "," "&{n}&" "))),"H","G"),"")')
              general=(f'IFERROR(INDEX(\'Data\'!$Q$2:$Q$119,MATCH({n},\'Data\'!$P$2:$P$119,0)),{fallback})')
              return (f'=IF($B{row}="","",IF({cont},"",'
                      f'IF(AND(ISNUMBER(SEARCH("SITE ENGINEERING",{n})),ISNUMBER(SEARCH("P1-F",{n}))),"F",'
                      f'IF(AND(ISNUMBER(SEARCH("SITE ENGINEERING",{n})),ISNUMBER(SEARCH("P1-G",{n}))),"G",'
                      f'IF(AND(ISNUMBER(SEARCH("SITE ENGINEERING",{n})),ISNUMBER(SEARCH("P3-J",{n}))),"J",'
                      f'IF(AND(ISNUMBER(SEARCH("SITE ENGINEERING",{n})),ISNUMBER(SEARCH("P2-H",{n}))),"H",{general}))))))')

          special={
            114:('CQ engineer Site Engineering P1-G midpoint (CQ=Commissioning&Qualification)','G','GS'),
            115:('CQ engineer Site Engineering P1-F midpoint (CQ=Commissioning&Qualification)','F','GS'),
            116:('CQ engineer Site Engineering P1-G Tussen midpoint en max. (CQ=Commissioning&Qualification)','G','GS'),
            117:('SPOC=Programma-manager Site Engineering P3-J Tussen midpoint en max.','J','GS'),
            118:('Projectmanager Site Engineering P2-H Tussen midpoint en max.','H','GS'),
            119:('Civil engineer Site Engineering P1-G midpoint 1 stap boven','G','GS'),
          }

          with zipfile.ZipFile(FILE,'r') as zin:
              shared=shared_strings(zin)
              s1=ET.fromstring(zin.read('xl/worksheets/sheet1.xml'))
              s2=ET.fromstring(zin.read('xl/worksheets/sheet2.xml'))
              wb=ET.fromstring(zin.read('xl/workbook.xml'))
              styles=ET.fromstring(zin.read('xl/styles.xml'))
              c1={c.get('r'):c for c in s1.findall('.//m:c',ns)}
              c2={c.get('r'):c for c in s2.findall('.//m:c',ns)}

              for r,(title,scale,supplier) in special.items():
                  set_inline(ensure_cell(s1,f'U{r}'),title)
                  set_inline(ensure_cell(s2,f'A{r}'),title)
                  set_inline(ensure_cell(s2,f'B{r}'),scale)
                  set_inline(ensure_cell(s2,f'C{r}'),supplier)

              # Internal normalized lookup columns P:R.
              set_inline(ensure_cell(s2,'P1'),'Normalized Job Title Key (internal)')
              set_inline(ensure_cell(s2,'Q1'),'Salary Scale (internal)')
              set_inline(ensure_cell(s2,'R1'),'Supplier Type (internal)')
              for r in range(2,120):
                  title=cell_text(ensure_cell(s2,f'A{r}'),shared)
                  scale=cell_text(ensure_cell(s2,f'B{r}'),shared)
                  supplier=cell_text(ensure_cell(s2,f'C{r}'),shared)
                  set_inline(ensure_cell(s2,f'P{r}'),norm_key(title))
                  set_inline(ensure_cell(s2,f'Q{r}'),scale)
                  set_inline(ensure_cell(s2,f'R{r}'),supplier)

              # Only replace Supplier Type and Salary Scale formulas. All downstream merit logic stays untouched.
              for r in range(5,355):
                  set_formula(ensure_cell(s1,f'D{r}'),supplier_formula(r))
                  set_formula(ensure_cell(s1,f'F{r}'),scale_formula(r))

              calc=wb.find('m:calcPr',ns)
              if calc is None: calc=ET.SubElement(wb,f'{{{NS}}}calcPr')
              calc.set('calcMode','auto'); calc.set('fullCalcOnLoad','1'); calc.set('forceFullCalc','1')

              if s1.find('m:sheetProtection',ns) is None: raise RuntimeError('Sheet protection missing')
              hidden=sum(1 for p in styles.findall('.//m:protection',ns) if p.get('hidden')=='1')
              if hidden<1: raise RuntimeError('Hidden formula protection missing')
              formulas=[f.text or '' for f in s1.findall('.//m:f',ns)]
              if len(formulas)!=5600: raise RuntimeError(f'Unexpected formula count {len(formulas)}')
              if any('LET(' in x.upper() or 'XLOOKUP(' in x.upper() or '_XLFN.' in x.upper() for x in formulas):
                  raise RuntimeError('Modern Excel functions still present')
              if any('ROUNDDOWN' in x.upper() for x in formulas): raise RuntimeError('ROUNDDOWN unexpectedly present')
              if not any('ROUNDUP' in x.upper() for x in formulas): raise RuntimeError('ROUNDUP logic missing')

              s1b=ET.tostring(s1,encoding='utf-8',xml_declaration=True)
              s2b=ET.tostring(s2,encoding='utf-8',xml_declaration=True)
              wbb=ET.tostring(wb,encoding='utf-8',xml_declaration=True)
              fd,tmp=tempfile.mkstemp(suffix='.xlsx'); os.close(fd)
              try:
                  with zipfile.ZipFile(tmp,'w') as zout:
                      for item in zin.infolist():
                          payload=zin.read(item.filename)
                          if item.filename=='xl/worksheets/sheet1.xml': payload=s1b
                          elif item.filename=='xl/worksheets/sheet2.xml': payload=s2b
                          elif item.filename=='xl/workbook.xml': payload=wbb
                          zout.writestr(item,payload)
                  os.replace(tmp,FILE)
              finally:
                  if os.path.exists(tmp): os.unlink(tmp)

          # Audit after writing.
          with zipfile.ZipFile(FILE,'r') as z:
              s1=ET.fromstring(z.read('xl/worksheets/sheet1.xml'))
              fs=[f.text or '' for f in s1.findall('.//m:f',ns)]
              d5=next(c for c in s1.findall('.//m:c',ns) if c.get('r')=='D5').find('m:f',ns).text or ''
              f5=next(c for c in s1.findall('.//m:c',ns) if c.get('r')=='F5').find('m:f',ns).text or ''
              audit=[
                'formula_count='+str(len(fs)),
                'let_count='+str(sum(x.upper().count('LET(') for x in fs)),
                'xlookup_count='+str(sum(x.upper().count('XLOOKUP(') for x in fs)),
                'xlfn_count='+str(sum(x.upper().count('_XLFN.') for x in fs)),
                'rounddown_count='+str(sum(x.upper().count('ROUNDDOWN') for x in fs)),
                'roundup_count='+str(sum(x.upper().count('ROUNDUP') for x in fs)),
                'D5_length='+str(len(d5)),
                'F5_length='+str(len(f5)),
                'sheet_protection=true',
              ]
              open('merit_compat_audit.txt','w',encoding='utf-8').write('\n'.join(audit)+'\n')
              open('merit_compat_run_id.txt','w',encoding='utf-8').write(os.environ.get('GITHUB_RUN_ID','')+'\n')
          PY
      - name: Commit corrected workbook
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add downloads/Merit_2026_Employee_Bulk_Calculator_350_exact.xlsx merit_compat_audit.txt merit_compat_run_id.txt
          git commit -m 'Restore Merit Excel compatibility and paste-safe title lookup'
          git push
      - uses: actions/upload-artifact@v4
        with:
          name: merit-compat-verified
          path: downloads/Merit_2026_Employee_Bulk_Calculator_350_exact.xlsx
          retention-days: 1
