name: Professional V2 QA

on:
  push:
    branches: [main, professional-rebuild-v2]
    paths:
      - 'professional-v2/**'
      - 'modules/**'
      - 'downloads/**'
      - 'assets/js/legacy-apps-bundle.js'
      - '.github/workflows/professional-v2-qa.yml'
  workflow_dispatch:

concurrency:
  group: professional-v2-qa-${{ github.ref }}
  cancel-in-progress: true

jobs:
  chromium-qa:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install lightweight browser driver
        run: npm install --no-save playwright-core
      - name: Detect system Chrome
        run: |
          CHROME_BIN="$(which google-chrome-stable || which google-chrome || which chromium || which chromium-browser || true)"
          test -n "$CHROME_BIN"
          echo "CHROME_BIN=$CHROME_BIN" >> "$GITHUB_ENV"
          "$CHROME_BIN" --version
      - name: Start local site
        run: |
          python3 -m http.server 4173 > /tmp/rw-http.log 2>&1 &
          echo $! > /tmp/rw-http.pid
          sleep 2
      - name: Run full browser QA
        env:
          RW_BASE_URL: http://127.0.0.1:4173/professional-v2/index.html
        run: node professional-v2/qa-runner.js
      - name: Show server log on failure
        if: failure()
        run: cat /tmp/rw-http.log || true
