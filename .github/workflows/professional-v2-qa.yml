name: Professional V2 QA

on:
  push:
    branches: [professional-rebuild-v2]
    paths:
      - 'professional-v2/**'
      - '.github/workflows/professional-v2-qa.yml'
  workflow_dispatch:

jobs:
  chromium-qa:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install Playwright
        run: |
          npm init -y
          npm install --no-save @playwright/test
          npx playwright install --with-deps chromium
      - name: Start local site
        run: |
          python3 -m http.server 4173 > /tmp/rw-http.log 2>&1 &
          echo $! > /tmp/rw-http.pid
          sleep 2
      - name: Run full browser QA
        env:
          RW_BASE_URL: http://127.0.0.1:4173/professional-v2/index.html
        run: npx playwright test professional-v2/qa.spec.js --browser=chromium --reporter=line
      - name: Show server log on failure
        if: failure()
        run: cat /tmp/rw-http.log || true
