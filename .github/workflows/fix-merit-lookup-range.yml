name: Fix Merit lookup range once

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/fix-merit-lookup-range.yml'

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Extend Merit lookup range and preserve exact title keys
        shell: bash
        run: |
          python3 - <<'PY'
          import os, re, tempfile, zipfile, xml.etree.ElementTree as ET
          FILE='downloads/Merit_2026_Employee_Bulk_Calculator_350_exact.xlsx'
          NS='http://schemas.openxmlformats.org/spreadsheetml/2006/main'
          ET.register_namespace('',NS)
          ns={'m':NS}

          def cell_text(cell, shared):
              if cell is None: return ''
              t=cell.get('t')
              if t=='s':
                  v=cell.find('m:v',ns)
                  if v is not None and v.text is not None:
                      i=int(v.text); return shared[i] if 0 <= i < len(shared) else ''
              if t=='inlineStr':
                  return ''.join(x.text or '' for x in cell.findall('.//m:t',ns))
              v=cell.find('m:v',ns)
              return v.text or '' if v is not None else ''

          def set_inline(cell, text):
              for child in list(cell):
                  if child.tag in {f'{{{NS}}}v',f'{{{NS}}}is',f'{{{NS}}}f'}:
                      cell.remove(child)
              cell.set('t','inlineStr')
              isel=ET.SubElement(cell,f'{{{NS}}}is')
              t=ET.SubElement(isel,f'{{{NS}}}t')
              t.text=text

          with zipfile.ZipFile(FILE,'r') as zin:
              shared=[]
              if 'xl/sharedStrings.xml' in zin.namelist():
                  ss=ET.fromstring(zin.read('xl/sharedStrings.xml'))
                  for si in ss.findall('m:si',ns):
                      shared.append(''.join(t.text or '' for t in si.findall('.//m:t',ns)))
              sheet1=ET.fromstring(zin.read('xl/worksheets/sheet1.xml'))
              sheet2=ET.fromstring(zin.read('xl/worksheets/sheet2.xml'))
              workbook=ET.fromstring(zin.read('xl/workbook.xml'))

              main_cells={c.get('r'):c for c in sheet1.findall('.//m:c',ns)}
              data_cells={c.get('r'):c for c in sheet2.findall('.//m:c',ns)}

              targets=[
                ('CQ engineer', 'P1-G midpoint', 'Tussen midpoint en max.', 'G'),
                ('CQ engineer', 'P1-F midpoint', None, 'F'),
                ('CQ engineer', 'P1-G Tussen midpoint en max.', None, 'G'),
                ('SPOC=Programma-manager', None, None, 'J'),
                ('Projectmanager Site Engineering', None, None, 'H'),
                ('Civil engineer Site Engineering', None, None, 'G'),
              ]

              # Resolve exact visible title strings from column B. This avoids any spacing/NBSP mismatch.
              b_entries=[]
              for ref,c in main_cells.items():
                  if ref.startswith('B'):
                      txt=cell_text(c,shared)
                      if txt:
                          b_entries.append((ref,txt))

              exact=[]
              used=set()
              # Explicit matching order for the three CQ titles.
              patterns=[
                lambda s: 'CQ engineer' in s and 'P1-G midpoint' in s and 'Tussen midpoint en max.' not in s,
                lambda s: 'CQ engineer' in s and 'P1-F midpoint' in s,
                lambda s: 'CQ engineer' in s and 'P1-G' in s and 'Tussen midpoint en max.' in s,
                lambda s: 'SPOC=Programma-manager' in s,
                lambda s: 'Projectmanager Site Engineering' in s,
                lambda s: 'Civil engineer Site Engineering' in s,
              ]
              scales=['G','F','G','J','H','G']
              for pred,scale in zip(patterns,scales):
                  matches=[(r,t) for r,t in b_entries if pred(t) and r not in used]
                  if not matches:
                      raise RuntimeError(f'Could not find main-sheet title for scale {scale}')
                  r,t=matches[0]; used.add(r); exact.append((t,scale,'GS'))
                  print('MATCH',r,repr(t),scale)

              for i,(title,scale,supplier) in enumerate(exact,114):
                  for col,val in [('A',title),('B',scale),('C',supplier)]:
                      ref=f'{col}{i}'
                      c=data_cells.get(ref)
                      if c is None:
                          raise RuntimeError(f'Missing data cell {ref}')
                      set_inline(c,str(val))

              formula_count=0
              changed_ranges=0
              formulas_with_119=0
              for f in sheet1.findall('.//m:f',ns):
                  formula_count += 1
                  txt=f.text or ''
                  new=txt
                  if 'Data!' in txt or "'Data'!" in txt:
                      # Extend only lookup/reference ranges that previously ended on row 113.
                      new=re.sub(r'(\$[ABC]\$)113\b', r'\g<1>119', new)
                  if new != txt:
                      changed_ranges += 1
                      f.text=new
                  if '119' in new and ('Data!' in new or "'Data'!" in new):
                      formulas_with_119 += 1

              if formula_count != 5600:
                  raise RuntimeError(f'Unexpected formula count {formula_count}')
              if formulas_with_119 == 0:
                  raise RuntimeError('No formulas reference extended Data range through row 119')
              if sheet1.find('m:sheetProtection',ns) is None:
                  raise RuntimeError('Formula protection missing')

              calc=workbook.find('m:calcPr',ns)
              if calc is None:
                  calc=ET.SubElement(workbook,f'{{{NS}}}calcPr')
              calc.set('calcMode','auto')
              calc.set('fullCalcOnLoad','1')
              calc.set('forceFullCalc','1')

              sheet1_bytes=ET.tostring(sheet1,encoding='utf-8',xml_declaration=True)
              sheet2_bytes=ET.tostring(sheet2,encoding='utf-8',xml_declaration=True)
              wb_bytes=ET.tostring(workbook,encoding='utf-8',xml_declaration=True)
              fd,tmp=tempfile.mkstemp(suffix='.xlsx'); os.close(fd)
              try:
                  with zipfile.ZipFile(tmp,'w') as zout:
                      for item in zin.infolist():
                          data=zin.read(item.filename)
                          if item.filename=='xl/worksheets/sheet1.xml': data=sheet1_bytes
                          elif item.filename=='xl/worksheets/sheet2.xml': data=sheet2_bytes
                          elif item.filename=='xl/workbook.xml': data=wb_bytes
                          zout.writestr(item,data)
                  os.replace(tmp,FILE)
              finally:
                  if os.path.exists(tmp): os.unlink(tmp)

          print(f'Updated {changed_ranges} formula lookup references; {formulas_with_119} formulas now reference row 119.')
          PY
      - name: Commit corrected workbook
        shell: bash
        run: |
          FILE='downloads/Merit_2026_Employee_Bulk_Calculator_350_exact.xlsx'
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          if git diff --quiet -- "$FILE"; then
            echo 'No workbook change required.'
            exit 0
          fi
          git add "$FILE"
          git commit -m 'Fix Merit lookup range for added job titles'
          git push
