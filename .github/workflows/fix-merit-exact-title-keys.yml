name: Apply exact Merit title keys once

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/fix-merit-exact-title-keys.yml'

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Write exact source title keys
        shell: bash
        run: |
          python3 - <<'PY'
          import os, tempfile, zipfile, xml.etree.ElementTree as ET
          FILE='downloads/Merit_2026_Employee_Bulk_Calculator_350_exact.xlsx'
          NS='http://schemas.openxmlformats.org/spreadsheetml/2006/main'
          ET.register_namespace('',NS)
          ns={'m':NS}
          rows=[
            ('CQ engineer\u00a0 Site Engineering P1-G midpoint\u00a0\u00a0 (CQ=Commissioning&Qualification)','G','GS'),
            ('CQ engineer Site Engineering P1-F midpoint \u00a0\u00a0(CQ=Commissioning&Qualification)','F','GS'),
            ('CQ engineer Site Engineering P1-G Tussen midpoint en max.\u00a0\u00a0 (CQ=Commissioning&Qualification)','G','GS'),
            ('SPOC=Programma-manager Site Engineering\u00a0 P3-J\u00a0\u00a0Tussen midpoint en max.','J','GS'),
            ('Projectmanager Site Engineering P2-H Tussen midpoint en max.','H','GS'),
            ('Civil engineer Site Engineering P1-G midpoint 1 stap boven','G','GS'),
          ]
          with zipfile.ZipFile(FILE,'r') as zin:
            s2=ET.fromstring(zin.read('xl/worksheets/sheet2.xml'))
            s1=ET.fromstring(zin.read('xl/worksheets/sheet1.xml'))
            cells={c.get('r'):c for c in s2.findall('.//m:c',ns)}
            def set_inline(cell,text):
              for child in list(cell):
                if child.tag in {f'{{{NS}}}v',f'{{{NS}}}is',f'{{{NS}}}f'}:
                  cell.remove(child)
              cell.set('t','inlineStr')
              isel=ET.SubElement(cell,f'{{{NS}}}is')
              t=ET.SubElement(isel,f'{{{NS}}}t')
              if text.startswith(' ') or text.endswith(' ') or '\u00a0' in text:
                t.set('{http://www.w3.org/XML/1998/namespace}space','preserve')
              t.text=text
            for i,(title,scale,supplier) in enumerate(rows,114):
              for col,val in [('A',title),('B',scale),('C',supplier)]:
                c=cells.get(f'{col}{i}')
                if c is None: raise RuntimeError(f'Missing {col}{i}')
                set_inline(c,val)
            fs=s1.findall('.//m:f',ns)
            if len(fs)!=5600: raise RuntimeError(f'Unexpected formula count {len(fs)}')
            if not any("'Data'!$A$2:$B$119" in (f.text or '') for f in fs):
              raise RuntimeError('Salary scale lookup does not include row 119')
            if s1.find('m:sheetProtection',ns) is None:
              raise RuntimeError('Formula protection missing')
            s2b=ET.tostring(s2,encoding='utf-8',xml_declaration=True)
            fd,tmp=tempfile.mkstemp(suffix='.xlsx'); os.close(fd)
            try:
              with zipfile.ZipFile(tmp,'w') as zout:
                for item in zin.infolist():
                  data=zin.read(item.filename)
                  if item.filename=='xl/worksheets/sheet2.xml': data=s2b
                  zout.writestr(item,data)
              os.replace(tmp,FILE)
            finally:
              if os.path.exists(tmp): os.unlink(tmp)
          print('Exact six source keys written; formulas and protection verified.')
          PY
      - name: Commit workbook
        shell: bash
        run: |
          FILE='downloads/Merit_2026_Employee_Bulk_Calculator_350_exact.xlsx'
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add "$FILE"
          if git diff --cached --quiet; then
            echo 'No workbook change required.'
            exit 0
          fi
          git commit -m 'Match Merit lookup keys to original source text'
          git push
