name: Fix missing Merit mappings once

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/fix-merit-missing-mappings.yml'

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Normalize six Merit title mappings
        shell: bash
        run: |
          python3 - <<'PY'
          import os, tempfile, zipfile, xml.etree.ElementTree as ET
          FILE='downloads/Merit_2026_Employee_Bulk_Calculator_350_exact.xlsx'
          NS='http://schemas.openxmlformats.org/spreadsheetml/2006/main'
          ET.register_namespace('',NS)
          rows=[
            ('CQ engineer Site Engineering P1-G midpoint (CQ=Commissioning&Qualification)','G','GS'),
            ('CQ engineer Site Engineering P1-F midpoint (CQ=Commissioning&Qualification)','F','GS'),
            ('CQ engineer Site Engineering P1-G Tussen midpoint en max. (CQ=Commissioning&Qualification)','G','GS'),
            ('SPOC=Programma-manager Site Engineering P3-J Tussen midpoint en max.','J','GS'),
            ('Projectmanager Site Engineering P2-H Tussen midpoint en max.','H','GS'),
            ('Civil engineer Site Engineering P1-G midpoint 1 stap boven','G','GS'),
          ]
          with zipfile.ZipFile(FILE,'r') as zin:
            sheet2=ET.fromstring(zin.read('xl/worksheets/sheet2.xml'))
            cells={c.get('r'):c for c in sheet2.findall(f'.//{{{NS}}}c')}
            updates={}
            for i,row in enumerate(rows,114):
              updates[f'A{i}']=row[0]; updates[f'B{i}']=row[1]; updates[f'C{i}']=row[2]
            for ref,val in updates.items():
              c=cells.get(ref)
              if c is None:
                raise RuntimeError(f'Missing cell {ref}')
              for child in list(c):
                if child.tag in {f'{{{NS}}}v',f'{{{NS}}}is',f'{{{NS}}}f'}:
                  c.remove(child)
              c.set('t','inlineStr')
              isel=ET.SubElement(c,f'{{{NS}}}is')
              t=ET.SubElement(isel,f'{{{NS}}}t')
              t.text=str(val)
            # Verify formula protection on main sheet remains in place.
            sheet1=ET.fromstring(zin.read('xl/worksheets/sheet1.xml'))
            if len(sheet1.findall(f'.//{{{NS}}}f')) != 5600:
              raise RuntimeError('Formula count changed unexpectedly')
            if sheet1.find(f'{{{NS}}}sheetProtection') is None:
              raise RuntimeError('Formula protection missing')
            new_sheet2=ET.tostring(sheet2,encoding='utf-8',xml_declaration=True)
            fd,tmp=tempfile.mkstemp(suffix='.xlsx'); os.close(fd)
            try:
              with zipfile.ZipFile(tmp,'w') as zout:
                for item in zin.infolist():
                  data=zin.read(item.filename)
                  if item.filename=='xl/worksheets/sheet2.xml':
                    data=new_sheet2
                  zout.writestr(item,data)
              os.replace(tmp,FILE)
            finally:
              if os.path.exists(tmp): os.unlink(tmp)
          print('Six Merit title mappings normalized; formulas and protection preserved.')
          PY
      - name: Commit corrected workbook
        shell: bash
        run: |
          FILE='downloads/Merit_2026_Employee_Bulk_Calculator_350_exact.xlsx'
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          if git diff --quiet -- "$FILE"; then
            echo 'No workbook change required.'
            exit 0
          fi
          git add "$FILE"
          git commit -m 'Fix six missing Merit salary scale mappings'
          git push
