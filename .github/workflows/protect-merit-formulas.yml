name: Protect Merit Excel formulas once

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/protect-merit-formulas.yml'

permissions:
  contents: write

jobs:
  protect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Hide formulas and keep input cells editable
        shell: bash
        run: |
          python3 - <<'PY'
          import copy
          import os
          import re
          import tempfile
          import zipfile
          import xml.etree.ElementTree as ET

          FILE = 'downloads/Merit_2026_Employee_Bulk_Calculator_350_exact.xlsx'
          NS = 'http://schemas.openxmlformats.org/spreadsheetml/2006/main'
          ET.register_namespace('', NS)
          ns = {'m': NS}

          def col_row(ref):
              m = re.match(r'([A-Z]+)([0-9]+)$', ref or '')
              return (m.group(1), int(m.group(2))) if m else ('', 0)

          with zipfile.ZipFile(FILE, 'r') as zin:
              styles_root = ET.fromstring(zin.read('xl/styles.xml'))
              sheet_root = ET.fromstring(zin.read('xl/worksheets/sheet1.xml'))
              cellxfs = styles_root.find('m:cellXfs', ns)
              if cellxfs is None:
                  raise RuntimeError('cellXfs not found')

              style_cache_hidden = {}
              style_cache_unlocked = {}

              def clone_style(style_id, hidden=False, unlocked=False):
                  cache = style_cache_hidden if hidden else style_cache_unlocked
                  if style_id in cache:
                      return cache[style_id]
                  src = list(cellxfs)[style_id]
                  xf = copy.deepcopy(src)
                  xf.set('applyProtection', '1')
                  prot = xf.find('m:protection', ns)
                  if prot is None:
                      prot = ET.SubElement(xf, f'{{{NS}}}protection')
                  if hidden:
                      prot.set('locked', '1')
                      prot.set('hidden', '1')
                  elif unlocked:
                      prot.set('locked', '0')
                      prot.set('hidden', '0')
                  cellxfs.append(xf)
                  cellxfs.set('count', str(len(cellxfs)))
                  new_id = len(cellxfs) - 1
                  cache[style_id] = new_id
                  return new_id

              formula_count = 0
              unlocked_count = 0
              for cell in sheet_root.findall('.//m:c', ns):
                  ref = cell.get('r', '')
                  style_id = int(cell.get('s', '0'))
                  formula = cell.find('m:f', ns)
                  if formula is not None:
                      cell.set('s', str(clone_style(style_id, hidden=True)))
                      formula_count += 1
                      continue
                  col, row = col_row(ref)
                  if 5 <= row <= 354 and col in {'A', 'B', 'C'}:
                      cell.set('s', str(clone_style(style_id, unlocked=True)))
                      unlocked_count += 1

              old = sheet_root.find('m:sheetProtection', ns)
              if old is not None:
                  sheet_root.remove(old)
              sheet_data = sheet_root.find('m:sheetData', ns)
              if sheet_data is None:
                  raise RuntimeError('sheetData not found')
              children = list(sheet_root)
              idx = children.index(sheet_data) + 1
              sheet_root.insert(idx, ET.Element(f'{{{NS}}}sheetProtection', {'sheet': '1'}))

              styles_bytes = ET.tostring(styles_root, encoding='utf-8', xml_declaration=True)
              sheet_bytes = ET.tostring(sheet_root, encoding='utf-8', xml_declaration=True)

              fd, tmp = tempfile.mkstemp(suffix='.xlsx')
              os.close(fd)
              try:
                  with zipfile.ZipFile(tmp, 'w') as zout:
                      for item in zin.infolist():
                          data = zin.read(item.filename)
                          if item.filename == 'xl/styles.xml':
                              data = styles_bytes
                          elif item.filename == 'xl/worksheets/sheet1.xml':
                              data = sheet_bytes
                          zout.writestr(item, data)
                  os.replace(tmp, FILE)
              finally:
                  if os.path.exists(tmp):
                      os.unlink(tmp)

          if formula_count != 5600:
              raise RuntimeError(f'Expected 5600 formulas, found {formula_count}')
          if unlocked_count != 1050:
              raise RuntimeError(f'Expected 1050 editable input cells, found {unlocked_count}')
          print(f'Protected {formula_count} formula cells; kept {unlocked_count} input cells editable.')
          PY
      - name: Commit protected workbook
        shell: bash
        run: |
          FILE='downloads/Merit_2026_Employee_Bulk_Calculator_350_exact.xlsx'
          if git diff --quiet -- "$FILE"; then
            echo 'No workbook change required.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add "$FILE"
          git commit -m 'Hide Merit Excel formulas'
          git push
