name: Fix Merit titles and upward rounding once
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/fix-merit-rounding-and-titles.yml'
permissions:
  contents: write
jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Patch workbook and verify
        shell: bash
        run: |
          python3 - <<'PY'
          import hashlib, os, tempfile, zipfile
          import xml.etree.ElementTree as ET

          FILE='downloads/Merit_2026_Employee_Bulk_Calculator_350_exact.xlsx'
          NS='http://schemas.openxmlformats.org/spreadsheetml/2006/main'
          XMLNS='http://www.w3.org/XML/1998/namespace'
          ET.register_namespace('',NS)
          ns={'m':NS}

          def read_shared(z):
              out=[]
              if 'xl/sharedStrings.xml' not in z.namelist():
                  return out
              root=ET.fromstring(z.read('xl/sharedStrings.xml'))
              for si in root.findall('m:si',ns):
                  out.append(''.join(t.text or '' for t in si.findall('.//m:t',ns)))
              return out

          def cell_text(c, shared):
              if c is None:
                  return ''
              typ=c.get('t')
              if typ=='s':
                  v=c.find('m:v',ns)
                  if v is not None and v.text is not None:
                      return shared[int(v.text)]
                  return ''
              if typ=='inlineStr':
                  return ''.join(t.text or '' for t in c.findall('.//m:t',ns))
              v=c.find('m:v',ns)
              return '' if v is None or v.text is None else v.text

          def set_inline(c, text):
              for child in list(c):
                  if child.tag in {f'{{{NS}}}v',f'{{{NS}}}is',f'{{{NS}}}f'}:
                      c.remove(child)
              c.set('t','inlineStr')
              isel=ET.SubElement(c,f'{{{NS}}}is')
              t=ET.SubElement(isel,f'{{{NS}}}t')
              t.set(f'{{{XMLNS}}}space','preserve')
              t.text=text

          with zipfile.ZipFile(FILE,'r') as zin:
              shared=read_shared(zin)
              s1=ET.fromstring(zin.read('xl/worksheets/sheet1.xml'))
              s2=ET.fromstring(zin.read('xl/worksheets/sheet2.xml'))
              wb=ET.fromstring(zin.read('xl/workbook.xml'))
              styles=ET.fromstring(zin.read('xl/styles.xml'))

              cells1={c.get('r'):c for c in s1.findall('.//m:c',ns)}
              cells2={c.get('r'):c for c in s2.findall('.//m:c',ns)}

              # Authoritative job-title source is U2:U119. Copy each source title
              # exactly to Data!A2:A119 so embedded line breaks/NBSP stay inside
              # ONE cell and every exact VLOOKUP key matches 1:1.
              source_titles=[]
              for row in range(2,120):
                  title=cell_text(cells1.get(f'U{row}'), shared)
                  source_titles.append(title)
                  target=cells2.get(f'A{row}')
                  if target is None:
                      raise RuntimeError(f'Missing Data!A{row}')
                  set_inline(target,title)

              if len(source_titles)!=118 or any(not x for x in source_titles):
                  raise RuntimeError('Authoritative title list is incomplete')

              # Change only explicit downward rounding functions. Keep exactly
              # the same decimal arguments and surrounding calculation logic.
              formulas=s1.findall('.//m:f',ns)
              if len(formulas)!=5600:
                  raise RuntimeError(f'Unexpected formula count before edit: {len(formulas)}')
              down_before=sum((f.text or '').upper().count('ROUNDDOWN') for f in formulas)
              if down_before!=1050:
                  raise RuntimeError(f'Expected 1050 ROUNDDOWN occurrences, found {down_before}')
              for f in formulas:
                  if f.text:
                      f.text=f.text.replace('ROUNDDOWN','ROUNDUP')
              down_after=sum((f.text or '').upper().count('ROUNDDOWN') for f in formulas)
              up_after=sum((f.text or '').upper().count('ROUNDUP') for f in formulas)
              if down_after!=0 or up_after!=1050:
                  raise RuntimeError(f'Rounding verification failed: down={down_after}, up={up_after}')

              # Force Excel to recalculate the changed formulas on opening.
              calc=wb.find('m:calcPr',ns)
              if calc is None:
                  calc=ET.SubElement(wb,f'{{{NS}}}calcPr')
              calc.set('calcMode','auto')
              calc.set('fullCalcOnLoad','1')
              calc.set('forceFullCalc','1')

              # Preserve formula hiding/protection and validations.
              if s1.find('m:sheetProtection',ns) is None:
                  raise RuntimeError('Sheet protection missing before write')
              hidden_styles=sum(1 for p in styles.findall('.//m:protection',ns) if p.get('hidden')=='1')
              if hidden_styles < 1:
                  raise RuntimeError('Hidden-formula styles missing')
              dv_count=len(s1.findall('.//m:dataValidation',ns))
              if dv_count < 1:
                  raise RuntimeError('Data validation missing')

              s1b=ET.tostring(s1,encoding='utf-8',xml_declaration=True)
              s2b=ET.tostring(s2,encoding='utf-8',xml_declaration=True)
              wbb=ET.tostring(wb,encoding='utf-8',xml_declaration=True)

              fd,tmp=tempfile.mkstemp(suffix='.xlsx'); os.close(fd)
              try:
                  with zipfile.ZipFile(tmp,'w') as zout:
                      for item in zin.infolist():
                          payload=zin.read(item.filename)
                          if item.filename=='xl/worksheets/sheet1.xml': payload=s1b
                          elif item.filename=='xl/worksheets/sheet2.xml': payload=s2b
                          elif item.filename=='xl/workbook.xml': payload=wbb
                          zout.writestr(item,payload)
                  os.replace(tmp,FILE)
              finally:
                  if os.path.exists(tmp): os.unlink(tmp)

          # Re-open final file and independently verify exact titles and protections.
          with zipfile.ZipFile(FILE,'r') as z:
              shared=read_shared(z)
              s1=ET.fromstring(z.read('xl/worksheets/sheet1.xml'))
              s2=ET.fromstring(z.read('xl/worksheets/sheet2.xml'))
              styles=ET.fromstring(z.read('xl/styles.xml'))
              c1={c.get('r'):c for c in s1.findall('.//m:c',ns)}
              c2={c.get('r'):c for c in s2.findall('.//m:c',ns)}
              u=[cell_text(c1.get(f'U{r}'),shared) for r in range(2,120)]
              a=[cell_text(c2.get(f'A{r}'),shared) for r in range(2,120)]
              fs=s1.findall('.//m:f',ns)
              down=sum((f.text or '').upper().count('ROUNDDOWN') for f in fs)
              up=sum((f.text or '').upper().count('ROUNDUP') for f in fs)
              protected=s1.find('m:sheetProtection',ns) is not None
              hidden=sum(1 for p in styles.findall('.//m:protection',ns) if p.get('hidden')=='1')
              dvs=len(s1.findall('.//m:dataValidation',ns))
              if u!=a:
                  raise RuntimeError('Final title lookup list does not exactly match source list')
              if len(fs)!=5600 or down!=0 or up!=1050 or not protected or hidden<1 or dvs<1:
                  raise RuntimeError('Final workbook verification failed')
              sha=hashlib.sha256(open(FILE,'rb').read()).hexdigest()
              audit=[
                  'titles_exact_match=true',
                  'title_count=118',
                  'formula_count=5600',
                  'rounddown_occurrences=0',
                  'roundup_occurrences=1050',
                  f'sheet_protection={str(protected).lower()}',
                  f'hidden_formula_styles={hidden}',
                  f'data_validation_rules={dvs}',
                  'cq_multiline_one_cell='+repr(u[112]),
                  'spoc_multiline_one_cell='+repr(u[115]),
                  'projectmanager_multiline_one_cell='+repr(u[116]),
                  'sha256='+sha,
              ]
              open('merit_fix_audit.txt','w',encoding='utf-8').write('\n'.join(audit)+'\n')
          PY
      - name: Commit verified workbook
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add downloads/Merit_2026_Employee_Bulk_Calculator_350_exact.xlsx merit_fix_audit.txt
          git commit -m 'Fix Merit one-cell titles and round calculations upward'
          git push
